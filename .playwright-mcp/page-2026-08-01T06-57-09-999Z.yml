        - generic [ref=e123]: 简介： 黑马点评回顾 redis实现共享session
        - generic [ref=e130]:
          - heading "传统session缺点" [level=2] [ref=e131]
          - paragraph [ref=e132]:
            - text: 传统单体项目一般是把session存入
            - link "tomcat" [ref=e133] [cursor=pointer]:
              - /url: https://so.csdn.net/so/search?spm=a2c6h.13046898.publish-article.38.4de26ffaydgqOl&q=tomcat
            - text: ，但是每个tomcat中都有一份属于自己的session,假设用户第一次访问第一台tomcat，并且把自己的信息存放到第一台服务器的session中，但是第二次这个用户访问到了第二台tomcat，那么在第二台服务器上，肯定没有第一台服务器存放的session，所以此时 整个登录拦截功能就会出现问题。为了解决这个问题，我们用redis作为中间件，把用户的信息存入redis中，这样不同tomcat在检验用户是否登陆时，都向redis请求数据，这样就可以在不同的tomcat进行session共享。
          - heading "整体访问流程" [level=2] [ref=e134]
          - paragraph [ref=e135]:
            - text: 用户去登录会去校验用户提交的手机号和验证码，是否一致，如果一致，则根据手机号查询用户信息，不存在则新建，最后将用户数据保存到
            - link "redis" [ref=e136] [cursor=pointer]:
              - /url: https://so.csdn.net/so/search?spm=a2c6h.13046898.publish-article.39.4de26ffaydgqOl&q=redis
            - text: ，并且生成token作为redis的key，当我们校验用户是否登录时，会去携带着token进行访问，从redis中取出token对应的value，判断是否存在这个数据，如果没有则拦截，如果存在则将其保存到threadLocal中，并且放行。
          - paragraph [ref=e137]:
            - generic [ref=e138]: 
