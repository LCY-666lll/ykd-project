          - heading "问题" [level=2] [ref=e334]
          - paragraph [ref=e335]: 上面的代码仍然存在问题,就是session刷新问题，原本利用HttpSession，每次访问就刷新，session维持时间就会刷新，然而我们上面的代码是利用redis作为中间件共享session不能自动刷新，为了解决这个问题，我们需要自己设置拦截器进行手动刷新。
          - heading "具体思路" [level=3] [ref=e336]
          - paragraph [ref=e337]: 首先我们要配置一个拦截器，它把他的优先设为最高，他拦截一切路径，然后它的方法内每次拦截的时候，都会检查redis中是否有session，如果有就刷新session，这样就可以维持session维持的时间。
