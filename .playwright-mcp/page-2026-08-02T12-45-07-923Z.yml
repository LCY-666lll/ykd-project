          - link "简单介绍一下 Java 集合" [ref=e4120] [cursor=pointer]:
            - /url: "#简单介绍一下-java-集合"
        - paragraph [ref=e4121]:
          - text: Java 集合，也叫作容器，主要是由两大接口派生而来：一个是
          - code [ref=e4122]: Collection
          - text: 接口，主要用于存放单一元素；另一个是
          - code [ref=e4123]: Map
          - text: 接口，主要用于存放键值对。对于
          - code [ref=e4124]: Collection
          - text: 接口，下面又有三个主要的子接口：
          - code [ref=e4125]: List
          - text: 、
          - code [ref=e4126]: Set
          - text: 、
          - code [ref=e4127]: Queue
          - text: 。
        - paragraph [ref=e4128]: Java 集合框架如下图所示：
        - paragraph [ref=e4129]:
          - img "Java 集合框架概览" [ref=e4130]
        - paragraph [ref=e4131]:
          - text: 注：图中只列举了主要的继承派生关系，并没有列举所有关系。比方省略了
          - code [ref=e4132]: AbstractList
          - text: ","
          - code [ref=e4133]: NavigableSet
          - text: 等抽象类以及其他的一些辅助类，如想深入了解，可自行查看源码。
        - heading [level=3] [ref=e4134]:
          - link "说说 List, Set, Queue, Map 四者的区别？" [ref=e4135] [cursor=pointer]:
            - /url: "#说说-list-set-queue-map-四者的区别"
        - list [ref=e4136]:
          - listitem [ref=e4137]:
            - code [ref=e4138]: List
            - text: "(对付顺序的好帮手): 存储的元素是有序的、可重复的。"
          - listitem [ref=e4139]:
            - code [ref=e4140]: Set
            - text: "(注重独一无二的性质): 存储的元素不可重复的。"
          - listitem [ref=e4141]:
            - code [ref=e4142]: Queue
            - text: "(实现排队功能的叫号机): 按特定的排队规则来确定先后顺序，存储的元素是有序的、可重复的。"
          - listitem [ref=e4143]:
            - code [ref=e4144]: Map
