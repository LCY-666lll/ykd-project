        - paragraph [ref=e4261]: 对于插入：
        - list [ref=e4262]:
          - listitem [ref=e4263]: 头部插入：由于需要将所有元素都依次向后移动一个位置，因此时间复杂度是 O(n)。
          - listitem [ref=e4264]:
            - text: 尾部插入：当
            - code [ref=e4265]: ArrayList
            - text: 的容量未达到极限时，往列表末尾插入元素的时间复杂度是 O(1)，因为它只需要在数组末尾添加一个元素即可；当容量已达到极限并且需要扩容时，则需要执行一次 O(n) 的操作将原数组复制到新的更大的数组中，然后再执行 O(1) 的操作添加元素。
          - listitem [ref=e4266]: 指定位置插入：需要将目标位置之后的所有元素都向后移动一个位置，然后再把新元素放入指定位置。这个过程需要移动平均 n/2 个元素，因此时间复杂度为 O(n)。
        - paragraph [ref=e4267]: 对于删除：
        - list [ref=e4268]:
          - listitem [ref=e4269]: 头部删除：由于需要将所有元素依次向前移动一个位置，因此时间复杂度是 O(n)。
          - listitem [ref=e4270]: 尾部删除：当删除的元素位于列表末尾时，时间复杂度为 O(1)。
          - listitem [ref=e4271]: 指定位置删除：需要将目标元素之后的所有元素向前移动一个位置以填补被删除的空白位置，因此需要移动平均 n/2 个元素，时间复杂度为 O(n)。
