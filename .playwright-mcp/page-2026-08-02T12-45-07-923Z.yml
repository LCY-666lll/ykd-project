        - paragraph [ref=e4989]:
          - code [ref=e4990]: BlockingQueue
          - text: （阻塞队列）是一个接口，继承自
          - code [ref=e4991]: Queue
          - text: 。
          - code [ref=e4992]: BlockingQueue
          - text: 阻塞的原因是其支持当队列没有元素时一直阻塞，直到有元素；还支持如果队列已满，一直等到队列可以放入新元素时再放入。
        - generic [ref=e4993]:
          - text: java
          - button "复制代码" [ref=e4994] [cursor=pointer]
          - code [ref=e4996]:
            - generic [ref=e4997]: "public interface BlockingQueue<E> extends Queue<E> {"
            - generic [ref=e4998]: // ...
            - generic [ref=e4999]: "}"
        - paragraph [ref=e5004]:
          - code [ref=e5005]: BlockingQueue
          - text: 常用于生产者-消费者模型中，生产者线程会向队列中添加数据，而消费者线程会从队列中取出数据进行处理。
        - paragraph [ref=e5006]:
          - img "BlockingQueue" [ref=e5007]
        - heading [level=3] [ref=e5008]:
          - link "BlockingQueue 的实现类有哪些？" [ref=e5009] [cursor=pointer]:
            - /url: "#blockingqueue-的实现类有哪些"
        - paragraph [ref=e5010]:
          - img "BlockingQueue 的实现类" [ref=e5011]
        - paragraph [ref=e5012]: Java 中常用的阻塞队列实现类有以下几种：
        - list [ref=e5013]:
          - listitem [ref=e5014]:
            - code [ref=e5015]: ArrayBlockingQueue
            - text: ：使用数组实现的有界阻塞队列。在创建时需要指定容量大小，并支持公平和非公平两种方式的锁访问机制。
          - listitem [ref=e5016]:
            - code [ref=e5017]: LinkedBlockingQueue
            - text: ：使用单向链表实现的可选有界阻塞队列。在创建时可以指定容量大小，如果不指定则默认为
            - code [ref=e5018]: Integer.MAX_VALUE
            - text: 。和
            - code [ref=e5019]: ArrayBlockingQueue
            - text: 不同的是， 它仅支持非公平的锁访问机制。
          - listitem [ref=e5020]:
            - code [ref=e5021]: PriorityBlockingQueue
            - text: ：支持优先级排序的无界阻塞队列。元素必须实现
            - code [ref=e5022]: Comparable
            - text: 接口或者在构造函数中传入
            - code [ref=e5023]: Comparator
            - text: 对象，并且不能插入 null 元素。
          - listitem [ref=e5024]:
            - code [ref=e5025]: SynchronousQueue
            - text: ：同步队列，是一种不存储元素的阻塞队列。每个插入操作都必须等待对应的删除操作，反之删除操作也必须等待插入操作。因此，
            - code [ref=e5026]: SynchronousQueue
            - text: 通常用于线程之间的直接传递数据。
          - listitem [ref=e5027]:
            - code [ref=e5028]: DelayQueue
            - text: ：延迟队列，其中的元素只有到了其指定的延迟时间，才能够从队列中出队。
          - listitem [ref=e5029]: ……
        - paragraph [ref=e5030]: 日常开发中，这些队列使用的其实都不多，了解即可。
        - heading [level=3] [ref=e5031]:
          - link "⭐️ArrayBlockingQueue 和 LinkedBlockingQueue 有什么区别？" [ref=e5032] [cursor=pointer]:
            - /url: "#⭐️arrayblockingqueue-和-linkedblockingqueue-有什么区别"
        - paragraph [ref=e5033]:
          - code [ref=e5034]: ArrayBlockingQueue
          - text: 和
          - code [ref=e5035]: LinkedBlockingQueue
          - text: 是 Java 并发包中常用的两种阻塞队列实现，它们都是线程安全的。不过，不过它们之间也存在下面这些区别：
        - list [ref=e5036]:
          - listitem [ref=e5037]:
            - text: 底层实现：
            - code [ref=e5038]: ArrayBlockingQueue
            - text: 基于数组实现，而
            - code [ref=e5039]: LinkedBlockingQueue
            - text: 基于链表实现。
          - listitem [ref=e5040]:
            - text: 是否有界：
            - code [ref=e5041]: ArrayBlockingQueue
            - text: 是有界队列，必须在创建时指定容量大小。
            - code [ref=e5042]: LinkedBlockingQueue
            - text: 创建时可以不指定容量大小，默认是
            - code [ref=e5043]: Integer.MAX_VALUE
            - text: ，也就是无界的。但也可以指定队列大小，从而成为有界的。
          - listitem [ref=e5044]:
            - text: 锁是否分离：
            - code [ref=e5045]: ArrayBlockingQueue
            - text: 中的锁是没有分离的，即生产和消费用的是同一个锁；
            - code [ref=e5046]: LinkedBlockingQueue
            - text: 中的锁是分离的，即生产用的是
            - code [ref=e5047]: putLock
            - text: ，消费是
            - code [ref=e5048]: takeLock
            - text: ，这样可以防止生产者和消费者线程之间的锁争夺。
          - listitem [ref=e5049]:
            - text: 内存占用：
            - code [ref=e5050]: ArrayBlockingQueue
            - text: 需要提前分配数组内存，而
            - code [ref=e5051]: LinkedBlockingQueue
            - text: 则是动态分配链表节点内存。这意味着，
            - code [ref=e5052]: ArrayBlockingQueue
            - text: 在创建时就会占用一定的内存空间，且往往申请的内存比实际所用的内存更大，而
            - code [ref=e5053]: LinkedBlockingQueue
            - text: 则是根据元素的增加而逐渐占用内存空间。
        - heading [level=2] [ref=e5054]:
          - link "Map（重要）" [ref=e5055] [cursor=pointer]:
            - /url: "#map-重要"
        - heading [level=3] [ref=e5056]:
          - link "⭐️HashMap 和 Hashtable 的区别" [ref=e5057] [cursor=pointer]:
            - /url: "#⭐️hashmap-和-hashtable-的区别"
        - list [ref=e5058]:
          - listitem [ref=e5059]:
            - strong [ref=e5060]: 线程是否安全：
            - code [ref=e5061]: HashMap
            - text: 是非线程安全的，
            - code [ref=e5062]: Hashtable
            - text: 是线程安全的,因为
            - code [ref=e5063]: Hashtable
            - text: 内部的方法基本都经过
            - code [ref=e5064]: synchronized
            - text: 修饰。（如果你要保证线程安全的话就使用
            - code [ref=e5065]: ConcurrentHashMap
            - text: 吧！）；
          - listitem [ref=e5066]:
            - strong [ref=e5067]: 效率：
            - text: 因为线程安全的问题，
            - code [ref=e5068]: HashMap
            - text: 要比
            - code [ref=e5069]: Hashtable
            - text: 效率高一点。另外，
            - code [ref=e5070]: Hashtable
            - text: 基本被淘汰，不要在代码中使用它；
          - listitem [ref=e5071]:
            - strong [ref=e5072]: 对 Null key 和 Null value 的支持：
            - code [ref=e5073]: HashMap
            - text: 可以存储 null 的 key 和 value，但 null 作为键只能有一个，null 作为值可以有多个；Hashtable 不允许有 null 键和 null 值，否则会抛出
            - code [ref=e5074]: NullPointerException
            - text: 。
          - listitem [ref=e5075]:
            - strong [ref=e5076]: 初始容量大小和每次扩充容量大小的不同：
            - text: ① 创建时如果不指定容量初始值，
            - code [ref=e5077]: Hashtable
            - text: 默认的初始大小为 11，之后每次扩充，容量变为原来的 2n+1。
            - code [ref=e5078]: HashMap
            - text: 默认的初始化大小为 16。之后每次扩充，容量变为原来的 2 倍。② 创建时如果给定了容量初始值，那么
            - code [ref=e5079]: Hashtable
            - text: 会直接使用你给定的大小，而
            - code [ref=e5080]: HashMap
            - text: 会将其扩充为 2 的幂次方大小（
            - code [ref=e5081]: HashMap
            - text: 中的
            - code [ref=e5082]: tableSizeFor()
            - text: 方法保证，下面给出了源代码）。也就是说
            - code [ref=e5083]: HashMap
            - text: 总是使用 2 的幂作为哈希表的大小,后面会介绍到为什么是 2 的幂次方。
          - listitem [ref=e5084]:
            - strong [ref=e5085]: 底层数据结构：
            - text: JDK1.8 以后的
            - code [ref=e5086]: HashMap
            - text: 在解决哈希冲突时有了较大的变化，当链表长度大于阈值（默认为 8）时，将链表转化为红黑树（将链表转换成红黑树前会判断，如果当前数组的长度小于 64，那么会选择先进行数组扩容，而不是转换为红黑树），以减少搜索时间（后文中我会结合源码对这一过程进行分析）。
            - code [ref=e5087]: Hashtable
            - text: 没有这样的机制。
          - listitem [ref=e5088]:
            - strong [ref=e5089]: 哈希函数的实现
            - text: ：
            - code [ref=e5090]: HashMap
            - text: 对哈希值进行了高位和低位的混合扰动处理以减少冲突，而
            - code [ref=e5091]: Hashtable
            - text: 直接使用键的
            - code [ref=e5092]: hashCode()
            - text: 值。
        - paragraph [ref=e5093]:
          - strong [ref=e5094]:
