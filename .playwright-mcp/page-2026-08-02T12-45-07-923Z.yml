          - text: 是在 JDK1.5 中被引入的, 其与
          - code [ref=e4971]: Queue
          - text: 的区别在于元素出队顺序是与优先级相关的，即总是优先级最高的元素先出队。
        - paragraph [ref=e4972]: 这里列举其相关的一些要点：
        - list [ref=e4973]:
          - listitem [ref=e4974]:
            - code [ref=e4975]: PriorityQueue
            - text: 利用了二叉堆的数据结构来实现的，底层使用可变长的数组来存储数据
          - listitem [ref=e4976]:
            - code [ref=e4977]: PriorityQueue
            - text: 通过堆元素的上浮和下沉，实现了在 O(logn) 的时间复杂度内插入元素和删除堆顶元素。
          - listitem [ref=e4978]:
            - code [ref=e4979]: PriorityQueue
            - text: 是非线程安全的，且不支持存储
            - code [ref=e4980]: "NULL"
            - text: 和
            - code [ref=e4981]: non-comparable
            - text: 的对象。
          - listitem [ref=e4982]:
            - code [ref=e4983]: PriorityQueue
            - text: 默认是小顶堆，但可以接收一个
            - code [ref=e4984]: Comparator
            - text: 作为构造参数，从而来自定义元素优先级的先后。
        - paragraph [ref=e4985]:
          - code [ref=e4986]: PriorityQueue
          - text: 在面试中可能更多的会出现在手撕算法的时候，典型例题包括堆排序、求第 K 大的数、带权图的遍历等，所以需要会熟练使用才行。
        - heading [level=3] [ref=e4987]:
