          - code [ref=e4409]:
            - generic [ref=e4410]: public static <T>
            - generic [ref=e4411]: "int binarySearch(List<? extends Comparable<? super T>> list, T key) {"
            - generic [ref=e4412]: if (list instanceof RandomAccess || list.size()<BINARYSEARCH_THRESHOLD)
            - generic [ref=e4413]: return Collections.indexedBinarySearch(list, key);
