        - paragraph [ref=e5470]:
          - text: 所谓
          - strong [ref=e5471]: “拉链法”
          - text: 就是：将链表和数组相结合。也就是说创建一个链表数组，数组中每一格就是一个链表。若遇到哈希冲突，则将冲突的值加到链表中即可。
        - paragraph [ref=e5472]:
          - img "jdk1.8 之前的内部结构-HashMap" [ref=e5473]
        - heading [level=4] [ref=e5474]:
          - link "JDK1.8 之后" [ref=e5475] [cursor=pointer]:
            - /url: "#jdk1-8-之后"
        - paragraph [ref=e5476]: 相比于之前的版本， JDK1.8 之后在解决哈希冲突时有了较大的变化，当链表长度大于阈值（默认为 8）（将链表转换成红黑树前会判断，如果当前数组的长度小于 64，那么会选择先进行数组扩容，而不是转换为红黑树）时，将链表转化为红黑树。
        - paragraph [ref=e5477]: 这样做的目的是减少搜索时间：链表的查询效率为 O(n)（n 是链表的长度），红黑树是一种自平衡二叉搜索树，其查询效率为 O(log n)。当链表较短时，O(n) 和 O(log n) 的性能差异不明显。但当链表变长时，查询性能会显著下降。
        - paragraph [ref=e5478]:
          - img "jdk1.8之后的内部结构-HashMap" [ref=e5479]
        - paragraph [ref=e5480]:
          - strong [ref=e5481]: 为什么优先扩容而非直接转为红黑树？
        - paragraph [ref=e5482]: 数组扩容能减少哈希冲突的发生概率（即将元素重新分散到新的、更大的数组中），这在多数情况下比直接转换为红黑树更高效。
        - paragraph [ref=e5483]: 红黑树需要保持自平衡，维护成本较高。并且，过早引入红黑树反而会增加复杂度。
        - paragraph [ref=e5484]:
          - strong [ref=e5485]: 为什么选择阈值 8 和 64？
        - list [ref=e5486]:
          - listitem [ref=e5487]: 泊松分布表明，链表长度达到 8 的概率极低（小于千万分之一）。在绝大多数情况下，链表长度都不会超过 8。阈值设置为 8，可以保证性能和空间效率的平衡。
          - listitem [ref=e5488]: 数组长度阈值 64 同样是经过实践验证的经验值。在小数组中扩容成本低，优先扩容可以避免过早引入红黑树。数组大小达到 64 时，冲突概率较高，此时红黑树的性能优势开始显现。
        - blockquote [ref=e5489]:
          - paragraph [ref=e5490]: TreeMap、TreeSet 以及 JDK1.8 之后的 HashMap 底层都用到了红黑树。红黑树就是为了解决二叉查找树的缺陷，因为二叉查找树在某些情况下会退化成一个线性结构。
        - paragraph [ref=e5491]:
          - text: 我们来结合源码分析一下
