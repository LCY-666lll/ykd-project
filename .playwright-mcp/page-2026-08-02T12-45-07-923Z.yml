        - paragraph [ref=e5820]:
          - code [ref=e5821]: ConcurrentHashMap
          - text: 和
          - code [ref=e5822]: Hashtable
          - text: 的区别主要体现在实现线程安全的方式上不同。
        - list [ref=e5823]:
          - listitem [ref=e5824]:
            - strong [ref=e5825]: 底层数据结构：
            - text: JDK1.7 的
            - code [ref=e5826]: ConcurrentHashMap
            - text: 底层采用
            - strong [ref=e5827]: 分段的数组+链表
            - text: 实现，在 JDK1.8 中采用的数据结构跟
            - code [ref=e5828]: HashMap
            - text: 的结构一样，数组+链表/红黑二叉树。
            - code [ref=e5829]: Hashtable
            - text: 和 JDK1.8 之前的
            - code [ref=e5830]: HashMap
            - text: 的底层数据结构类似都是采用
            - strong [ref=e5831]: 数组+链表
            - text: 的形式，数组是 HashMap 的主体，链表则是主要为了解决哈希冲突而存在的；
          - listitem [ref=e5832]:
            - strong [ref=e5833]: 实现线程安全的方式（重要）：
            - list [ref=e5834]:
              - listitem [ref=e5835]:
                - text: 在 JDK1.7 的时候，
                - code [ref=e5836]: ConcurrentHashMap
                - text: 对整个桶数组进行了分割分段(
                - code [ref=e5837]: Segment
                - text: ，分段锁)，每一把锁只锁容器其中一部分数据（下面有示意图），多线程访问容器里不同数据段的数据，就不会存在锁竞争，提高并发访问率。
              - listitem [ref=e5838]:
                - text: 到了 JDK1.8 的时候，
                - code [ref=e5839]: ConcurrentHashMap
                - text: 已经摒弃了
                - code [ref=e5840]: Segment
                - text: 的概念，而是直接用
                - code [ref=e5841]: Node
                - text: 数组+链表+红黑树的数据结构来实现，并发控制使用
                - code [ref=e5842]: synchronized
                - text: 和 CAS 来操作。（JDK1.6 以后
                - code [ref=e5843]: synchronized
                - text: 锁做了很多优化） 整个看起来就像是优化过且线程安全的
                - code [ref=e5844]: HashMap
                - text: ，虽然在 JDK1.8 中还能看到
                - code [ref=e5845]: Segment
                - text: 的数据结构，但是已经简化了属性，只是为了兼容旧版本；
              - listitem [ref=e5846]:
                - strong [ref=e5847]:
                  - code [ref=e5848]: Hashtable
                  - text: (同一把锁)
                - text: :使用
                - code [ref=e5849]: synchronized
                - text: 来保证线程安全，效率非常低下。当一个线程访问同步方法时，其他线程也访问同步方法，可能会进入阻塞或轮询状态，如使用 put 添加元素，另一个线程不能使用 put 添加元素，也不能使用 get，竞争会越来越激烈效率越低。
        - paragraph [ref=e5850]: 下面，我们再来看看两者底层数据结构的对比图。
