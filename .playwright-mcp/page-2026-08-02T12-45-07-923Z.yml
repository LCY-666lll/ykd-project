          - link "JDK1.8 之后" [ref=e5959] [cursor=pointer]:
            - /url: "#jdk1-8-之后-1"
        - paragraph [ref=e5960]:
          - img "Java8 ConcurrentHashMap 存储结构" [ref=e5961]
        - paragraph [ref=e5962]:
          - text: Java 8 几乎完全重写了
          - code [ref=e5963]: ConcurrentHashMap
          - text: ，代码量从原来 Java 7 中的 1000 多行，变成了现在的 6000 多行。
        - paragraph [ref=e5964]:
          - code [ref=e5965]: ConcurrentHashMap
          - text: 取消了
          - code [ref=e5966]: Segment
          - text: 分段锁，采用
          - code [ref=e5967]: Node + CAS + synchronized
          - text: 来保证并发安全。数据结构跟
          - code [ref=e5968]: HashMap
          - text: 1.8 的结构类似，数组+链表/红黑二叉树。Java 8 在链表长度超过一定阈值（8）时将链表（寻址时间复杂度为 O(N)）转换为红黑树（寻址时间复杂度为 O(log(N))）。
        - paragraph [ref=e5969]:
          - text: Java 8 中，锁粒度更细，
          - code [ref=e5970]: synchronized
          - text: 只锁定当前链表或红黑二叉树的首节点，这样只要 hash 不冲突，就不会产生并发，就不会影响其他 Node 的读写，效率大幅提升。
        - heading [level=3] [ref=e5971]:
          - link "⭐️JDK 1.7 和 JDK 1.8 的 ConcurrentHashMap 实现有什么不同？" [ref=e5972] [cursor=pointer]:
            - /url: "#⭐️jdk-1-7-和-jdk-1-8-的-concurrenthashmap-实现有什么不同"
        - list [ref=e5973]:
          - listitem [ref=e5974]:
            - strong [ref=e5975]: 线程安全实现方式
            - text: ：JDK 1.7 采用
            - code [ref=e5976]: Segment
            - text: 分段锁来保证安全，
            - code [ref=e5977]: Segment
            - text: 是继承自
            - code [ref=e5978]: ReentrantLock
            - text: 。JDK1.8 放弃了
            - code [ref=e5979]: Segment
            - text: 分段锁的设计，采用
            - code [ref=e5980]: Node + CAS + synchronized
            - text: 保证线程安全，锁粒度更细，
            - code [ref=e5981]: synchronized
            - text: 只锁定当前链表或红黑二叉树的首节点。
          - listitem [ref=e5982]:
            - strong [ref=e5983]: Hash 碰撞解决方法
            - text: ": JDK 1.7 采用拉链法，JDK1.8 采用拉链法结合红黑树（链表长度超过一定阈值时，将链表转换为红黑树）。"
          - listitem [ref=e5984]:
            - strong [ref=e5985]: 并发度
            - text: ：JDK 1.7 最大并发度是 Segment 的个数，默认是 16。JDK 1.8 最大并发度是 Node 数组的大小，并发度更大。
        - heading [level=3] [ref=e5986]:
          - link "ConcurrentHashMap 为什么 key 和 value 不能为 null？" [ref=e5987] [cursor=pointer]:
            - /url: "#concurrenthashmap-为什么-key-和-value-不能为-null"
        - paragraph [ref=e5988]:
          - code [ref=e5989]: ConcurrentHashMap
          - text: 的 key 和 value 不能为 null 主要是为了避免二义性。null 是一个特殊的值，表示没有对象或没有引用。如果你用 null 作为键，那么你就无法区分这个键是否存在于
          - code [ref=e5990]: ConcurrentHashMap
          - text: 中，还是根本没有这个键。同样，如果你用 null 作为值，那么你就无法区分这个值是否是真正存储在
          - code [ref=e5991]: ConcurrentHashMap
          - text: 中的，还是因为找不到对应的键而返回的。
        - paragraph [ref=e5992]: 拿 get 方法取值来说，返回的结果为 null 存在两种情况：
        - list [ref=e5993]:
          - listitem [ref=e5994]: 值没有在集合中 ；
          - listitem [ref=e5995]: 值本身就是 null。
        - paragraph [ref=e5996]: 这也就是二义性的由来。
        - paragraph [ref=e5997]:
          - text: 具体可以参考
          - link "ConcurrentHashMap 源码分析" [ref=e5998] [cursor=pointer]:
            - /url: https://javaguide.cn/java/collection/concurrent-hash-map-source-code.html
          - text: 。
        - paragraph [ref=e5999]:
          - text: 多线程环境下，存在一个线程操作该
          - code [ref=e6000]: ConcurrentHashMap
          - text: 时，其他的线程将该
          - code [ref=e6001]: ConcurrentHashMap
          - text: 修改的情况，所以无法通过
          - code [ref=e6002]: containsKey(key)
          - text: 来判断否存在这个键值对，也就没办法解决二义性问题了。
        - paragraph [ref=e6003]:
          - text: 与此形成对比的是，
          - code [ref=e6004]: HashMap
          - text: 可以存储 null 的 key 和 value，但 null 作为键只能有一个，null 作为值可以有多个。如果传入 null 作为参数，就会返回 hash 值为 0 的位置的值。单线程环境下，不存在一个线程操作该 HashMap 时，其他的线程将该
          - code [ref=e6005]: HashMap
          - text: 修改的情况，所以可以通过
          - code [ref=e6006]: contains(key)
          - text: 来做判断是否存在这个键值对，从而做相应的处理，也就不存在二义性问题。
        - paragraph [ref=e6007]: 也就是说，多线程下无法正确判定键值对是否存在（存在其他线程修改的情况），单线程是可以的（不存在其他线程修改的情况）。
        - paragraph [ref=e6008]: 如果你确实需要在 ConcurrentHashMap 中使用 null 的话，可以使用一个特殊的静态空对象来代替 null。
        - generic [ref=e6009]:
          - text: java
          - button "复制代码" [ref=e6010] [cursor=pointer]
          - code [ref=e6012]:
            - generic [ref=e6013]: public static final Object NULL = new Object();
        - paragraph [ref=e6016]:
          - text: 最后，再分享一下
          - code [ref=e6017]: ConcurrentHashMap
          - text: 作者本人 (Doug Lea)对于这个问题的回答：
        - blockquote [ref=e6018]:
          - paragraph [ref=e6019]:
            - text: The main reason that nulls aren't allowed in ConcurrentMaps (ConcurrentHashMaps, ConcurrentSkipListMaps) is that ambiguities that may be just barely tolerable in non-concurrent maps can't be accommodated. The main one is that if
            - code [ref=e6020]: map.get(key)
            - text: returns
            - code [ref=e6021]: "null"
            - text: ", you can't detect whether the key explicitly maps to"
            - code [ref=e6022]: "null"
            - text: vs the key isn't mapped. In a non-concurrent map, you can check this via
            - code [ref=e6023]: map.contains(key)
            - text: ", but in a concurrent one, the map might have changed between calls."
        - paragraph [ref=e6024]: 翻译过来之后的，大致意思还是单线程下可以容忍歧义，而多线程下无法容忍。
        - heading [level=3] [ref=e6025]:
          - link "⭐️ConcurrentHashMap 能保证复合操作的原子性吗？" [ref=e6026] [cursor=pointer]:
            - /url: "#⭐️concurrenthashmap-能保证复合操作的原子性吗"
        - paragraph [ref=e6027]:
          - code [ref=e6028]: ConcurrentHashMap
          - text: 是线程安全的，意味着它可以保证多个线程同时对它进行读写操作时，不会出现数据不一致的情况，也不会导致 JDK1.7 及之前版本的
          - code [ref=e6029]: HashMap
          - text: 多线程操作导致死循环问题。但是，这并不意味着它可以保证所有的复合操作都是原子性的，一定不要搞混了！
        - paragraph [ref=e6030]:
          - text: 复合操作是指由多个基本操作(如
          - code [ref=e6031]: put
          - text: 、
          - code [ref=e6032]: get
          - text: 、
          - code [ref=e6033]: remove
          - text: 、
          - code [ref=e6034]: containsKey
          - text: 等)组成的操作，例如先判断某个键是否存在
          - code [ref=e6035]: containsKey(key)
          - text: ，然后根据结果进行插入或更新
          - code [ref=e6036]: put(key, value)
          - text: 。这种操作在执行过程中可能会被其他线程打断，导致结果不符合预期。
        - paragraph [ref=e6037]:
          - text: 例如，有两个线程 A 和 B 同时对
          - code [ref=e6038]: ConcurrentHashMap
          - text: 进行复合操作，如下：
        - generic [ref=e6039]:
          - text: java
          - button "复制代码" [ref=e6040] [cursor=pointer]
          - code [ref=e6042]:
            - generic [ref=e6043]: // 线程 A
            - generic [ref=e6044]: "if (!map.containsKey(key)) {"
            - generic [ref=e6045]: map.put(key, value);
            - generic [ref=e6046]: "}"
            - generic [ref=e6047]: // 线程 B
            - generic [ref=e6048]: "if (!map.containsKey(key)) {"
            - generic [ref=e6049]: map.put(key, anotherValue);
            - generic [ref=e6050]: "}"
        - paragraph [ref=e6060]: 如果线程 A 和 B 的执行顺序是这样：
        - list [ref=e6061]:
          - listitem [ref=e6062]: 线程 A 判断 map 中不存在 key
          - listitem [ref=e6063]: 线程 B 判断 map 中不存在 key
          - listitem [ref=e6064]: 线程 B 将 (key, anotherValue) 插入 map
          - listitem [ref=e6065]: 线程 A 将 (key, value) 插入 map
        - paragraph [ref=e6066]: 那么最终的结果是 (key, value)，而不是预期的 (key, anotherValue)。这就是复合操作的非原子性导致的问题。
        - paragraph [ref=e6067]:
          - strong [ref=e6068]:
            - text: 那如何保证
            - code [ref=e6069]: ConcurrentHashMap
            - text: 复合操作的原子性呢？
        - paragraph [ref=e6070]:
          - code [ref=e6071]: ConcurrentHashMap
          - text: 提供了一些原子性的复合操作，如
          - code [ref=e6072]: putIfAbsent
          - text: 、
          - code [ref=e6073]: compute
          - text: 、
          - code [ref=e6074]: computeIfAbsent
          - text: 、
          - code [ref=e6075]: computeIfPresent
          - text: 、
          - code [ref=e6076]: merge
          - text: 等。这些方法都可以接受一个函数作为参数，根据给定的 key 和 value 来计算一个新的 value，并且将其更新到 map 中。
        - paragraph [ref=e6077]: 上面的代码可以改写为：
        - generic [ref=e6078]:
          - text: java
          - button "复制代码" [ref=e6079] [cursor=pointer]
          - code [ref=e6081]:
            - generic [ref=e6082]: // 线程 A
            - generic [ref=e6083]: map.putIfAbsent(key, value);
            - generic [ref=e6084]: // 线程 B
            - generic [ref=e6085]: map.putIfAbsent(key, anotherValue);
        - paragraph [ref=e6091]: 或者：
        - generic [ref=e6092]:
          - text: java
          - button "复制代码" [ref=e6093] [cursor=pointer]
          - code [ref=e6095]:
            - generic [ref=e6096]: // 线程 A
            - generic [ref=e6097]: map.computeIfAbsent(key, k -> value);
            - generic [ref=e6098]: // 线程 B
            - generic [ref=e6099]: map.computeIfAbsent(key, k -> anotherValue);
        - paragraph [ref=e6105]:
          - text: 很多同学可能会说了，这种情况也能加锁同步呀！确实可以，但不建议使用加锁的同步机制，违背了使用
          - code [ref=e6106]: ConcurrentHashMap
          - text: 的初衷。在使用
          - code [ref=e6107]: ConcurrentHashMap
          - text: 的时候，尽量使用这些原子性的复合操作方法来保证原子性。
