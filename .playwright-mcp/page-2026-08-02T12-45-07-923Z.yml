        - paragraph [ref=e5593]:
          - text: 为了让
          - code [ref=e5594]: HashMap
          - text: 存取高效并减少碰撞，我们需要确保数据尽量均匀分布。哈希值在 Java 中通常使用
          - code [ref=e5595]: int
          - text: 表示，其范围是
          - code [ref=e5596]: "-2147483648 ~ 2147483647"
          - text: 前后加起来大概 40 亿的映射空间，只要哈希函数映射得比较均匀松散，一般应用是很难出现碰撞的。但是，问题是一个 40 亿长度的数组，内存是放不下的。所以，这个散列值是不能直接拿来用的。用之前还要先做对数组的长度取模运算，得到的余数才能用来要存放的位置也就是对应的数组下标。
        - paragraph [ref=e5597]:
          - strong [ref=e5598]: 这个算法应该如何设计呢？
        - paragraph [ref=e5599]:
          - text: 我们首先可能会想到采用 % 取余的操作来实现。但是，重点来了：“
          - strong [ref=e5600]: 取余(%)操作中如果除数是 2 的幂次则等价于与其除数减一的与(&)操作
          - text: （也就是说
          - code [ref=e5601]: hash%length==hash&(length-1)
          - text: 的前提是 length 是 2 的 n 次方）。” 并且，
          - strong [ref=e5602]: 采用二进制位操作 & 相对于 % 能够提高运算效率
          - text: 。
        - paragraph [ref=e5603]:
          - text: 除了上面所说的位运算比取余效率高之外，我觉得更重要的一个原因是：
          - strong [ref=e5604]:
            - text: 长度是 2 的幂次方，可以让
            - code [ref=e5605]: HashMap
            - text: 在扩容的时候更均匀
          - text: "。例如:"
        - list [ref=e5606]:
          - listitem [ref=e5607]:
            - text: length = 8 时，length - 1 = 7 的二进制位
            - code [ref=e5608]: "0111"
          - listitem [ref=e5609]:
            - text: length = 16 时，length - 1 = 15 的二进制位
            - code [ref=e5610]: "1111"
        - paragraph [ref=e5611]:
          - text: 这时候原本存在
          - code [ref=e5612]: HashMap
          - text: 中的元素计算新的数组位置时
          - code [ref=e5613]: hash&(length-1)
          - text: ，取决 hash 的第四个二进制位（从右数），会出现两种情况：
        - list [ref=e5614]:
          - listitem [ref=e5615]: 第四个二进制位为 0，数组位置不变，也就是说当前元素在新数组和旧数组的位置相同。
          - listitem [ref=e5616]: 第四个二进制位为 1，数组位置在新数组扩容之后的那一部分。
        - paragraph [ref=e5617]: 这里列举一个例子：
