            - generic [ref=e5100]: "public HashMap(int initialCapacity, float loadFactor) {"
            - generic [ref=e5101]: if (initialCapacity < 0)
            - generic [ref=e5102]: "throw new IllegalArgumentException(\"Illegal initial capacity: \" +"
            - generic [ref=e5103]: initialCapacity);
            - generic [ref=e5104]: if (initialCapacity > MAXIMUM_CAPACITY)
