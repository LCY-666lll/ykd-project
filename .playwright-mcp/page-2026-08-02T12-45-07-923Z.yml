          - text: 接口， 而
          - code [ref=e4428]: LinkedList
          - text: 没有实现。为什么呢？我觉得还是和底层数据结构有关！
          - code [ref=e4429]: ArrayList
          - text: 底层是数组，而
          - code [ref=e4430]: LinkedList
          - text: 底层是链表。数组天然支持随机访问，时间复杂度为 O(1)，所以称为快速随机访问。链表需要遍历到特定位置才能访问特定位置的元素，时间复杂度为 O(n)，所以不支持快速随机访问。
          - code [ref=e4431]: ArrayList
          - text: 实现了
          - code [ref=e4432]: RandomAccess
          - text: 接口，就表明了他具有快速随机访问功能。
          - code [ref=e4433]: RandomAccess
          - text: 接口只是标识，并不是说
          - code [ref=e4434]: ArrayList
          - text: 实现
          - code [ref=e4435]: RandomAccess
          - text: 接口才具有快速随机访问功能的！
