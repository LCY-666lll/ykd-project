        - paragraph [ref=e4320]:
          - code [ref=e4321]: RandomAccess
          - text: 是一个标记接口，用来表明实现该接口的类支持随机访问（即可以通过索引快速访问元素）。由于
          - code [ref=e4322]: LinkedList
          - text: 底层数据结构是链表，内存地址不连续，只能通过指针来定位，不支持随机快速访问，所以不能实现
          - code [ref=e4323]: RandomAccess
          - text: 接口。
        - heading [level=3] [ref=e4324]:
