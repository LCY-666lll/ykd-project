        - list [ref=e4949]:
          - listitem [ref=e4950]:
            - code [ref=e4951]: ArrayDeque
            - text: 是基于可变长的数组和双指针来实现，而
            - code [ref=e4952]: LinkedList
            - text: 则通过链表来实现。
          - listitem [ref=e4953]:
