            - generic [ref=e5106]: if (loadFactor <= 0 || Float.isNaN(loadFactor))
            - generic [ref=e5107]: "throw new IllegalArgumentException(\"Illegal load factor: \" +"
            - generic [ref=e5108]: loadFactor);
            - generic [ref=e5109]: this.loadFactor = loadFactor;
            - generic [ref=e5110]: this.threshold = tableSizeFor(initialCapacity);
            - generic [ref=e5111]: "}"
            - generic [ref=e5112]: "public HashMap(int initialCapacity) {"
