        - list [ref=e4326]:
          - listitem [ref=e4327]:
            - strong [ref=e4328]: 是否保证线程安全：
            - code [ref=e4329]: ArrayList
            - text: 和
            - code [ref=e4330]: LinkedList
            - text: 都是不同步的，也就是不保证线程安全；
          - listitem [ref=e4331]:
            - strong [ref=e4332]: 底层数据结构：
            - code [ref=e4333]: ArrayList
            - text: 底层使用的是
            - strong [ref=e4334]:
              - code [ref=e4335]: Object
              - text: 数组
            - text: ；
            - code [ref=e4336]: LinkedList
            - text: 底层使用的是
            - strong [ref=e4337]: 双向链表
            - text: 数据结构（JDK1.6 之前为循环链表，JDK1.7 取消了循环。注意双向链表和双向循环链表的区别，下面有介绍到！）
          - listitem [ref=e4338]:
            - strong [ref=e4339]: 插入和删除是否受元素位置的影响：
            - list [ref=e4340]:
              - listitem [ref=e4341]:
                - code [ref=e4342]: ArrayList
                - text: 采用数组存储，所以插入和删除元素的时间复杂度受元素位置的影响。 比如：执行
                - code [ref=e4343]: add(E e)
                - text: 方法的时候，
                - code [ref=e4344]: ArrayList
                - text: 会默认在将指定的元素追加到此列表的末尾，这种情况时间复杂度就是 O(1)。但是如果要在指定位置 i 插入和删除元素的话（
                - code [ref=e4345]: add(int index, E element)
                - text: ），时间复杂度就为 O(n)。因为在进行上述操作的时候集合中第 i 和第 i 个元素之后的(n-i)个元素都要执行向后位/向前移一位的操作。
              - listitem [ref=e4346]:
                - code [ref=e4347]: LinkedList
                - text: 采用链表存储，所以在头尾插入或者删除元素不受元素位置的影响（
                - code [ref=e4348]: add(E e)
                - text: 、
                - code [ref=e4349]: addFirst(E e)
                - text: 、
                - code [ref=e4350]: addLast(E e)
                - text: 、
                - code [ref=e4351]: removeFirst()
                - text: 、
                - code [ref=e4352]: removeLast()
                - text: ），时间复杂度为 O(1)，如果是要在指定位置
                - code [ref=e4353]: i
                - text: 插入和删除元素的话（
                - code [ref=e4354]: add(int index, E element)
                - text: ，
                - code [ref=e4355]: remove(Object o)
                - text: ","
                - code [ref=e4356]: remove(int index)
                - text: ）， 时间复杂度为 O(n) ，因为需要先移动到指定位置再插入和删除。
          - listitem [ref=e4357]:
            - strong [ref=e4358]: 是否支持快速随机访问：
            - code [ref=e4359]: LinkedList
            - text: 不支持高效的随机元素访问，而
            - code [ref=e4360]: ArrayList
            - text: （实现了
            - code [ref=e4361]: RandomAccess
            - text: 接口） 支持。快速随机访问就是通过元素的序号快速获取元素对象(对应于
            - code [ref=e4362]: get(int index)
            - text: 方法)。
          - listitem [ref=e4363]:
            - strong [ref=e4364]: 内存空间占用：
            - code [ref=e4365]: ArrayList
            - text: 的空间浪费主要体现在在 list 列表的结尾会预留一定的容量空间，而 LinkedList 的空间花费则体现在它的每一个元素都需要消耗比 ArrayList 更多的空间（因为要存放直接后继和直接前驱以及数据）。
        - paragraph [ref=e4366]:
          - text: 我们在项目中一般是不会使用到
          - code [ref=e4367]: LinkedList
          - text: 的，需要用到
          - code [ref=e4368]: LinkedList
          - text: 的场景几乎都可以使用
          - code [ref=e4369]: ArrayList
          - text: 来代替，并且，性能通常会更好！就连
          - code [ref=e4370]: LinkedList
          - text: 的作者约书亚 · 布洛克（Josh Bloch）自己都说从来不会使用
          - code [ref=e4371]: LinkedList
          - text: 。
        - paragraph [ref=e4372]:
          - img "img" [ref=e4373]
        - paragraph [ref=e4374]:
          - text: 另外，不要下意识地认为
          - code [ref=e4375]: LinkedList
          - text: 作为链表就最适合元素增删的场景。我在上面也说了，
          - code [ref=e4376]: LinkedList
          - text: 仅仅在头尾插入或者删除元素的时候时间复杂度近似 O(1)，其他情况增删元素的平均时间复杂度都是 O(n) 。
