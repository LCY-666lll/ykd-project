          - text: ，这里看的就是第五个二进制位。
        - paragraph [ref=e5658]:
          - text: 也就是说扩容之后，在旧数组元素 hash 值比较均匀（至于 hash 值均不均匀，取决于前面讲的对象的
          - code [ref=e5659]: hashcode()
          - text: 方法和扰动函数）的情况下，新数组元素也会被分配的比较均匀，最好的情况是会有一半在新数组的前半部分，一半在新数组后半部分。
        - paragraph [ref=e5660]: 这样也使得扩容机制变得简单和高效，扩容后只需检查哈希值高位的变化来决定元素的新位置，要么位置不变（高位为 0），要么就是移动到新位置（高位为 1，原索引位置+原容量）。
        - paragraph [ref=e5661]:
          - text: 最后，简单总结一下
          - code [ref=e5662]: HashMap
          - text: 的长度是 2 的幂次方的原因：
        - list [ref=e5663]:
          - listitem [ref=e5664]:
            - text: 位运算效率更高：位运算(&)比取余运算(%)更高效。当长度为 2 的幂次方时，
            - code [ref=e5665]: hash % length
            - text: 等价于
            - code [ref=e5666]: hash & (length - 1)
            - text: 。
          - listitem [ref=e5667]: 可以更好地保证哈希值的均匀分布：扩容之后，在旧数组元素 hash 值比较均匀的情况下，新数组元素也会被分配的比较均匀，最好的情况是会有一半在新数组的前半部分，一半在新数组后半部分。
          - listitem [ref=e5668]: 扩容机制变得简单和高效：扩容后只需检查哈希值高位的变化来决定元素的新位置，要么位置不变（高位为 0），要么就是移动到新位置（高位为 1，原索引位置+原容量）。
        - heading [level=3] [ref=e5669]:
          - link "⭐️HashMap 多线程操作导致死循环问题" [ref=e5670] [cursor=pointer]:
            - /url: "#⭐️hashmap-多线程操作导致死循环问题"
        - paragraph [ref=e5671]:
          - text: JDK1.7 及之前版本的
          - code [ref=e5672]: HashMap
          - text: 在多线程环境下扩容操作可能存在死循环问题，这是由于当一个桶位中有多个元素需要进行扩容时，多个线程同时对链表进行操作，头插法可能会导致链表中的节点指向错误的位置，从而形成一个环形链表，进而使得查询元素的操作陷入死循环无法结束。
        - paragraph [ref=e5673]:
          - text: 为了解决这个问题，JDK1.8 版本的 HashMap 采用了尾插法而不是头插法来避免链表倒置，使得插入的节点永远都是放在链表的末尾，避免了链表中的环形结构。但是还是不建议在多线程下使用
          - code [ref=e5674]: HashMap
          - text: ，因为多线程下使用
          - code [ref=e5675]: HashMap
          - text: 还是会存在数据覆盖的问题。并发环境下，推荐使用
          - code [ref=e5676]: ConcurrentHashMap
          - text: 。
        - paragraph [ref=e5677]:
          - text: 一般面试中这样介绍就差不多，不需要记各种细节，个人觉得也没必要记。如果想要详细了解
          - code [ref=e5678]: HashMap
          - text: 扩容导致死循环问题，可以看看耗子叔的这篇文章：
          - link "Java HashMap 的死循环" [ref=e5679] [cursor=pointer]:
            - /url: https://coolshell.cn/articles/9606.html
          - text: 。
        - heading [level=3] [ref=e5680]:
          - link "⭐️HashMap 为什么线程不安全？" [ref=e5681] [cursor=pointer]:
            - /url: "#⭐️hashmap-为什么线程不安全"
        - paragraph [ref=e5682]:
          - text: JDK1.7 及之前版本，在多线程环境下，
          - code [ref=e5683]: HashMap
          - text: 扩容时会造成死循环和数据丢失的问题。
        - paragraph [ref=e5684]: 数据丢失这个在 JDK1.7 和 JDK 1.8 中都存在，这里以 JDK 1.8 为例进行介绍。
        - paragraph [ref=e5685]:
          - text: JDK 1.8 后，在
          - code [ref=e5686]: HashMap
          - text: 中，多个键值对可能会被分配到同一个桶（bucket），并以链表或红黑树的形式存储。多个线程对
          - code [ref=e5687]: HashMap
          - text: 的
          - code [ref=e5688]: put
          - text: 操作会导致线程不安全，具体来说会有数据覆盖的风险。
        - paragraph [ref=e5689]: 举个例子：
        - list [ref=e5690]:
          - listitem [ref=e5691]: 两个线程 1,2 同时进行 put 操作，并且发生了哈希冲突（hash 函数计算出的插入下标是相同的）。
          - listitem [ref=e5692]: 不同的线程可能在不同的时间片获得 CPU 执行的机会，当前线程 1 执行完哈希冲突判断后，由于时间片耗尽挂起。线程 2 先完成了插入操作。
          - listitem [ref=e5693]: 随后，线程 1 获得时间片，由于之前已经进行过 hash 碰撞的判断，所有此时会直接进行插入，这就导致线程 2 插入的数据被线程 1 覆盖了。
        - generic [ref=e5694]:
          - text: java
          - button "复制代码" [ref=e5695] [cursor=pointer]
          - code [ref=e5697]:
            - generic [ref=e5698]: "public V put(K key, V value) {"
            - generic [ref=e5699]: return putVal(hash(key), key, value, false, true);
            - generic [ref=e5700]: "}"
            - generic [ref=e5701]: final V putVal(int hash, K key, V value, boolean onlyIfAbsent,
            - generic [ref=e5702]: "boolean evict) {"
            - generic [ref=e5703]: // ...
            - generic [ref=e5704]: // 判断是否出现 hash 碰撞
            - generic [ref=e5705]: // (n - 1) & hash 确定元素存放在哪个桶中，桶为空，新生成结点放入桶中(此时，这个结点是放在数组中)
            - generic [ref=e5706]: if ((p = tab[i = (n - 1) & hash]) == null)
            - generic [ref=e5707]: tab[i] = newNode(hash, key, value, null);
            - generic [ref=e5708]: // 桶中已经存在元素（处理hash冲突）
            - generic [ref=e5709]: "else {"
            - generic [ref=e5710]: // ...
            - generic [ref=e5711]: "}"
        - paragraph [ref=e5728]:
          - text: 还有一种情况是这两个线程同时
          - code [ref=e5729]: put
          - text: 操作导致
          - code [ref=e5730]: size
          - text: 的值不正确，进而导致数据覆盖的问题：
        - list [ref=e5731]:
          - listitem [ref=e5732]:
            - text: 线程 1 执行
            - code [ref=e5733]: if(++size > threshold)
            - text: 判断时，假设获得
            - code [ref=e5734]: size
            - text: 的值为 10，由于时间片耗尽挂起。
          - listitem [ref=e5735]:
            - text: 线程 2 也执行
            - code [ref=e5736]: if(++size > threshold)
            - text: 判断，获得
            - code [ref=e5737]: size
            - text: 的值也为 10，并将元素插入到该桶位中，并将
            - code [ref=e5738]: size
            - text: 的值更新为 11。
          - listitem [ref=e5739]: 随后，线程 1 获得时间片，它也将元素放入桶位中，并将 size 的值更新为 11。
          - listitem [ref=e5740]:
            - text: 线程 1、2 都执行了一次
            - code [ref=e5741]: put
            - text: 操作，但是
            - code [ref=e5742]: size
            - text: 的值只增加了 1，也就导致实际上只有一个元素被添加到了
            - code [ref=e5743]: HashMap
            - text: 中。
        - generic [ref=e5744]:
          - text: java
          - button "复制代码" [ref=e5745] [cursor=pointer]
