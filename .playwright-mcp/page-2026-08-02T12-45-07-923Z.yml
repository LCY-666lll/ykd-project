        - paragraph [ref=e5415]:
          - text: JDK1.8 之前
          - code [ref=e5416]: HashMap
          - text: 底层是
          - strong [ref=e5417]: 数组和链表
          - text: 结合在一起使用也就是
          - strong [ref=e5418]: 链表散列
          - text: 。HashMap 通过 key 的
          - code [ref=e5419]: hashcode
          - text: 经过扰动函数处理过后得到 hash 值，然后通过
          - code [ref=e5420]: (n - 1) & hash
          - text: 判断当前元素存放的位置（这里的 n 指的是数组的长度），如果当前位置存在元素的话，就判断该元素与要存入的元素的 hash 值以及 key 是否相同，如果相同的话，直接覆盖，不相同就通过拉链法解决冲突。
        - paragraph [ref=e5421]:
          - code [ref=e5422]: HashMap
          - text: 中的扰动函数（
          - code [ref=e5423]: hash
          - text: 方法）是用来优化哈希值的分布。通过对原始的
          - code [ref=e5424]: hashCode()
          - text: 进行额外处理，扰动函数可以减小由于糟糕的
          - code [ref=e5425]: hashCode()
          - text: 实现导致的碰撞，从而提高数据的分布均匀性。
        - paragraph [ref=e5426]:
          - strong [ref=e5427]: "JDK 1.8 HashMap 的 hash 方法源码:"
        - paragraph [ref=e5428]: JDK 1.8 的 hash 方法 相比于 JDK 1.7 hash 方法更加简化，但是原理不变。
        - generic [ref=e5429]:
          - text: java
          - button "复制代码" [ref=e5430] [cursor=pointer]
          - code [ref=e5432]:
            - generic [ref=e5433]: "static final int hash(Object key) {"
            - generic [ref=e5434]: int h;
            - generic [ref=e5435]: // key.hashCode()：返回散列值也就是hashcode
            - generic [ref=e5436]: // ^：按位异或
            - generic [ref=e5437]: // >>>:无符号右移，忽略符号位，空位都以0补齐
            - generic [ref=e5438]: "return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);"
            - generic [ref=e5439]: "}"
        - paragraph [ref=e5448]: 对比一下 JDK1.7 的 HashMap 的 hash 方法源码.
