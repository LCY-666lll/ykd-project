            - generic [ref=e5454]: // This function ensures that hashCodes that differ only by
            - generic [ref=e5455]: // constant multiples at each bit position have a bounded
            - generic [ref=e5456]: // number of collisions (approximately 8 at default load factor).
            - generic [ref=e5457]: h ^= (h >>> 20) ^ (h >>> 12);
