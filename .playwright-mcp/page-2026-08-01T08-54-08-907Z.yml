        - heading [level=3] [ref=e528]:
          - link "Bean 注册" [ref=e529] [cursor=pointer]:
            - /url: "#bean-注册"
        - paragraph [ref=e530]:
          - text: Spring 容器需要知道哪些类需要被管理为 Bean。除了使用
          - code [ref=e531]: "@Bean"
          - text: 方法显式声明（通常在
          - code [ref=e532]: "@Configuration"
          - text: 类中），更常见的方式是使用 Stereotype（构造型） 注解标记类，并配合组件扫描（Component Scanning）机制，让 Spring 自动发现并注册这些类作为 Bean。这些 Bean 后续可以通过
          - code [ref=e533]: "@Autowired"
          - text: 等方式注入到其他组件中。
        - paragraph [ref=e534]: 下面是常见的一些注册 Bean 的注解：
        - list [ref=e535]:
          - listitem [ref=e536]:
            - code [ref=e537]: "@Component"
            - text: ：通用的注解，可标注任意类为
            - code [ref=e538]: Spring
            - text: 组件。如果一个 Bean 不知道属于哪个层，可以使用
            - code [ref=e539]: "@Component"
            - text: 注解标注。
          - listitem [ref=e540]:
            - code [ref=e541]: "@Repository"
            - text: ": 对应持久层即 Dao 层，主要用于数据库相关操作。"
          - listitem [ref=e542]:
            - code [ref=e543]: "@Service"
            - text: ": 对应服务层，主要涉及一些复杂的逻辑，需要用到 Dao 层。"
          - listitem [ref=e544]:
            - code [ref=e545]: "@Controller"
            - text: ": 对应 Spring MVC 控制层，主要用于接受用户请求并调用 Service 层返回数据给前端页面。"
          - listitem [ref=e546]:
            - code [ref=e547]: "@RestController"
            - text: ：一个组合注解，等效于
            - code [ref=e548]: "@Controller"
            - text: +
            - code [ref=e549]: "@ResponseBody"
            - text: 。它专门用于构建 RESTful Web 服务的控制器。标注了
            - code [ref=e550]: "@RestController"
            - text: 的类，其所有处理器方法（handler methods）的返回值都会被自动序列化（通常为 JSON）并写入 HTTP 响应体，而不是被解析为视图名称。
        - paragraph [ref=e551]:
          - code [ref=e552]: "@Controller"
          - text: vs
          - code [ref=e553]: "@RestController"
          - text: ：
        - list [ref=e554]:
          - listitem [ref=e555]:
            - code [ref=e556]: "@Controller"
            - text: ：主要用于传统的 Spring MVC 应用，方法返回值通常是逻辑视图名，需要视图解析器配合渲染页面。如果需要返回数据（如 JSON），则需要在方法上额外添加
            - code [ref=e557]: "@ResponseBody"
            - text: 注解。
          - listitem [ref=e558]:
            - code [ref=e559]: "@RestController"
            - text: ：专为构建返回数据的 RESTful API 设计。类上使用此注解后，所有方法的返回值都会默认被视为响应体内容（相当于每个方法都隐式添加了
            - code [ref=e560]: "@ResponseBody"
            - text: ），通常用于返回 JSON 或 XML 数据。在现代前后端分离的应用中，
            - code [ref=e561]: "@RestController"
            - text: 是更常用的选择。
        - paragraph [ref=e562]:
          - text: 关于
          - code [ref=e563]: "@RestController"
          - text: 和
          - code [ref=e564]: "@Controller"
          - text: 的对比，请看这篇文章：
          - link "@RestController vs @Controller" [ref=e565] [cursor=pointer]:
            - /url: https://mp.weixin.qq.com/s?__biz=Mzg2OTA0Njk0OA==&mid=2247485544&idx=1&sn=3cc95b88979e28fe3bfe539eb421c6d8&chksm=cea247a3f9d5ceb5e324ff4b8697adc3e828ecf71a3468445e70221cce768d1e722085359907&token=1725092312&lang=zh_CN#rd
          - text: 。
        - heading [level=2] [ref=e566]:
          - link "配置" [ref=e567] [cursor=pointer]:
            - /url: "#配置"
        - heading [level=3] [ref=e568]:
          - link "声明配置类" [ref=e569] [cursor=pointer]:
            - /url: "#声明配置类"
        - paragraph [ref=e570]:
          - code [ref=e571]: "@Configuration"
          - text: 主要用于声明一个类是 Spring 的配置类。虽然也可以用
          - code [ref=e572]: "@Component"
          - text: 注解替代，但
          - code [ref=e573]: "@Configuration"
          - text: 能够更明确地表达该类的用途（定义 Bean），语义更清晰，也便于 Spring 进行特定的处理（例如，通过 CGLIB 代理确保
          - code [ref=e574]: "@Bean"
          - text: 方法的单例行为）。
        - generic [ref=e575]:
          - text: java
          - button "复制代码" [ref=e576] [cursor=pointer]
          - code [ref=e578]:
            - generic [ref=e579]: "@Configuration"
            - generic [ref=e580]: "public class AppConfig {"
            - generic [ref=e581]: // @Bean 注解用于在配置类中声明一个 Bean
            - generic [ref=e582]: "@Bean"
            - generic [ref=e583]: "public TransferService transferService() {"
            - generic [ref=e584]: return new TransferServiceImpl();
            - generic [ref=e585]: "}"
            - generic [ref=e586]: // 配置类中可以包含一个或多个 @Bean 方法。
            - generic [ref=e587]: "}"
        - heading [level=3] [ref=e600]:
          - link "读取配置信息" [ref=e601] [cursor=pointer]:
            - /url: "#读取配置信息"
        - paragraph [ref=e602]:
          - text: 在应用程序开发中，我们经常需要管理一些配置信息，例如数据库连接细节、第三方服务（如阿里云 OSS、短信服务、微信认证）的密钥或地址等。通常，这些信息会
          - strong [ref=e603]: 集中存放在配置文件
          - text: （如
          - code [ref=e604]: application.yml
          - text: 或
          - code [ref=e605]: application.properties
          - text: ）中，方便管理和修改。
        - paragraph [ref=e606]:
          - text: Spring 提供了多种便捷的方式来读取这些配置信息。假设我们有如下
          - code [ref=e607]: application.yml
          - text: 文件：
        - generic [ref=e608]:
          - text: yaml
          - button "复制代码" [ref=e609] [cursor=pointer]
