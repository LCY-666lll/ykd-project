        - heading [level=3] [ref=e760]:
          - link "HTTP 请求" [ref=e761] [cursor=pointer]:
            - /url: "#http-请求"
        - paragraph [ref=e762]:
          - strong [ref=e763]: "5 种常见的请求类型:"
        - list [ref=e764]:
          - listitem [ref=e765]:
            - strong [ref=e766]: GET
            - text: ：请求从服务器获取特定资源。举个例子：
            - code [ref=e767]: GET /users
            - text: （获取所有学生）
          - listitem [ref=e768]:
            - strong [ref=e769]: POST
            - text: ：在服务器上创建一个新的资源。举个例子：
            - code [ref=e770]: POST /users
            - text: （创建学生）
          - listitem [ref=e771]:
            - strong [ref=e772]: PUT
            - text: ：更新服务器上的资源（客户端提供更新后的整个资源）。举个例子：
            - code [ref=e773]: PUT /users/12
            - text: （更新编号为 12 的学生）
          - listitem [ref=e774]:
            - strong [ref=e775]: DELETE
            - text: ：从服务器删除特定的资源。举个例子：
            - code [ref=e776]: DELETE /users/12
            - text: （删除编号为 12 的学生）
          - listitem [ref=e777]:
            - strong [ref=e778]: PATCH
            - text: ：更新服务器上的资源（客户端提供更改的属性，可以看做作是部分更新），使用的比较少，这里就不举例子了。
        - heading [level=4] [ref=e779]:
          - link "GET 请求" [ref=e780] [cursor=pointer]:
            - /url: "#get-请求"
        - paragraph [ref=e781]:
          - code [ref=e782]: "@GetMapping(\"users\")"
          - text: 等价于
          - code [ref=e783]: "@RequestMapping(value=\"/users\",method=RequestMethod.GET)"
          - text: 。
