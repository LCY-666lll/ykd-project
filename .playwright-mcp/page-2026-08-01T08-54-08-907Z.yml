        - paragraph [ref=e641]: 下面介绍几种常用的读取配置的方式：
        - paragraph [ref=e642]:
          - text: 1、
          - code [ref=e643]: "@Value(\"${property.key}\")"
          - text: 注入配置文件（如
          - code [ref=e644]: application.properties
          - text: 或
          - code [ref=e645]: application.yml
          - text: ）中的单个属性值。它还支持 Spring 表达式语言 (SpEL)，可以实现更复杂的注入逻辑。
        - generic [ref=e646]:
          - text: java
          - button "复制代码" [ref=e647] [cursor=pointer]
          - code [ref=e649]:
            - generic [ref=e650]: "@Value(\"${wuhan2020}\")"
            - generic [ref=e651]: String wuhan2020;
        - paragraph [ref=e655]:
          - text: 2、
          - code [ref=e656]: "@ConfigurationProperties"
          - text: 可以读取配置信息并与 Bean 绑定，用的更多一些。
        - generic [ref=e657]:
          - text: java
