      - generic [ref=e271]:
        - paragraph [ref=e272]: 可以毫不夸张地说，这篇文章介绍的 Spring/SpringBoot 常用注解基本已经涵盖你工作中遇到的大部分常用的场景。对于每一个注解本文都提供了具体用法，掌握这些内容后，使用 Spring Boot 来开发项目基本没啥大问题了！
        - paragraph [ref=e273]:
          - strong [ref=e274]: 为什么要写这篇文章？
        - paragraph [ref=e275]: 最近看到网上有一篇关于 Spring Boot 常用注解的文章被广泛转载，但文章内容存在一些误导性，可能对没有太多实际使用经验的开发者不太友好。于是我花了几天时间总结了这篇文章，希望能够帮助大家更好地理解和使用 Spring 注解。
        - paragraph [ref=e276]:
          - strong [ref=e277]: 因为个人能力和精力有限，如果有任何错误或遗漏，欢迎指正！非常感激！
        - heading [level=2] [ref=e278]:
          - link "Spring Boot 基础注解" [ref=e279] [cursor=pointer]:
            - /url: "#spring-boot-基础注解"
        - paragraph [ref=e280]:
          - code [ref=e281]: "@SpringBootApplication"
          - text: 是 Spring Boot 应用的核心注解，通常用于标注主启动类。
        - paragraph [ref=e282]: 示例：
        - generic [ref=e283]:
          - text: java
          - button "复制代码" [ref=e284] [cursor=pointer]
          - code [ref=e286]:
            - generic [ref=e287]: "@SpringBootApplication"
            - generic [ref=e288]: "public class SpringSecurityJwtGuideApplication {"
            - generic [ref=e289]: "public static void main(java.lang.String[] args) {"
            - generic [ref=e290]: SpringApplication.run(SpringSecurityJwtGuideApplication.class, args);
            - generic [ref=e291]: "}"
            - generic [ref=e292]: "}"
        - paragraph [ref=e300]:
          - text: 我们可以把
          - code [ref=e301]: "@SpringBootApplication"
          - text: 看作是下面三个注解的组合：
        - list [ref=e302]:
          - listitem [ref=e303]:
            - strong [ref=e304]:
              - code [ref=e305]: "@EnableAutoConfiguration"
            - text: ：启用 Spring Boot 的自动配置机制。
          - listitem [ref=e306]:
            - strong [ref=e307]:
              - code [ref=e308]: "@ComponentScan"
            - text: ：扫描
            - code [ref=e309]: "@Component"
            - text: 、
            - code [ref=e310]: "@Service"
            - text: 、
            - code [ref=e311]: "@Repository"
            - text: 、
            - code [ref=e312]: "@Controller"
            - text: 等注解的类。
          - listitem [ref=e313]:
            - strong [ref=e314]:
              - code [ref=e315]: "@Configuration"
            - text: ：允许注册额外的 Spring Bean 或导入其他配置类。
        - paragraph [ref=e316]: 源码如下：
        - generic [ref=e317]:
          - text: java
          - button "复制代码" [ref=e318] [cursor=pointer]
          - code [ref=e320]:
            - generic [ref=e321]: package org.springframework.boot.autoconfigure;
            - generic [ref=e322]: "@Target(ElementType.TYPE)"
            - generic [ref=e323]: "@Retention(RetentionPolicy.RUNTIME)"
            - generic [ref=e324]: "@Documented"
            - generic [ref=e325]: "@Inherited"
            - generic [ref=e326]: "@SpringBootConfiguration"
