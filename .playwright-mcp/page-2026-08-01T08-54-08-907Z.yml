        - paragraph [ref=e1278]:
          - text: 如何使用呢？拿我们在第 5 节参数校验这块来举例子。如果方法参数不对的话就会抛出
          - code [ref=e1279]: MethodArgumentNotValidException
          - text: ，我们来处理这个异常。
        - generic [ref=e1280]:
          - text: java
          - button "复制代码" [ref=e1281] [cursor=pointer]
