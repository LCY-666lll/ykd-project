        - heading [level=2] [ref=e364]:
          - link "Spring Bean" [ref=e365] [cursor=pointer]:
            - /url: "#spring-bean"
        - heading [level=3] [ref=e366]:
          - link "依赖注入（Dependency Injection, DI）" [ref=e367] [cursor=pointer]:
            - /url: "#依赖注入-dependency-injection-di"
        - paragraph [ref=e368]:
          - code [ref=e369]: "@Autowired"
          - text: 用于自动注入依赖项（即其他 Spring Bean）。它可以标注在构造器、字段、Setter 方法或配置方法上，Spring 容器会自动查找匹配类型的 Bean 并将其注入。
        - generic [ref=e370]:
          - text: java
          - button "复制代码" [ref=e371] [cursor=pointer]
          - code [ref=e373]:
            - generic [ref=e374]: "@Service"
            - generic [ref=e375]: "public class UserServiceImpl implements UserService {"
            - generic [ref=e376]: // ...
            - generic [ref=e377]: "}"
            - generic [ref=e378]: "@RestController"
            - generic [ref=e379]: "public class UserController {"
            - generic [ref=e380]: // 字段注入
            - generic [ref=e381]: "@Autowired"
            - generic [ref=e382]: private UserService userService;
            - generic [ref=e383]: // ...
            - generic [ref=e384]: "}"
        - paragraph [ref=e398]:
          - text: 当存在多个相同类型的 Bean 时，
          - code [ref=e399]: "@Autowired"
          - text: 默认按类型注入可能产生歧义。此时，可以与
          - code [ref=e400]: "@Qualifier"
          - text: 结合使用，通过指定 Bean 的名称来精确选择需要注入的实例。
        - generic [ref=e401]:
          - text: java
          - button "复制代码" [ref=e402] [cursor=pointer]
          - code [ref=e404]:
            - generic [ref=e405]: "@Repository(\"userRepositoryA\")"
            - generic [ref=e406]: "public class UserRepositoryA implements UserRepository { /* ... */ }"
            - generic [ref=e407]: "@Repository(\"userRepositoryB\")"
            - generic [ref=e408]: "public class UserRepositoryB implements UserRepository { /* ... */ }"
            - generic [ref=e409]: "@Service"
            - generic [ref=e410]: "public class UserService {"
            - generic [ref=e411]: "@Autowired"
            - generic [ref=e412]: "@Qualifier(\"userRepositoryA\") // 指定注入名为 \"userRepositoryA\" 的 Bean"
            - generic [ref=e413]: private UserRepository userRepository;
            - generic [ref=e414]: // ...
            - generic [ref=e415]: "}"
        - paragraph [ref=e430]:
          - code [ref=e431]: "@Primary"
          - text: 同样是为了解决同一类型存在多个 Bean 实例的注入问题。在 Bean 定义时（例如使用
          - code [ref=e432]: "@Bean"
          - text: 或类注解）添加
          - code [ref=e433]: "@Primary"
          - text: 注解，表示该 Bean 是
          - strong [ref=e434]: 首选
          - text: 的注入对象。当进行
          - code [ref=e435]: "@Autowired"
          - text: 注入时，如果没有使用
          - code [ref=e436]: "@Qualifier"
          - text: 指定名称，Spring 将优先选择带有
          - code [ref=e437]: "@Primary"
          - text: 的 Bean。
        - generic [ref=e438]:
          - text: java
          - button "复制代码" [ref=e439] [cursor=pointer]
          - code [ref=e441]:
            - generic [ref=e442]: "@Primary // 将 UserRepositoryA 设为首选注入对象"
            - generic [ref=e443]: "@Repository(\"userRepositoryA\")"
            - generic [ref=e444]: "public class UserRepositoryA implements UserRepository { /* ... */ }"
            - generic [ref=e445]: "@Repository(\"userRepositoryB\")"
            - generic [ref=e446]: "public class UserRepositoryB implements UserRepository { /* ... */ }"
            - generic [ref=e447]: "@Service"
            - generic [ref=e448]: "public class UserService {"
            - generic [ref=e449]: "@Autowired // 会自动注入 UserRepositoryA，因为它是 @Primary"
            - generic [ref=e450]: private UserRepository userRepository;
            - generic [ref=e451]: // ...
            - generic [ref=e452]: "}"
        - paragraph [ref=e467]:
          - code [ref=e468]: "@Resource(name=\"beanName\")"
          - text: 是 JSR-250 规范定义的注解，也用于依赖注入。它默认按
          - strong [ref=e469]: 名称 (by Name)
          - text: 查找 Bean 进行注入，而
          - code [ref=e470]: "@Autowired"
          - text: 默认按
          - strong [ref=e471]: 类型 (by Type)
          - text: 。如果未指定
          - code [ref=e472]: name
          - text: 属性，它会尝试根据字段名或方法名查找，如果找不到，则回退到按类型查找（类似
          - code [ref=e473]: "@Autowired"
          - text: ）。
        - paragraph [ref=e474]:
          - code [ref=e475]: "@Resource"
          - text: 只能标注在字段 和 Setter 方法上，不支持构造器注入。
        - generic [ref=e476]:
          - text: java
          - button "复制代码" [ref=e477] [cursor=pointer]
          - code [ref=e479]:
            - generic [ref=e480]: "@Service"
            - generic [ref=e481]: "public class UserService {"
            - generic [ref=e482]: "@Resource(name = \"userRepositoryA\")"
            - generic [ref=e483]: private UserRepository userRepository;
            - generic [ref=e484]: // ...
            - generic [ref=e485]: "}"
        - heading [level=3] [ref=e493]:
          - link "Bean 作用域" [ref=e494] [cursor=pointer]:
            - /url: "#bean-作用域"
        - paragraph [ref=e495]:
          - code [ref=e496]: "@Scope(\"scopeName\")"
          - text: 定义 Spring Bean 的作用域，即 Bean 实例的生命周期和可见范围。常用的作用域包括：
        - list [ref=e497]:
          - listitem [ref=e498]:
            - strong [ref=e499]: singleton
            - text: ": IoC 容器中只有唯一的 bean 实例。Spring 中的 bean 默认都是单例的，是对单例设计模式的应用。"
          - listitem [ref=e500]:
            - strong [ref=e501]: prototype
            - text: ": 每次获取都会创建一个新的 bean 实例。也就是说，连续"
            - code [ref=e502]: getBean()
            - text: 两次，得到的是不同的 Bean 实例。
          - listitem [ref=e503]:
            - strong [ref=e504]: request
            - text: "（仅 Web 应用可用）: 每一次 HTTP 请求都会产生一个新的 bean（请求 bean），该 bean 仅在当前 HTTP request 内有效。"
          - listitem [ref=e505]:
            - strong [ref=e506]: session
            - text: "（仅 Web 应用可用） : 每一次来自新 session 的 HTTP 请求都会产生一个新的 bean（会话 bean），该 bean 仅在当前 HTTP session 内有效。"
          - listitem [ref=e507]:
            - strong [ref=e508]: application/global-session
            - text: （仅 Web 应用可用）：每个 Web 应用在启动时创建一个 Bean（应用 Bean），该 bean 仅在当前应用启动时间内有效。
          - listitem [ref=e509]:
            - strong [ref=e510]: websocket
            - text: （仅 Web 应用可用）：每一次 WebSocket 会话产生一个新的 bean。
        - generic [ref=e511]:
          - text: java
