        - generic [ref=e1318]:
          - text: java
          - button "复制代码" [ref=e1319] [cursor=pointer]
          - code [ref=e1321]:
            - generic [ref=e1322]: "@Transactional(rollbackFor = Exception.class)"
            - generic [ref=e1323]: "public void save() {"
            - generic [ref=e1324]: ......
            - generic [ref=e1325]: "}"
        - paragraph [ref=e1331]:
          - text: 我们知道 Exception 分为运行时异常 RuntimeException 和非运行时异常。在
          - code [ref=e1332]: "@Transactional"
          - text: 注解中如果不配置
          - code [ref=e1333]: rollbackFor
          - text: 属性,那么事务只会在遇到
          - code [ref=e1334]: RuntimeException
          - text: 的时候才会回滚,加上
          - code [ref=e1335]: rollbackFor=Exception.class
          - text: ",可以让事务在遇到非运行时异常时也回滚。"
        - paragraph [ref=e1336]:
          - code [ref=e1337]: "@Transactional"
          - text: 注解一般可以作用在
          - code [ref=e1338]: 类
          - text: 或者
          - code [ref=e1339]: 方法
          - text: 上。
        - list [ref=e1340]:
          - listitem [ref=e1341]:
            - strong [ref=e1342]: 作用于类
            - text: ：当把
            - code [ref=e1343]: "@Transactional"
            - text: 注解放在类上时，表示所有该类的 public 方法都配置相同的事务属性信息。
          - listitem [ref=e1344]:
            - strong [ref=e1345]: 作用于方法
            - text: ：当类配置了
            - code [ref=e1346]: "@Transactional"
            - text: ，方法也配置了
            - code [ref=e1347]: "@Transactional"
            - text: ，方法的事务会覆盖类的事务配置信息。
        - paragraph [ref=e1348]:
          - text: 更多关于 Spring 事务的内容请查看我的这篇文章：
          - link "可能是最漂亮的 Spring 事务管理详解" [ref=e1349] [cursor=pointer]:
            - /url: /system-design/framework/spring/spring-transaction.html
          - text: 。
        - heading [level=2] [ref=e1350]:
          - link "JPA" [ref=e1351] [cursor=pointer]:
            - /url: "#jpa"
        - paragraph [ref=e1352]: Spring Data JPA 提供了一系列注解和功能，帮助开发者轻松实现 ORM（对象关系映射）。
        - heading [level=3] [ref=e1353]:
          - link "创建表" [ref=e1354] [cursor=pointer]:
            - /url: "#创建表"
        - paragraph [ref=e1355]:
          - code [ref=e1356]: "@Entity"
          - text: 用于声明一个类为 JPA 实体类，与数据库中的表映射。
          - code [ref=e1357]: "@Table"
          - text: 指定实体对应的表名。
        - generic [ref=e1358]:
          - text: java
          - button "复制代码" [ref=e1359] [cursor=pointer]
          - code [ref=e1361]:
            - generic [ref=e1362]: "@Entity"
            - generic [ref=e1363]: "@Table(name = \"role\")"
            - generic [ref=e1364]: "public class Role {"
            - generic [ref=e1365]: "@Id"
            - generic [ref=e1366]: "@GeneratedValue(strategy = GenerationType.IDENTITY)"
            - generic [ref=e1367]: private Long id;
            - generic [ref=e1368]: private String name;
            - generic [ref=e1369]: private String description;
            - generic [ref=e1370]: // 省略 getter/setter
            - generic [ref=e1371]: "}"
        - heading [level=3] [ref=e1386]:
          - link "主键生成策略" [ref=e1387] [cursor=pointer]:
            - /url: "#主键生成策略"
        - paragraph [ref=e1388]:
          - code [ref=e1389]: "@Id"
          - text: 声明字段为主键。
          - code [ref=e1390]: "@GeneratedValue"
          - text: 指定主键的生成策略。
        - paragraph [ref=e1391]: Jakarta Persistence 3.1 提供了 5 种主键生成策略：
        - list [ref=e1392]:
          - listitem [ref=e1393]:
            - strong [ref=e1394]:
              - code [ref=e1395]: GenerationType.TABLE
            - text: ：通过数据库表生成主键。
          - listitem [ref=e1396]:
            - strong [ref=e1397]:
              - code [ref=e1398]: GenerationType.SEQUENCE
            - text: ：通过数据库序列生成主键（适用于 Oracle 等数据库）。
          - listitem [ref=e1399]:
            - strong [ref=e1400]:
              - code [ref=e1401]: GenerationType.IDENTITY
            - text: ：主键自增长（适用于 MySQL 等数据库）。
          - listitem [ref=e1402]:
            - strong [ref=e1403]:
              - code [ref=e1404]: GenerationType.UUID
            - text: ：生成 RFC 4122 UUID，适用于
            - code [ref=e1405]: UUID
            - text: 或
            - code [ref=e1406]: String
            - text: 类型主键。
          - listitem [ref=e1407]:
            - strong [ref=e1408]:
              - code [ref=e1409]: GenerationType.AUTO
            - text: ：由 JPA 自动选择合适的生成策略（默认策略）。
        - generic [ref=e1410]:
          - text: java
          - button "复制代码" [ref=e1411] [cursor=pointer]
          - code [ref=e1413]:
            - generic [ref=e1414]: "@Id"
            - generic [ref=e1415]: "@GeneratedValue(strategy = GenerationType.IDENTITY)"
            - generic [ref=e1416]: private Long id;
        - paragraph [ref=e1421]:
          - text: 通过
          - code [ref=e1422]: "@GenericGenerator"
          - text: 声明自定义主键生成策略：
        - generic [ref=e1423]:
          - text: java
          - button "复制代码" [ref=e1424] [cursor=pointer]
          - code [ref=e1426]:
            - generic [ref=e1427]: "@Id"
            - generic [ref=e1428]: "@GeneratedValue(generator = \"IdentityIdGenerator\")"
            - generic [ref=e1429]: "@GenericGenerator(name = \"IdentityIdGenerator\", strategy = \"identity\")"
            - generic [ref=e1430]: private Long id;
        - paragraph [ref=e1436]: 等价于：
        - generic [ref=e1437]:
          - text: java
          - button "复制代码" [ref=e1438] [cursor=pointer]
          - code [ref=e1440]:
            - generic [ref=e1441]: "@Id"
            - generic [ref=e1442]: "@GeneratedValue(strategy = GenerationType.IDENTITY)"
            - generic [ref=e1443]: private Long id;
        - paragraph [ref=e1448]:
          - text: 下面是旧版 Hibernate 内部实现的源码节选，展示了当时 Hibernate 支持的字符串生成器策略。它不属于 JPA/Jakarta Persistence 标准 API，也不能替代上面的标准
          - code [ref=e1449]: GenerationType
          - text: 枚举；新项目应以所使用 Hibernate 版本的官方文档为准。
        - generic [ref=e1450]:
          - text: java
          - button "复制代码" [ref=e1451] [cursor=pointer]
          - code [ref=e1453]:
            - generic [ref=e1454]: public class DefaultIdentifierGeneratorFactory
            - generic [ref=e1455]: "implements MutableIdentifierGeneratorFactory, Serializable, ServiceRegistryAwareService {"
            - generic [ref=e1456]: "@SuppressWarnings(\"deprecation\")"
            - generic [ref=e1457]: "public DefaultIdentifierGeneratorFactory() {"
            - generic [ref=e1458]: register( "uuid2", UUIDGenerator.class );
            - generic [ref=e1459]: register( "guid", GUIDGenerator.class ); // can be done with UUIDGenerator + strategy
            - generic [ref=e1460]: register( "uuid", UUIDHexGenerator.class ); // "deprecated" for new use
            - generic [ref=e1461]: register( "uuid.hex", UUIDHexGenerator.class ); // uuid.hex is deprecated
            - generic [ref=e1462]: register( "assigned", Assigned.class );
            - generic [ref=e1463]: register( "identity", IdentityGenerator.class );
            - generic [ref=e1464]: register( "select", SelectGenerator.class );
            - generic [ref=e1465]: register( "sequence", SequenceStyleGenerator.class );
            - generic [ref=e1466]: register( "seqhilo", SequenceHiLoGenerator.class );
            - generic [ref=e1467]: register( "increment", IncrementGenerator.class );
            - generic [ref=e1468]: register( "foreign", ForeignGenerator.class );
            - generic [ref=e1469]: register( "sequence-identity", SequenceIdentityGenerator.class );
            - generic [ref=e1470]: register( "enhanced-sequence", SequenceStyleGenerator.class );
            - generic [ref=e1471]: register( "enhanced-table", TableGenerator.class );
            - generic [ref=e1472]: "}"
            - generic [ref=e1473]: "public void register(String strategy, Class generatorClass) {"
            - generic [ref=e1474]: LOG.debugf( "Registering IdentifierGenerator strategy [%s] -> [%s]", strategy, generatorClass.getName() );
            - generic [ref=e1475]: final Class previous = generatorStrategyToClassNameMap.put( strategy, generatorClass );
            - generic [ref=e1476]: "if ( previous != null ) {"
            - generic [ref=e1477]: LOG.debugf( " - overriding [%s]", previous.getName() );
            - generic [ref=e1478]: "}"
            - generic [ref=e1479]: "}"
            - generic [ref=e1480]: "}"
        - heading [level=3] [ref=e1512]:
          - link "字段映射" [ref=e1513] [cursor=pointer]:
            - /url: "#字段映射"
        - paragraph [ref=e1514]:
          - code [ref=e1515]: "@Column"
          - text: 用于指定实体字段与数据库列的映射关系。
        - list [ref=e1516]:
          - listitem [ref=e1517]:
            - strong [ref=e1518]:
              - code [ref=e1519]: name
            - text: ：指定数据库列名。
          - listitem [ref=e1520]:
            - strong [ref=e1521]:
              - code [ref=e1522]: nullable
            - text: ：指定是否允许为
            - code [ref=e1523]: "null"
            - text: 。
          - listitem [ref=e1524]:
            - strong [ref=e1525]:
              - code [ref=e1526]: length
            - text: ：设置字段的长度（仅适用于
            - code [ref=e1527]: String
            - text: 类型）。
          - listitem [ref=e1528]:
            - strong [ref=e1529]:
              - code [ref=e1530]: columnDefinition
            - text: ：指定字段的数据库类型和默认值。
        - generic [ref=e1531]:
          - text: java
          - button "复制代码" [ref=e1532] [cursor=pointer]
          - code [ref=e1534]:
            - generic [ref=e1535]: "@Column(name = \"user_name\", nullable = false, length = 32)"
            - generic [ref=e1536]: private String userName;
            - generic [ref=e1537]: "@Column(columnDefinition = \"tinyint(1) default 1\")"
            - generic [ref=e1538]: private Boolean enabled;
        - heading [level=3] [ref=e1545]:
          - link "忽略字段" [ref=e1546] [cursor=pointer]:
            - /url: "#忽略字段"
        - paragraph [ref=e1547]:
          - code [ref=e1548]: "@Transient"
          - text: 用于声明不需要持久化的字段。
        - generic [ref=e1549]:
          - text: java
          - button "复制代码" [ref=e1550] [cursor=pointer]
          - code [ref=e1552]:
            - generic [ref=e1553]: "@Entity"
            - generic [ref=e1554]: "public class User {"
            - generic [ref=e1555]: "@Transient"
            - generic [ref=e1556]: private String temporaryField; // 不会映射到数据库表中
            - generic [ref=e1557]: "}"
        - paragraph [ref=e1565]: 其他不被持久化的字段方式：
        - list [ref=e1566]:
          - listitem [ref=e1567]:
            - strong [ref=e1568]:
              - code [ref=e1569]: static
            - text: ：静态字段不会被持久化。
          - listitem [ref=e1570]:
            - strong [ref=e1571]:
              - code [ref=e1572]: final
            - text: ：最终字段不会被持久化。
          - listitem [ref=e1573]:
            - strong [ref=e1574]:
              - code [ref=e1575]: transient
            - text: ：使用 Java 的
            - code [ref=e1576]: transient
            - text: 关键字声明的字段不会被序列化或持久化。
        - heading [level=3] [ref=e1577]:
          - link "大字段存储" [ref=e1578] [cursor=pointer]:
            - /url: "#大字段存储"
        - paragraph [ref=e1579]:
          - code [ref=e1580]: "@Lob"
          - text: 用于声明大字段（如
          - code [ref=e1581]: CLOB
          - text: 或
          - code [ref=e1582]: BLOB
          - text: ）。
        - generic [ref=e1583]:
          - text: java
          - button "复制代码" [ref=e1584] [cursor=pointer]
          - code [ref=e1586]:
            - generic [ref=e1587]: "@Lob"
            - generic [ref=e1588]: "@Column(name = \"content\", columnDefinition = \"LONGTEXT NOT NULL\")"
            - generic [ref=e1589]: private String content;
        - heading [level=3] [ref=e1594]:
          - link "枚举类型映射" [ref=e1595] [cursor=pointer]:
            - /url: "#枚举类型映射"
        - paragraph [ref=e1596]:
          - code [ref=e1597]: "@Enumerated"
          - text: 用于将枚举类型映射为数据库字段。
        - list [ref=e1598]:
          - listitem [ref=e1599]:
            - strong [ref=e1600]:
              - code [ref=e1601]: EnumType.ORDINAL
            - text: ：存储枚举的序号（默认）。
          - listitem [ref=e1602]:
            - strong [ref=e1603]:
              - code [ref=e1604]: EnumType.STRING
            - text: ：存储枚举的名称（推荐）。
        - generic [ref=e1605]:
          - text: java
          - button "复制代码" [ref=e1606] [cursor=pointer]
          - code [ref=e1608]:
            - generic [ref=e1609]: "public enum Gender {"
            - generic [ref=e1610]: MALE,
            - generic [ref=e1611]: FEMALE
            - generic [ref=e1612]: "}"
            - generic [ref=e1613]: "@Entity"
            - generic [ref=e1614]: "public class User {"
            - generic [ref=e1615]: "@Enumerated(EnumType.STRING)"
            - generic [ref=e1616]: private Gender gender;
            - generic [ref=e1617]: "}"
        - paragraph [ref=e1630]:
          - text: 数据库中存储的值为
          - code [ref=e1631]: MALE
          - text: 或
          - code [ref=e1632]: FEMALE
          - text: 。
        - heading [level=3] [ref=e1633]:
          - link "审计功能" [ref=e1634] [cursor=pointer]:
            - /url: "#审计功能"
        - paragraph [ref=e1635]: 通过 JPA 的审计功能，可以在实体中自动记录创建时间、更新时间、创建人和更新人等信息。
        - paragraph [ref=e1636]: "审计基类:"
        - generic [ref=e1637]:
          - text: java
          - button "复制代码" [ref=e1638] [cursor=pointer]
          - code [ref=e1640]:
            - generic [ref=e1641]: "@Data"
            - generic [ref=e1642]: "@MappedSuperclass"
            - generic [ref=e1643]: "@EntityListeners(AuditingEntityListener.class)"
            - generic [ref=e1644]: "public abstract class AbstractAuditBase {"
            - generic [ref=e1645]: "@CreatedDate"
            - generic [ref=e1646]: "@Column(updatable = false)"
            - generic [ref=e1647]: private Instant createdAt;
            - generic [ref=e1648]: "@LastModifiedDate"
            - generic [ref=e1649]: private Instant updatedAt;
            - generic [ref=e1650]: "@CreatedBy"
            - generic [ref=e1651]: "@Column(updatable = false)"
            - generic [ref=e1652]: private String createdBy;
            - generic [ref=e1653]: "@LastModifiedBy"
            - generic [ref=e1654]: private String updatedBy;
            - generic [ref=e1655]: "}"
        - paragraph [ref=e1676]: "配置审计功能:"
        - generic [ref=e1677]:
          - text: java
          - button "复制代码" [ref=e1678] [cursor=pointer]
          - code [ref=e1680]:
            - generic [ref=e1681]: "@Configuration"
            - generic [ref=e1682]: "@EnableJpaAuditing"
            - generic [ref=e1683]: "public class AuditConfig {"
            - generic [ref=e1684]: "@Bean"
            - generic [ref=e1685]: "public AuditorAware<String> auditorProvider() {"
            - generic [ref=e1686]: return () -> Optional.ofNullable(SecurityContextHolder.getContext())
            - generic [ref=e1687]: .map(SecurityContext::getAuthentication)
            - generic [ref=e1688]: .filter(Authentication::isAuthenticated)
            - generic [ref=e1689]: .map(Authentication::getName);
            - generic [ref=e1690]: "}"
            - generic [ref=e1691]: "}"
        - paragraph [ref=e1705]: 简单介绍一下上面涉及到的一些注解：
        - list [ref=e1706]:
          - listitem [ref=e1707]:
            - code [ref=e1708]: "@CreatedDate"
            - text: ": 表示该字段为创建时间字段，在这个实体被 insert 的时候，会设置值"
          - listitem [ref=e1709]:
            - code [ref=e1710]: "@CreatedBy"
            - text: :表示该字段为创建人，在这个实体被 insert 的时候，会设置值
            - code [ref=e1711]: "@LastModifiedDate"
            - text: 、
            - code [ref=e1712]: "@LastModifiedBy"
            - text: 同理。
          - listitem [ref=e1713]:
            - code [ref=e1714]: "@EnableJpaAuditing"
            - text: ：开启 JPA 审计功能。
        - heading [level=3] [ref=e1715]:
          - link "修改和删除操作" [ref=e1716] [cursor=pointer]:
            - /url: "#修改和删除操作"
        - paragraph [ref=e1717]:
          - code [ref=e1718]: "@Modifying"
          - text: 用于把
          - code [ref=e1719]: "@Query"
          - text: 声明的语句标识为 INSERT、UPDATE、DELETE 或 DDL 等修改操作。派生删除方法（例如
          - code [ref=e1720]: deleteByUserName
          - text: ）不需要
          - code [ref=e1721]: "@Modifying"
          - text: 。事务边界既可以声明在 Repository 方法上，也可以由上层 Service 的工作单元统一管理。
        - generic [ref=e1722]:
          - text: java
          - button "复制代码" [ref=e1723] [cursor=pointer]
          - code [ref=e1725]:
            - generic [ref=e1726]: "@Repository"
            - generic [ref=e1727]: "public interface UserRepository extends JpaRepository<User, Long> {"
            - generic [ref=e1728]: "@Modifying"
            - generic [ref=e1729]: "@Transactional"
            - generic [ref=e1730]: "@Query(\"delete from User user where user.userName = :userName\")"
            - generic [ref=e1731]: int deleteByUserName(@Param("userName") String userName);
            - generic [ref=e1732]: "}"
        - heading [level=3] [ref=e1742]:
          - link "关联关系" [ref=e1743] [cursor=pointer]:
            - /url: "#关联关系"
        - paragraph [ref=e1744]: JPA 提供了 4 种关联关系的注解：
        - list [ref=e1745]:
          - listitem [ref=e1746]:
            - strong [ref=e1747]:
              - code [ref=e1748]: "@OneToOne"
            - text: ：一对一关系。
          - listitem [ref=e1749]:
            - strong [ref=e1750]:
              - code [ref=e1751]: "@OneToMany"
            - text: ：一对多关系。
          - listitem [ref=e1752]:
            - strong [ref=e1753]:
              - code [ref=e1754]: "@ManyToOne"
            - text: ：多对一关系。
          - listitem [ref=e1755]:
            - strong [ref=e1756]:
              - code [ref=e1757]: "@ManyToMany"
            - text: ：多对多关系。
        - generic [ref=e1758]:
          - text: java
          - button "复制代码" [ref=e1759] [cursor=pointer]
          - code [ref=e1761]:
            - generic [ref=e1762]: "@Entity"
            - generic [ref=e1763]: "public class User {"
            - generic [ref=e1764]: "@OneToOne"
            - generic [ref=e1765]: private Profile profile;
            - generic [ref=e1766]: "@OneToMany(mappedBy = \"user\")"
            - generic [ref=e1767]: private List<Order> orders;
            - generic [ref=e1768]: "}"
        - heading [level=2] [ref=e1779]:
          - link "JSON 数据处理" [ref=e1780] [cursor=pointer]:
            - /url: "#json-数据处理"
        - paragraph [ref=e1781]: 在 Web 开发中，经常需要处理 Java 对象与 JSON 格式之间的转换。Spring 通常集成 Jackson 库来完成此任务，以下是一些常用的 Jackson 注解，可以帮助我们定制化 JSON 的序列化（Java 对象转 JSON）和反序列化（JSON 转 Java 对象）过程。
        - heading [level=3] [ref=e1782]:
          - link "过滤 JSON 字段" [ref=e1783] [cursor=pointer]:
            - /url: "#过滤-json-字段"
        - paragraph [ref=e1784]: 有时我们不希望 Java 对象的某些字段被包含在最终生成的 JSON 中，或者在将 JSON 转换为 Java 对象时不处理某些 JSON 属性。
        - paragraph [ref=e1785]:
          - code [ref=e1786]: "@JsonIgnoreProperties"
          - text: 作用在类上用于过滤掉特定字段不返回或者不解析。
        - generic [ref=e1787]:
          - text: java
          - button "复制代码" [ref=e1788] [cursor=pointer]
          - code [ref=e1790]:
            - generic [ref=e1791]: // 在生成 JSON 时忽略 userRoles 属性
            - generic [ref=e1792]: // 如果允许未知属性（即 JSON 中有而类中没有的属性），可以添加 ignoreUnknown = true
            - generic [ref=e1793]: "@JsonIgnoreProperties({\"userRoles\"})"
            - generic [ref=e1794]: "public class User {"
            - generic [ref=e1795]: private String userName;
            - generic [ref=e1796]: private String fullName;
            - generic [ref=e1797]: private String password;
            - generic [ref=e1798]: private List<UserRole> userRoles = new ArrayList<>();
            - generic [ref=e1799]: // getters and setters...
            - generic [ref=e1800]: "}"
        - paragraph [ref=e1812]:
          - code [ref=e1813]: "@JsonIgnore"
          - text: 作用于字段或
          - code [ref=e1814]: getter/setter
          - text: 方法级别，用于指定在序列化或反序列化时忽略该特定属性。
        - generic [ref=e1815]:
          - text: java
          - button "复制代码" [ref=e1816] [cursor=pointer]
          - code [ref=e1818]:
            - generic [ref=e1819]: "public class User {"
            - generic [ref=e1820]: private String userName;
            - generic [ref=e1821]: private String fullName;
            - generic [ref=e1822]: private String password;
            - generic [ref=e1823]: // 在生成 JSON 时忽略 userRoles 属性
            - generic [ref=e1824]: "@JsonIgnore"
            - generic [ref=e1825]: private List<UserRole> userRoles = new ArrayList<>();
            - generic [ref=e1826]: // getters and setters...
            - generic [ref=e1827]: "}"
        - paragraph [ref=e1839]:
          - code [ref=e1840]: "@JsonIgnoreProperties"
          - text: 更适用于在类定义时明确排除多个字段，或继承场景下的字段排除；
          - code [ref=e1841]: "@JsonIgnore"
          - text: 则更直接地用于标记单个具体字段。
        - heading [level=3] [ref=e1842]:
          - link "格式化 JSON 数据" [ref=e1843] [cursor=pointer]:
            - /url: "#格式化-json-数据"
        - paragraph [ref=e1844]:
          - code [ref=e1845]: "@JsonFormat"
          - text: 用于指定属性在序列化和反序列化时的格式。常用于日期时间类型的格式化。
