        - paragraph [ref=e2008]:
          - code [ref=e2009]: "@Test"
          - text: 是 JUnit 框架（通常是 JUnit 5 Jupiter）提供的注解，用于标记一个方法为测试方法。虽然不是 Spring 自身的注解，但它是执行单元测试和集成测试的基础。
        - paragraph [ref=e2010]:
          - text: 由 Spring TestContext 在测试线程中管理的
          - code [ref=e2011]: "@Transactional"
          - text: 测试方法默认会在测试结束后回滚，避免污染测试数据。需要注意，如果使用
          - code [ref=e2012]: RANDOM_PORT
          - text: 发起真实 HTTP 请求，服务端处理运行在另一个线程和事务中，不会随测试线程的事务自动回滚，此时需要使用隔离数据库或显式清理数据。
        - paragraph [ref=e2013]:
          - code [ref=e2014]: "@WithMockUser"
          - text: 是 Spring Security Test 模块提供的注解，用于在测试期间模拟一个已认证的用户。可以方便地指定用户名、密码、角色（authorities）等信息，从而测试受安全保护的端点或方法。
