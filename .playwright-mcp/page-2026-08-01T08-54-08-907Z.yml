            - generic [ref=e329]: "@Filter(type = FilterType.CUSTOM, classes = TypeExcludeFilter.class),"
            - generic [ref=e330]: "@Filter(type = FilterType.CUSTOM, classes = AutoConfigurationExcludeFilter.class) })"
