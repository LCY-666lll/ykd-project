            - generic [ref=e1242]: "}"
        - heading [level=2] [ref=e1268]:
          - link "全局异常处理" [ref=e1269] [cursor=pointer]:
            - /url: "#全局异常处理"
        - paragraph [ref=e1270]: 介绍一下我们 Spring 项目必备的全局处理 Controller 层异常。
        - paragraph [ref=e1271]:
          - strong [ref=e1272]: 相关注解：
        - list [ref=e1273]:
