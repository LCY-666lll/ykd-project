        - heading [level=3] [ref=e876]:
          - link "参数绑定" [ref=e877] [cursor=pointer]:
            - /url: "#参数绑定"
        - paragraph [ref=e878]: 在处理 HTTP 请求时，Spring MVC 提供了多种注解用于绑定请求参数到方法参数中。以下是常见的参数绑定方式：
        - heading [level=4] [ref=e879]:
          - link "从 URL 路径中提取参数" [ref=e880] [cursor=pointer]:
            - /url: "#从-url-路径中提取参数"
        - paragraph [ref=e881]:
          - code [ref=e882]: "@PathVariable"
          - text: 用于从 URL 路径中提取参数。例如：
        - generic [ref=e883]:
          - text: java
          - button "复制代码" [ref=e884] [cursor=pointer]
          - code [ref=e886]:
            - generic [ref=e887]: "@GetMapping(\"/klasses/{klassId}/teachers\")"
            - generic [ref=e888]: "public List<Teacher> getTeachersByClass(@PathVariable(\"klassId\") Long klassId) {"
            - generic [ref=e889]: return teacherService.findTeachersByClass(klassId);
            - generic [ref=e890]: "}"
        - paragraph [ref=e896]:
          - text: 若请求 URL 为
          - code [ref=e897]: /klasses/123/teachers
          - text: ，则
          - code [ref=e898]: klassId = 123
          - text: 。
        - heading [level=4] [ref=e899]:
          - link "绑定查询参数" [ref=e900] [cursor=pointer]:
            - /url: "#绑定查询参数"
        - paragraph [ref=e901]:
          - code [ref=e902]: "@RequestParam"
          - text: 用于绑定查询参数。例如：
        - generic [ref=e903]:
          - text: java
          - button "复制代码" [ref=e904] [cursor=pointer]
          - code [ref=e906]:
            - generic [ref=e907]: "@GetMapping(\"/klasses/{klassId}/teachers\")"
            - generic [ref=e908]: public List<Teacher> getTeachersByClass(@PathVariable Long klassId,
            - generic [ref=e909]: "@RequestParam(value = \"type\", required = false) String type) {"
            - generic [ref=e910]: return teacherService.findTeachersByClassAndType(klassId, type);
            - generic [ref=e911]: "}"
        - paragraph [ref=e918]:
          - text: 若请求 URL 为
          - code [ref=e919]: /klasses/123/teachers?type=web
          - text: ，则
          - code [ref=e920]: klassId = 123
          - text: ，
          - code [ref=e921]: type = web
          - text: 。
        - heading [level=4] [ref=e922]:
          - link "绑定请求体中的 JSON 数据" [ref=e923] [cursor=pointer]:
            - /url: "#绑定请求体中的-json-数据"
        - paragraph [ref=e924]:
          - code [ref=e925]: "@RequestBody"
          - text: 用于读取 Request 请求（可能是 POST,PUT,DELETE,GET 请求）的 body 部分并且
          - strong [ref=e926]: Content-Type 为 application/json
          - text: 格式的数据，接收到数据之后会自动将数据绑定到 Java 对象上去。系统会使用
          - code [ref=e927]: HttpMessageConverter
          - text: 或者自定义的
          - code [ref=e928]: HttpMessageConverter
          - text: 将请求的 body 中的 json 字符串转换为 java 对象。
        - paragraph [ref=e929]: 我用一个简单的例子来给演示一下基本使用！
        - paragraph [ref=e930]: 我们有一个注册的接口：
        - generic [ref=e931]:
          - text: java
          - button "复制代码" [ref=e932] [cursor=pointer]
          - code [ref=e934]:
            - generic [ref=e935]: "@PostMapping(\"/sign-up\")"
            - generic [ref=e936]: "public ResponseEntity signUp(@RequestBody @Valid UserRegisterRequest userRegisterRequest) {"
            - generic [ref=e937]: userService.save(userRegisterRequest);
            - generic [ref=e938]: return ResponseEntity.ok().build();
            - generic [ref=e939]: "}"
        - paragraph [ref=e946]:
          - code [ref=e947]: UserRegisterRequest
          - text: 对象：
        - generic [ref=e948]:
          - text: java
          - button "复制代码" [ref=e949] [cursor=pointer]
          - code [ref=e951]:
            - generic [ref=e952]: "@Data"
            - generic [ref=e953]: "@AllArgsConstructor"
            - generic [ref=e954]: "@NoArgsConstructor"
            - generic [ref=e955]: "public class UserRegisterRequest {"
            - generic [ref=e956]: "@NotBlank"
            - generic [ref=e957]: private String userName;
            - generic [ref=e958]: "@NotBlank"
            - generic [ref=e959]: private String password;
            - generic [ref=e960]: "@NotBlank"
            - generic [ref=e961]: private String fullName;
            - generic [ref=e962]: "}"
        - paragraph [ref=e975]: 我们发送 post 请求到这个接口，并且 body 携带 JSON 数据：
        - generic [ref=e976]:
          - text: json
          - button "复制代码" [ref=e977] [cursor=pointer]
          - code [ref=e979]:
            - generic [ref=e980]: "{ \"userName\": \"coder\", \"fullName\": \"shuangkou\", \"password\": \"123456\" }"
        - paragraph [ref=e983]:
          - text: 这样我们的后端就可以直接把 json 格式的数据映射到我们的
          - code [ref=e984]: UserRegisterRequest
          - text: 类上。
        - paragraph [ref=e985]
        - paragraph [ref=e986]:
          - strong [ref=e987]: 注意
          - text: ：
        - list [ref=e988]:
          - listitem [ref=e989]:
            - text: 一个方法只能有一个
            - code [ref=e990]: "@RequestBody"
            - text: 参数，但可以有多个
            - code [ref=e991]: "@PathVariable"
            - text: 和
            - code [ref=e992]: "@RequestParam"
            - text: 。
          - listitem [ref=e993]: 如果需要接收多个复杂对象，建议合并成一个单一对象。
        - heading [level=2] [ref=e994]:
          - link "数据校验" [ref=e995] [cursor=pointer]:
            - /url: "#数据校验"
        - paragraph [ref=e996]:
          - text: 数据校验是保障系统稳定性和安全性的关键环节。即使在用户界面（前端）已经实施了数据校验，
          - strong [ref=e997]: 后端服务仍必须对接收到的数据进行再次校验
          - text: 。这是因为前端校验可以被轻易绕过（例如，通过开发者工具修改请求或使用 Postman、curl 等 HTTP 工具直接调用 API），恶意或错误的数据可能直接发送到后端。因此，后端校验是防止非法数据、维护数据一致性、确保业务逻辑正确执行的最后一道，也是最重要的一道防线。
        - paragraph [ref=e998]: Bean Validation 是一套定义 JavaBean 参数校验标准的规范 (JSR 303, 349, 380)，它提供了一系列注解，可以直接用于 JavaBean 的属性上，从而实现便捷的参数校验。
        - list [ref=e999]:
          - listitem [ref=e1000]:
            - strong [ref=e1001]: "JSR 303 (Bean Validation 1.0):"
            - text: 奠定了基础，引入了核心校验注解（如
            - code [ref=e1002]: "@NotNull"
            - text: 、
            - code [ref=e1003]: "@Size"
            - text: 、
            - code [ref=e1004]: "@Min"
            - text: 、
            - code [ref=e1005]: "@Max"
            - text: 等），定义了如何通过注解的方式对 JavaBean 的属性进行校验，并支持嵌套对象校验和自定义校验器。
          - listitem [ref=e1006]:
            - strong [ref=e1007]: "JSR 349 (Bean Validation 1.1):"
            - text: 在 1.0 基础上进行扩展，例如引入了对方法参数和返回值校验的支持、增强了对分组校验（Group Validation）的处理。
          - listitem [ref=e1008]:
            - strong [ref=e1009]: "JSR 380 (Bean Validation 2.0):"
            - text: 拥抱 Java 8 的新特性，并进行了一些改进，例如支持
            - code [ref=e1010]: java.time
            - text: 包中的日期和时间类型、引入了一些新的校验注解（如
            - code [ref=e1011]: "@NotEmpty"
            - text: ","
            - code [ref=e1012]: "@NotBlank"
            - text: 等）。
        - paragraph [ref=e1013]:
          - text: Bean Validation 本身只是一套
          - strong [ref=e1014]: 规范（接口和注解）
          - text: ，我们需要一个实现了这套规范的
          - strong [ref=e1015]: 具体框架
          - text: 来执行校验逻辑。目前，
          - strong [ref=e1016]: Hibernate Validator
          - text: 是 Bean Validation 规范最权威、使用最广泛的参考实现。
        - list [ref=e1017]:
          - listitem [ref=e1018]: Hibernate Validator 4.x 实现了 Bean Validation 1.0 (JSR 303)。
          - listitem [ref=e1019]: Hibernate Validator 5.x 实现了 Bean Validation 1.1 (JSR 349)。
          - listitem [ref=e1020]:
            - text: Hibernate Validator 6.x 实现了 Bean Validation 2.0（JSR 380），使用
            - code [ref=e1021]: javax.validation
            - text: 包名。
          - listitem [ref=e1022]:
            - text: Hibernate Validator 7.x 和 8.x 实现了 Jakarta Bean Validation 3.0，使用
            - code [ref=e1023]: jakarta.validation
            - text: 包名；Hibernate Validator 9.x 实现了 Jakarta Validation 3.1。
        - paragraph [ref=e1024]: 在 Spring Boot 项目中使用 Bean Validation 非常方便，这得益于 Spring Boot 的自动配置能力。关于依赖引入，需要注意：
        - list [ref=e1025]:
          - listitem [ref=e1026]:
            - text: 在较早版本的 Spring Boot（通常指 2.3.x 之前）中，
            - code [ref=e1027]: spring-boot-starter-web
            - text: 依赖默认包含了 hibernate-validator。因此，只要引入了 Web Starter，就无需额外添加校验相关的依赖。
          - listitem [ref=e1028]:
            - text: 从 Spring Boot 2.3.x 版本开始，为了更精细化的依赖管理，校验相关的依赖被移出了 spring-boot-starter-web。如果你的项目使用了这些或更新的版本，并且需要 Bean Validation 功能，那么你需要显式地添加
            - code [ref=e1029]: spring-boot-starter-validation
            - text: 依赖：
        - generic [ref=e1030]:
          - text: xml
          - button "复制代码" [ref=e1031] [cursor=pointer]
          - code [ref=e1033]:
            - generic [ref=e1034]: <dependency>
            - generic [ref=e1035]: <groupId>org.springframework.boot</groupId>
            - generic [ref=e1036]: <artifactId>spring-boot-starter-validation</artifactId>
            - generic [ref=e1037]: </dependency>
        - paragraph [ref=e1043]
        - paragraph [ref=e1044]:
          - text: 非 SpringBoot 项目需要自行引入相关依赖包，这里不多做讲解，具体可以查看我的这篇文章：
          - link "如何在 Spring/Spring Boot 中做参数校验？你需要了解的都在这里！" [ref=e1045] [cursor=pointer]:
            - /url: https://mp.weixin.qq.com/s?__biz=Mzg2OTA0Njk0OA==&mid=2247485783&idx=1&sn=a407f3b75efa17c643407daa7fb2acd6&chksm=cea2469cf9d5cf8afbcd0a8a1c9cc4294d6805b8e01bee6f76bb2884c5bc15478e91459def49&token=292197051&lang=zh_CN#rd
          - text: 。
        - paragraph [ref=e1046]:
          - text: 👉 需要注意的是：优先使用 Bean Validation/Jakarta Validation 规范提供的约束注解，而不是 Hibernate Validator 私有约束。Spring Boot 2.x 通常使用
          - code [ref=e1047]: javax.validation.constraints
          - text: ，Spring Boot 3.x 及以上版本使用
          - code [ref=e1048]: jakarta.validation.constraints
          - text: 。
        - heading [level=3] [ref=e1049]:
          - link "一些常用的字段验证的注解" [ref=e1050] [cursor=pointer]:
            - /url: "#一些常用的字段验证的注解"
        - paragraph [ref=e1051]: Bean Validation 规范及其实现（如 Hibernate Validator）提供了丰富的注解，用于声明式地定义校验规则。以下是一些常用的注解及其说明：
        - list [ref=e1052]:
          - listitem [ref=e1053]:
            - code [ref=e1054]: "@NotNull"
            - text: ": 检查被注解的元素（任意类型）不能为"
            - code [ref=e1055]: "null"
            - text: 。
          - listitem [ref=e1056]:
            - code [ref=e1057]: "@NotEmpty"
            - text: ": 检查被注解的元素（如"
            - code [ref=e1058]: CharSequence
            - text: 、
            - code [ref=e1059]: Collection
            - text: 、
            - code [ref=e1060]: Map
            - text: 、
            - code [ref=e1061]: Array
            - text: ）不能为
            - code [ref=e1062]: "null"
            - text: 且其大小/长度不能为 0。注意：对于字符串，
            - code [ref=e1063]: "@NotEmpty"
            - text: 允许包含空白字符的字符串，如
            - code [ref=e1064]: "\" \""
            - text: 。
          - listitem [ref=e1065]:
            - code [ref=e1066]: "@NotBlank"
            - text: ": 检查被注解的"
            - code [ref=e1067]: CharSequence
            - text: （如
            - code [ref=e1068]: String
            - text: ）不能为
            - code [ref=e1069]: "null"
            - text: ，并且去除首尾空格后的长度必须大于 0。（即，不能为空白字符串）。
          - listitem [ref=e1070]:
            - code [ref=e1071]: "@Null"
            - text: ": 检查被注解的元素必须为"
            - code [ref=e1072]: "null"
            - text: 。
          - listitem [ref=e1073]:
            - code [ref=e1074]: "@AssertTrue"
            - text: /
            - code [ref=e1075]: "@AssertFalse"
            - text: ": 检查被注解的"
            - code [ref=e1076]: boolean
            - text: 或
            - code [ref=e1077]: Boolean
            - text: 类型元素必须为
            - code [ref=e1078]: "true"
            - text: /
            - code [ref=e1079]: "false"
            - text: 。
          - listitem [ref=e1080]:
            - code [ref=e1081]: "@Min(value)"
            - text: /
            - code [ref=e1082]: "@Max(value)"
            - text: ": 检查被注解的数字类型（或其字符串表示）的值必须大于等于 / 小于等于指定的"
            - code [ref=e1083]: value
            - text: 。适用于整数类型（
            - code [ref=e1084]: byte
            - text: 、
            - code [ref=e1085]: short
            - text: 、
            - code [ref=e1086]: int
            - text: 、
            - code [ref=e1087]: long
            - text: 、
            - code [ref=e1088]: BigInteger
            - text: 等）。
          - listitem [ref=e1089]:
            - code [ref=e1090]: "@DecimalMin(value)"
            - text: /
            - code [ref=e1091]: "@DecimalMax(value)"
            - text: ": 功能类似"
            - code [ref=e1092]: "@Min"
            - text: /
            - code [ref=e1093]: "@Max"
            - text: ，但适用于包含小数的数字类型（
            - code [ref=e1094]: BigDecimal
            - text: 、
            - code [ref=e1095]: BigInteger
            - text: 、
            - code [ref=e1096]: CharSequence
            - text: 、
            - code [ref=e1097]: byte
            - text: 、
            - code [ref=e1098]: short
            - text: 、
            - code [ref=e1099]: int
            - text: 、
            - code [ref=e1100]: long
            - text: 及其包装类）。
            - code [ref=e1101]: value
            - text: 必须是数字的字符串表示。
          - listitem [ref=e1102]:
            - code [ref=e1103]: "@Size(min=, max=)"
            - text: ": 检查被注解的元素（如"
            - code [ref=e1104]: CharSequence
            - text: 、
            - code [ref=e1105]: Collection
            - text: 、
            - code [ref=e1106]: Map
            - text: 、
            - code [ref=e1107]: Array
            - text: ）的大小/长度必须在指定的
            - code [ref=e1108]: min
            - text: 和
            - code [ref=e1109]: max
            - text: 范围之内（包含边界）。
          - listitem [ref=e1110]:
            - code [ref=e1111]: "@Digits(integer=, fraction=)"
            - text: ": 检查被注解的数字类型（或其字符串表示）的值，其整数部分的位数必须 ≤"
            - code [ref=e1112]: integer
            - text: ，小数部分的位数必须 ≤
            - code [ref=e1113]: fraction
            - text: 。
          - listitem [ref=e1114]:
            - code [ref=e1115]: "@Pattern(regexp=, flags=)"
            - text: ": 检查被注解的"
            - code [ref=e1116]: CharSequence
            - text: （如
            - code [ref=e1117]: String
            - text: ）是否匹配指定的正则表达式 (
            - code [ref=e1118]: regexp
            - text: )。
            - code [ref=e1119]: flags
            - text: 可以指定匹配模式（如不区分大小写）。
          - listitem [ref=e1120]:
            - code [ref=e1121]: "@Email"
            - text: ": 检查被注解的"
            - code [ref=e1122]: CharSequence
            - text: （如
            - code [ref=e1123]: String
            - text: ）是否符合 Email 格式（内置了一个相对宽松的正则表达式）。
          - listitem [ref=e1124]:
            - code [ref=e1125]: "@Past"
            - text: /
            - code [ref=e1126]: "@Future"
            - text: ": 检查被注解的日期或时间类型（"
            - code [ref=e1127]: java.util.Date
            - text: 、
            - code [ref=e1128]: java.util.Calendar
            - text: 、JSR 310
            - code [ref=e1129]: java.time
            - text: 包下的类型）是否在当前时间之前 / 之后。
          - listitem [ref=e1130]:
            - code [ref=e1131]: "@PastOrPresent"
            - text: /
            - code [ref=e1132]: "@FutureOrPresent"
            - text: ": 类似"
            - code [ref=e1133]: "@Past"
            - text: /
            - code [ref=e1134]: "@Future"
            - text: ，但允许等于当前时间。
          - listitem [ref=e1135]: ……
        - heading [level=3] [ref=e1136]:
          - link "验证请求体(RequestBody)" [ref=e1137] [cursor=pointer]:
            - /url: "#验证请求体-requestbody"
        - paragraph [ref=e1138]:
          - text: 当 Controller 方法使用
          - code [ref=e1139]: "@RequestBody"
          - text: 注解来接收请求体并将其绑定到一个对象时，可以在该参数前添加
          - code [ref=e1140]: "@Valid"
          - text: 注解来触发对该对象的校验。如果验证失败，它将抛出
          - code [ref=e1141]: MethodArgumentNotValidException
          - text: 。
        - generic [ref=e1142]:
          - text: java
          - button "复制代码" [ref=e1143] [cursor=pointer]
          - code [ref=e1145]:
            - generic [ref=e1146]: "@Data"
            - generic [ref=e1147]: "@AllArgsConstructor"
            - generic [ref=e1148]: "@NoArgsConstructor"
            - generic [ref=e1149]: "public class Person {"
            - generic [ref=e1150]: "@NotNull(message = \"classId 不能为空\")"
            - generic [ref=e1151]: private String classId;
            - generic [ref=e1152]: "@Size(max = 33)"
            - generic [ref=e1153]: "@NotNull(message = \"name 不能为空\")"
            - generic [ref=e1154]: private String name;
            - generic [ref=e1155]: "@Pattern(regexp = \"((^Man$|^Woman$|^UGM$))\", message = \"sex 值不在可选范围\")"
            - generic [ref=e1156]: "@NotNull(message = \"sex 不能为空\")"
            - generic [ref=e1157]: private String sex;
            - generic [ref=e1158]: "@Email(message = \"email 格式不正确\")"
            - generic [ref=e1159]: "@NotNull(message = \"email 不能为空\")"
            - generic [ref=e1160]: private String email;
            - generic [ref=e1161]: "}"
            - generic [ref=e1162]: "@RestController"
            - generic [ref=e1163]: "@RequestMapping(\"/api\")"
            - generic [ref=e1164]: "public class PersonController {"
            - generic [ref=e1165]: "@PostMapping(\"/person\")"
            - generic [ref=e1166]: "public ResponseEntity<Person> getPerson(@RequestBody @Valid Person person) {"
            - generic [ref=e1167]: return ResponseEntity.ok().body(person);
            - generic [ref=e1168]: "}"
            - generic [ref=e1169]: "}"
        - heading [level=3] [ref=e1200]:
          - link "验证请求参数(Path Variables 和 Request Parameters)" [ref=e1201] [cursor=pointer]:
            - /url: "#验证请求参数-path-variables-和-request-parameters"
        - paragraph [ref=e1202]:
          - text: 对于直接映射到方法参数的简单类型数据（如路径变量
          - code [ref=e1203]: "@PathVariable"
          - text: 或请求参数
          - code [ref=e1204]: "@RequestParam"
          - text: ），校验方式会因 Spring Framework 版本而异：
        - list [ref=e1205]:
          - listitem [ref=e1206]:
            - strong [ref=e1207]: Spring Framework 6.1 及以上版本
            - text: ：Spring MVC 内置支持 Handler Method Validation。将
            - code [ref=e1208]: "@Min"
            - text: 、
            - code [ref=e1209]: "@Max"
            - text: 、
            - code [ref=e1210]: "@Size"
            - text: 、
            - code [ref=e1211]: "@Pattern"
            - text: 等约束注解直接放在方法参数上即可，不要在 Controller 类上添加
            - code [ref=e1212]: "@Validated"
            - text: ，否则会改用基于 AOP 的方法校验。
          - listitem [ref=e1213]:
            - strong [ref=e1214]: Spring Framework 6.0 及更早版本
            - text: ：通常需要在 Controller 类上添加 Spring 提供的
            - code [ref=e1215]: "@Validated"
            - text: ，通过方法校验基础设施处理参数约束。
        - paragraph [ref=e1216]: 下面以 Spring Framework 6.1 及以上版本的内置校验方式为例：
        - generic [ref=e1217]:
          - text: java
          - button "复制代码" [ref=e1218] [cursor=pointer]
          - code [ref=e1220]:
            - generic [ref=e1221]: "@RestController"
            - generic [ref=e1222]: "@RequestMapping(\"/api\")"
            - generic [ref=e1223]: "public class PersonController {"
            - generic [ref=e1224]: "@GetMapping(\"/person/{id}\")"
            - generic [ref=e1225]: public ResponseEntity<Integer> getPersonByID(
            - generic [ref=e1226]: "@PathVariable(\"id\")"
            - generic [ref=e1227]: "@Max(value = 5, message = \"ID 不能超过 5\")"
            - generic [ref=e1228]: Integer id
            - generic [ref=e1229]: ") {"
            - generic [ref=e1230]: // Spring MVC 6.1+ 会在进入方法体前抛出 HandlerMethodValidationException。
            - generic [ref=e1231]: return ResponseEntity.ok().body(id);
            - generic [ref=e1232]: "}"
            - generic [ref=e1233]: "@GetMapping(\"/person\")"
            - generic [ref=e1234]: public ResponseEntity<String> findPersonByName(
            - generic [ref=e1235]: "@RequestParam(\"name\")"
            - generic [ref=e1236]: "@NotBlank(message = \"姓名不能为空\") // 同样适用于 @RequestParam"
            - generic [ref=e1237]: "@Size(max = 10, message = \"姓名长度不能超过 10\")"
            - generic [ref=e1238]: String name
            - generic [ref=e1239]: ") {"
            - generic [ref=e1240]: "return ResponseEntity.ok().body(\"Found person: \" + name);"
