            - strong [ref=e2501]: Oracle OpenJDK8
            - text: "中有六种生成方式 (其中第五种是返回地址), 通过添加 VM 参数: -XX:hashCode=4 启用第五种。参考源码:"
          - list [ref=e2502]:
            - listitem [ref=e2503]:
