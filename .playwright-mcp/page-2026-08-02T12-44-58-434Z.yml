            - text: （异常、泛型、反射、SPI、序列化、注解等）
        - heading [level=2] [ref=e588]:
          - link "基础概念与常识" [ref=e589] [cursor=pointer]:
            - /url: "#基础概念与常识"
        - heading [level=3] [ref=e590]:
          - link "⭐️JVM vs JDK vs JRE" [ref=e591] [cursor=pointer]:
            - /url: "#⭐️jvm-vs-jdk-vs-jre"
        - heading [level=4] [ref=e592]:
          - link "JVM" [ref=e593] [cursor=pointer]:
            - /url: "#jvm"
        - paragraph [ref=e594]: Java 虚拟机（Java Virtual Machine, JVM）是运行 Java 字节码的虚拟机。JVM 有针对不同系统的特定实现（Windows，Linux，macOS），目的是使用相同的字节码，它们都会给出相同的结果。字节码和不同系统的 JVM 实现是 Java 语言“一次编译，随处可以运行”的关键所在。
        - paragraph [ref=e595]:
          - text: 如下图所示，不同编程语言（Java、Groovy、Kotlin、JRuby、Clojure ...）通过各自的编译器编译成
          - code [ref=e596]: .class
          - text: 文件，并最终通过 JVM 在不同平台（Windows、Mac、Linux）上运行。
        - paragraph [ref=e597]:
          - img "运行在 Java 虚拟机之上的编程语言" [ref=e598]
        - paragraph [ref=e599]:
          - strong [ref=e600]: JVM 并不是只有一种！只要满足 JVM 规范，每个公司、组织或者个人都可以开发自己的专属 JVM。
          - text: 也就是说我们平时接触到的 HotSpot VM 仅仅是是 JVM 规范的一种实现而已。
        - paragraph [ref=e601]:
          - text: 除了我们平时最常用的 HotSpot VM 外，还有 J9 VM、Zing VM、JRockit VM 等 JVM 。维基百科上就有常见 JVM 的对比：
          - link "Comparison of Java virtual machines" [ref=e602] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Comparison_of_Java_virtual_machines
          - text: ，感兴趣的可以去看看。并且，你可以在
          - link "Java SE Specifications" [ref=e603] [cursor=pointer]:
            - /url: https://docs.oracle.com/javase/specs/index.html
          - text: 上找到各个版本的 JDK 对应的 JVM 规范。
        - paragraph [ref=e604]
        - heading [level=4] [ref=e605]:
          - link "JDK 和 JRE" [ref=e606] [cursor=pointer]:
            - /url: "#jdk-和-jre"
        - paragraph [ref=e607]: JDK（Java Development Kit）是一个功能齐全的 Java 开发工具包，供开发者使用，用于创建和编译 Java 程序。它包含了 JRE（Java Runtime Environment），以及编译器 javac 和其他工具，如 javadoc（文档生成器）、jdb（调试器）、jconsole（监控工具）、javap（反编译工具）等。
        - paragraph [ref=e608]: JRE 是运行已编译 Java 程序所需的环境，主要包含以下两个部分：
        - list [ref=e609]:
          - listitem [ref=e610]:
            - strong [ref=e611]: JVM
            - text: ": 也就是我们上面提到的 Java 虚拟机。"
          - listitem [ref=e612]:
            - strong [ref=e613]: Java 基础类库（Class Library）
            - text: ：一组标准的类库，提供常用的功能和 API（如 I/O 操作、网络通信、数据结构等）。
        - paragraph [ref=e614]: 简单来说，JRE 只包含运行 Java 程序所需的环境和类库，而 JDK 不仅包含 JRE，还包括用于开发和调试 Java 程序的工具。
        - paragraph [ref=e615]: 如果需要编写、编译 Java 程序或使用 Java API 文档，就需要安装 JDK。某些需要 Java 特性的应用程序（如 JSP 转换为 Servlet 或使用反射）也可能需要 JDK 来编译和运行 Java 代码。因此，即使不进行 Java 开发工作，有时也可能需要安装 JDK。
        - paragraph [ref=e616]: 下图清晰展示了 JDK、JRE 和 JVM 的关系。
        - paragraph [ref=e617]:
          - img "jdk-include-jre" [ref=e618]
        - paragraph [ref=e619]:
          - text: 不过，从 JDK 9 开始，就不需要区分 JDK 和 JRE 的关系了，取而代之的是模块系统（JDK 被重新组织成 94 个模块）+
          - link "jlink" [ref=e620] [cursor=pointer]:
            - /url: http://openjdk.java.net/jeps/282
          - text: 工具 (随 Java 9 一起发布的新命令行工具，用于生成自定义 Java 运行时映像，该映像仅包含给定应用程序所需的模块) 。并且，从 JDK 11 开始，Oracle 不再提供单独的 JRE 下载。
        - paragraph [ref=e621]:
          - text: 在
          - link "Java 9 新特性概览" [ref=e622] [cursor=pointer]:
            - /url: https://javaguide.cn/java/new-features/java9.html
          - text: 这篇文章中，我在介绍模块化系统的时候提到：
        - blockquote [ref=e623]:
          - paragraph [ref=e624]: 在引入了模块系统之后，JDK 被重新组织成 94 个模块。Java 应用可以通过新增的 jlink 工具，创建出只包含所依赖的 JDK 模块的自定义运行时镜像。这样可以极大的减少 Java 运行时环境的大小。
        - paragraph [ref=e625]: 也就是说，可以用 jlink 根据自己的需求，创建一个更小的 runtime（运行时），而不是不管什么应用，都是同样的 JRE。
        - paragraph [ref=e626]: 定制的、模块化的 Java 运行时映像有助于简化 Java 应用的部署和节省内存并增强安全性和可维护性。这对于满足现代应用程序架构的需求，如虚拟化、容器化、微服务和云原生开发，是非常重要的。
        - heading [level=3] [ref=e627]:
          - link "⭐️什么是字节码?采用字节码的好处是什么?" [ref=e628] [cursor=pointer]:
            - /url: "#⭐️什么是字节码-采用字节码的好处是什么"
        - paragraph [ref=e629]:
          - text: 在 Java 中，JVM 可以理解的代码就叫做字节码（即扩展名为
          - code [ref=e630]: .class
          - text: 的文件），它不面向任何特定的处理器，只面向虚拟机。Java 语言通过字节码的方式，在一定程度上解决了传统解释型语言执行效率低的问题，同时又保留了解释型语言可移植的特点。所以， Java 程序运行时相对来说还是高效的（不过，和 C、 C++，Rust，Go 等语言还是有一定差距的），而且，由于字节码并不针对一种特定的机器，因此，Java 程序无须重新编译便可在多种不同操作系统的计算机上运行。
        - paragraph [ref=e631]:
          - strong [ref=e632]: Java 程序从源代码到运行的过程如下图所示
          - text: ：
        - paragraph [ref=e633]:
          - img "Java程序转变为机器代码的过程" [ref=e634]
        - paragraph [ref=e635]:
          - text: 我们需要格外注意的是
          - code [ref=e636]: .class->机器码
          - text: 这一步。在这一步 JVM 类加载器首先加载字节码文件，然后通过解释器逐行解释执行，这种方式的执行速度会相对比较慢。而且，有些方法和代码块是经常需要被调用的(也就是所谓的热点代码)，所以后面引进了
          - strong [ref=e637]: JIT（Just in Time Compilation）
          - text: 编译器，而 JIT 属于运行时编译。当 JIT 编译器完成第一次编译后，其会将字节码对应的机器码保存下来，下次可以直接使用。而我们知道，机器码的运行效率肯定是高于 Java 解释器的。这也解释了我们为什么经常会说
          - strong [ref=e638]: Java 是编译与解释共存的语言
          - text: 。
        - blockquote [ref=e639]:
          - paragraph [ref=e640]: 🌈 拓展阅读：
          - list [ref=e641]:
            - listitem [ref=e642]:
              - link "基本功 | Java 即时编译器原理解析及实践 - 美团技术团队" [ref=e643] [cursor=pointer]:
                - /url: https://tech.meituan.com/2020/10/22/java-jit-practice-in-meituan.html
            - listitem [ref=e644]:
              - link "基于静态编译构建微服务应用 - 阿里巴巴中间件" [ref=e645] [cursor=pointer]:
                - /url: https://mp.weixin.qq.com/s/4haTyXUmh8m-dBQaEzwDJw
        - paragraph [ref=e646]:
          - img "Java程序转变为机器代码的过程" [ref=e647]
        - blockquote [ref=e648]:
          - paragraph [ref=e649]: HotSpot 采用了惰性评估(Lazy Evaluation)的做法，根据二八定律，消耗大部分系统资源的只有那一小部分的代码（热点代码），而这也就是 JIT 所需要编译的部分。JVM 会根据代码每次被执行的情况收集信息并相应地做出一些优化，因此执行的次数越多，它的速度就越快。
        - paragraph [ref=e650]: JDK、JRE、JVM、JIT 这四者的关系如下图所示。
        - paragraph [ref=e651]:
          - img "JDK、JRE、JVM、JIT 这四者的关系" [ref=e652]
        - paragraph [ref=e653]: 下面这张图是 JVM 的大致结构模型。
        - paragraph [ref=e654]:
          - img "JVM 的大致结构模型" [ref=e655]
        - heading [level=3] [ref=e656]:
          - link "⭐️为什么说 Java 语言“编译与解释并存”？" [ref=e657] [cursor=pointer]:
            - /url: "#⭐️为什么说-java-语言-编译与解释并存"
        - paragraph [ref=e658]: 其实这个问题我们讲字节码的时候已经提到过，因为比较重要，所以我们这里再提一下。
        - paragraph [ref=e659]: 我们可以将高级编程语言按照程序的执行方式分为两种：
        - list [ref=e660]:
          - listitem [ref=e661]:
            - strong [ref=e662]: 编译型
            - text: ：
            - link "编译型语言" [ref=e663] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E7%B7%A8%E8%AD%AF%E8%AA%9E%E8%A8%80
            - text: 会通过
            - link "编译器" [ref=e664] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E7%B7%A8%E8%AD%AF%E5%99%A8
            - text: 将源代码一次性翻译成可被该平台执行的机器码。一般情况下，编译语言的执行速度比较快，开发效率比较低。常见的编译性语言有 C、C++、Go、Rust 等等。
          - listitem [ref=e665]:
            - strong [ref=e666]: 解释型
            - text: ：
            - link "解释型语言" [ref=e667] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E7%9B%B4%E8%AD%AF%E8%AA%9E%E8%A8%80
            - text: 会通过
            - link "解释器" [ref=e668] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E7%9B%B4%E8%AD%AF%E5%99%A8
            - text: 一句一句的将代码解释（interpret）为机器代码后再执行。解释型语言开发效率比较快，执行速度比较慢。常见的解释性语言有 Python、JavaScript、PHP 等等。
        - paragraph [ref=e669]:
          - img "编译型语言和解释型语言" [ref=e670]
        - paragraph [ref=e671]: 根据维基百科介绍：
        - blockquote [ref=e672]:
          - paragraph [ref=e673]:
            - text: 为了改善解释语言的效率而发展出的
            - link "即时编译" [ref=e674] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E5%8D%B3%E6%99%82%E7%B7%A8%E8%AD%AF
            - text: 技术，已经缩小了这两种语言间的差距。这种技术混合了编译语言与解释型语言的优点，它像编译语言一样，先把程序源代码编译成
            - link "字节码" [ref=e675] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/%E5%AD%97%E8%8A%82%E7%A0%81
            - text: 。到执行期时，再将字节码直译，之后执行。
            - link "Java" [ref=e676] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/Java
            - text: 与
            - link "LLVM" [ref=e677] [cursor=pointer]:
              - /url: https://zh.wikipedia.org/wiki/LLVM
            - text: 是这种技术的代表产物。
          - paragraph [ref=e678]:
            - text: 相关阅读：
            - link "基本功 | Java 即时编译器原理解析及实践" [ref=e679] [cursor=pointer]:
              - /url: https://tech.meituan.com/2020/10/22/java-jit-practice-in-meituan.html
        - paragraph [ref=e680]:
          - strong [ref=e681]: 为什么说 Java 语言“编译与解释并存”？
        - paragraph [ref=e682]:
          - text: 这是因为 Java 语言既具有编译型语言的特征，也具有解释型语言的特征。因为 Java 程序要经过先编译，后解释两个步骤，由 Java 编写的程序需要先经过编译步骤，生成字节码（
          - code [ref=e683]: .class
          - text: 文件），这种字节码必须由 Java 解释器来解释执行。
        - heading [level=3] [ref=e684]:
          - link "AOT 有什么优点？为什么不全部使用 AOT 呢？" [ref=e685] [cursor=pointer]:
            - /url: "#aot-有什么优点-为什么不全部使用-aot-呢"
        - paragraph [ref=e686]:
          - text: JDK 9 引入了一种新的编译模式
          - strong [ref=e687]: AOT(Ahead of Time Compilation)
          - text: 。和 JIT 不同的是，这种编译模式会在程序被执行前就将其编译成机器码，属于静态编译（C、 C++，Rust，Go 等语言就是静态编译）。AOT 避免了 JIT 预热等各方面的开销，可以提高 Java 程序的启动速度，避免预热时间长。并且，AOT 还能减少内存占用和增强 Java 程序的安全性（AOT 编译后的代码不容易被反编译和修改），特别适合云原生场景。
        - paragraph [ref=e688]:
          - strong [ref=e689]: JIT 与 AOT 两者的关键指标对比
          - text: ":"
        - img "JIT vs AOT" [ref=e690]
        - paragraph [ref=e691]: 可以看出，AOT 的主要优势在于启动时间、内存占用和打包体积。JIT 的主要优势在于具备更高的极限处理能力，可以降低请求的最大延迟。
        - paragraph [ref=e692]:
          - text: 提到 AOT 就不得不提
          - link "GraalVM" [ref=e693] [cursor=pointer]:
            - /url: https://www.graalvm.org/
          - text: 了！GraalVM 是一种高性能的 JDK（完整的 JDK 发行版本），它可以运行 Java 和其他 JVM 语言，以及 JavaScript、Python 等非 JVM 语言。 GraalVM 不仅能提供 AOT 编译，还能提供 JIT 编译。感兴趣的同学，可以去看看 GraalVM 的官方文档：
          - link "https://www.graalvm.org/latest/docs/" [ref=e694] [cursor=pointer]:
            - /url: https://www.graalvm.org/latest/docs/
          - text: 。如果觉得官方文档看着比较难理解的话，也可以找一些文章来看看，比如：
        - list [ref=e695]:
          - listitem [ref=e696]:
            - link "基于静态编译构建微服务应用" [ref=e697] [cursor=pointer]:
              - /url: https://mp.weixin.qq.com/s/4haTyXUmh8m-dBQaEzwDJw
          - listitem [ref=e698]:
            - link "走向 Native 化：Spring&Dubbo AOT 技术示例与原理讲解" [ref=e699] [cursor=pointer]:
              - /url: https://cn.dubbo.apache.org/zh-cn/blog/2023/06/28/%e8%b5%b0%e5%90%91-native-%e5%8c%96springdubbo-aot-%e6%8a%80%e6%9c%af%e7%a4%ba%e4%be%8b%e4%b8%8e%e5%8e%9f%e7%90%86%e8%ae%b2%e8%a7%a3/
        - paragraph [ref=e700]:
          - strong [ref=e701]: 既然 AOT 这么多优点，那为什么不全部使用这种编译方式呢？
        - paragraph [ref=e702]:
          - text: 我们前面也对比过 JIT 与 AOT，两者各有优点，只能说 AOT 更适合当下的云原生场景，对微服务架构的支持也比较友好。除此之外，AOT 编译无法支持 Java 的一些动态特性，如反射、动态代理、动态加载、JNI（Java Native Interface）等。然而，很多框架和库（如 Spring、CGLIB）都用到了这些特性。如果只使用 AOT 编译，那就没办法使用这些框架和库了，或者说需要针对性地去做适配和优化。举个例子，CGLIB 动态代理使用的是 ASM 技术，而这种技术大致原理是运行时直接在内存中生成并加载修改后的字节码文件也就是
          - code [ref=e703]: .class
          - text: 文件，如果全部使用 AOT 提前编译，也就不能使用 ASM 技术了。为了支持类似的动态特性，所以选择使用 JIT 即时编译器。
        - heading [level=3] [ref=e704]:
          - link "Oracle JDK vs OpenJDK" [ref=e705] [cursor=pointer]:
            - /url: "#oracle-jdk-vs-openjdk"
        - paragraph [ref=e706]: 可能在看这个问题之前很多人和我一样并没有接触和使用过 OpenJDK 。那么 Oracle JDK 和 OpenJDK 之间是否存在重大差异？下面我通过收集到的一些资料，为你解答这个被很多人忽视的问题。
        - paragraph [ref=e707]: 首先，2006 年 SUN 公司将 Java 开源，也就有了 OpenJDK。2009 年 Oracle 收购了 Sun 公司，于是自己在 OpenJDK 的基础上搞了一个 Oracle JDK。Oracle JDK 是不开源的，并且刚开始的几个版本（Java8 ~ Java11）还会相比于 OpenJDK 添加一些特有的功能和工具。
        - paragraph [ref=e708]: 其次，对于 Java 7 而言，OpenJDK 和 Oracle JDK 是十分接近的。 Oracle JDK 是基于 OpenJDK 7 构建的，只添加了一些小功能，由 Oracle 工程师参与维护。
        - paragraph [ref=e709]: 下面这段话摘自 Oracle 官方在 2012 年发表的一个博客：
        - blockquote [ref=e710]:
          - paragraph [ref=e711]: 问：OpenJDK 存储库中的源代码与用于构建 Oracle JDK 的代码之间有什么区别？
          - paragraph [ref=e712]: 答：非常接近 - 我们的 Oracle JDK 版本构建过程基于 OpenJDK 7 构建，只添加了几个部分，例如部署代码，其中包括 Oracle 的 Java 插件和 Java WebStart 的实现，以及一些闭源的第三方组件，如图形光栅化器，一些开源的第三方组件，如 Rhino，以及一些零碎的东西，如附加文档或第三方字体。展望未来，我们的目的是开源 Oracle JDK 的所有部分，除了我们考虑商业功能的部分。
        - paragraph [ref=e713]: 最后，简单总结一下 Oracle JDK 和 OpenJDK 的区别：
        - list [ref=e714]:
          - listitem [ref=e715]:
            - strong [ref=e716]: 是否开源
            - text: ：OpenJDK 是一个参考模型并且是完全开源的，而 Oracle JDK 是基于 OpenJDK 实现的，并不是完全开源的（个人观点：众所周知，JDK 原来是 SUN 公司开发的，后来 SUN 公司又卖给了 Oracle 公司，Oracle 公司以 Oracle 数据库而著名，而 Oracle 数据库又是闭源的，这个时候 Oracle 公司就不想完全开源了，但是原来的 SUN 公司又把 JDK 给开源了，如果这个时候 Oracle 收购回来之后就把他给闭源，必然会引起很多 Java 开发者的不满，导致大家对 Java 失去信心，那 Oracle 公司收购回来不就把 Java 烂在手里了吗！然后，Oracle 公司就想了个骚操作，这样吧，我把一部分核心代码开源出来给你们玩，并且我要和你们自己搞的 JDK 区分下，你们叫 OpenJDK，我叫 Oracle JDK，我发布我的，你们继续玩你们的，要是你们搞出来什么好玩的东西，我后续发布 Oracle JDK 也会拿来用一下，一举两得！）OpenJDK 开源项目：
            - link "https://github.com/openjdk/jdk" [ref=e717] [cursor=pointer]:
              - /url: https://github.com/openjdk/jdk
            - text: 。
          - listitem [ref=e718]:
            - strong [ref=e719]: 是否免费
            - text: ：Oracle JDK 会提供免费版本，但一般有时间限制。JDK17 之后的版本可以免费分发和商用，但是仅有 3 年时间，3 年后无法免费商用。不过，JDK8u221 之前只要不升级可以无限期免费。OpenJDK 是完全免费的。
          - listitem [ref=e720]:
            - strong [ref=e721]: 功能性
            - text: ：Oracle JDK 在 OpenJDK 的基础上添加了一些特有的功能和工具，比如 Java Flight Recorder（JFR，一种监控工具）、Java Mission Control（JMC，一种监控工具）等工具。不过，在 Java 11 之后，OracleJDK 和 OpenJDK 的功能基本一致，之前 OracleJDK 中的私有组件大多数也已经被捐赠给开源组织。
          - listitem [ref=e722]:
            - strong [ref=e723]: 稳定性
            - text: ：OpenJDK 不提供 LTS 服务，而 OracleJDK 大概每三年都会推出一个 LTS 版进行长期支持。不过，很多公司都基于 OpenJDK 提供了对应的和 OracleJDK 周期相同的 LTS 版。因此，两者稳定性其实也是差不多的。
          - listitem [ref=e724]:
            - strong [ref=e725]: 协议
            - text: ：Oracle JDK 使用 BCL/OTN 协议获得许可，而 OpenJDK 根据 GPL v2 许可获得许可。
        - blockquote [ref=e726]:
          - paragraph [ref=e727]: 既然 Oracle JDK 这么好，那为什么还要有 OpenJDK？
          - paragraph [ref=e728]: 答：
          - list [ref=e729]:
            - listitem [ref=e730]:
              - text: OpenJDK 是开源的，开源意味着你可以对它根据你自己的需要进行修改、优化，比如 Alibaba 基于 OpenJDK 开发了 Dragonwell8：
              - link "https://github.com/alibaba/dragonwell8" [ref=e731] [cursor=pointer]:
                - /url: https://github.com/alibaba/dragonwell8
            - listitem [ref=e732]: OpenJDK 是商业免费的（这也是为什么通过 yum 包管理器上默认安装的 JDK 是 OpenJDK 而不是 Oracle JDK）。虽然 Oracle JDK 也是商业免费（比如 JDK 8），但并不是所有版本都是免费的。
            - listitem [ref=e733]: OpenJDK 更新频率更快。Oracle JDK 一般是每 6 个月发布一个新版本，而 OpenJDK 一般是每 3 个月发布一个新版本。（现在你知道为啥 Oracle JDK 更稳定了吧，先在 OpenJDK 试试水，把大部分问题都解决掉了才在 Oracle JDK 上发布）
          - paragraph [ref=e734]: 基于以上这些原因，OpenJDK 还是有存在的必要的！
        - paragraph [ref=e735]:
          - img "oracle jdk release cadence" [ref=e736]
        - paragraph [ref=e737]:
          - strong [ref=e738]: Oracle JDK 和 OpenJDK 如何选择？
        - paragraph [ref=e739]: 建议选择 OpenJDK 或者基于 OpenJDK 的发行版，比如 AWS 的 Amazon Corretto，阿里巴巴的 Alibaba Dragonwell。
        - paragraph [ref=e740]: 🌈 拓展一下：
        - list [ref=e741]:
          - listitem [ref=e742]: BCL 协议（Oracle Binary Code License Agreement）：可以使用 JDK（支持商用），但是不能进行修改。
          - listitem [ref=e743]: OTN 协议（Oracle Technology Network License Agreement）：11 及之后新发布的 JDK 用的都是这个协议，可以自己私下用，但是商用需要付费。
        - heading [level=2] [ref=e744]:
          - link "基本语法" [ref=e745] [cursor=pointer]:
            - /url: "#基本语法"
        - heading [level=3] [ref=e746]:
          - link "⭐️自增自减运算符" [ref=e747] [cursor=pointer]:
            - /url: "#⭐️自增自减运算符"
        - paragraph [ref=e748]:
          - text: 在写代码的过程中，常见的一种情况是需要某个整数类型变量增加 1 或减少 1。Java 提供了自增运算符 (
          - code [ref=e749]: ++
          - text: ) 和自减运算符 (
          - code [ref=e750]: "--"
          - text: ) 来简化这种操作。
        - paragraph [ref=e751]:
          - code [ref=e752]: ++
          - text: 和
          - code [ref=e753]: "--"
          - text: 运算符可以放在变量之前，也可以放在变量之后：
        - list [ref=e754]:
          - listitem [ref=e755]:
            - strong [ref=e756]: 前缀形式
            - text: （例如
            - code [ref=e757]: ++a
            - text: 或
            - code [ref=e758]: "--a"
            - text: ）：先自增/自减变量的值，然后再使用该变量，例如，
            - code [ref=e759]: b = ++a
            - text: 先将
            - code [ref=e760]: a
            - text: 增加 1，然后把增加后的值赋给
            - code [ref=e761]: b
            - text: 。
          - listitem [ref=e762]:
            - strong [ref=e763]: 后缀形式
            - text: （例如
            - code [ref=e764]: a++
            - text: 或
            - code [ref=e765]: a--
            - text: ）：先使用变量的当前值，然后再自增/自减变量的值。例如，
            - code [ref=e766]: b = a++
            - text: 先将
            - code [ref=e767]: a
            - text: 的当前值赋给
            - code [ref=e768]: b
            - text: ，然后再将
            - code [ref=e769]: a
            - text: 增加 1。
        - paragraph [ref=e770]:
          - text: 为了方便记忆，可以使用下面的口诀：
          - strong [ref=e771]: 符号在前就先加/减，符号在后就后加/减
          - text: 。
        - paragraph [ref=e772]:
          - text: 下面来看一个考察自增自减运算符的高频笔试题：执行下面的代码后，
          - code [ref=e773]: a
          - text: 、
          - code [ref=e774]: b
          - text: 、
          - code [ref=e775]: c
          - text: 、
          - code [ref=e776]: d
          - text: 和
          - code [ref=e777]: e
          - text: 的值是？
        - generic [ref=e778]:
          - text: java
          - button "复制代码" [ref=e779] [cursor=pointer]
          - code [ref=e781]:
            - generic [ref=e782]: int a = 9;
            - generic [ref=e783]: int b = a++;
            - generic [ref=e784]: int c = ++a;
            - generic [ref=e785]: int d = c--;
            - generic [ref=e786]: int e = --d;
        - paragraph [ref=e793]:
          - text: 答案：
          - code [ref=e794]: a = 11
          - text: 、
          - code [ref=e795]: b = 9
          - text: 、
          - code [ref=e796]: c = 10
          - text: 、
          - code [ref=e797]: d = 10
          - text: 、
          - code [ref=e798]: e = 10
          - text: 。
        - heading [level=3] [ref=e799]:
          - link "⭐️移位运算符" [ref=e800] [cursor=pointer]:
            - /url: "#⭐️移位运算符"
        - paragraph [ref=e801]: 移位运算符是最基本的运算符之一，几乎每种编程语言都包含这一运算符。移位操作中，被操作的数据被视为二进制数，移位就是将其向左或向右移动若干位的运算。
        - paragraph [ref=e802]:
          - text: 移位运算符在各种框架以及 JDK 自身的源码中使用还是挺广泛的，
          - code [ref=e803]: HashMap
          - text: （JDK1.8） 中的
          - code [ref=e804]: hash
          - text: 方法的源码就用到了移位运算符：
        - generic [ref=e805]:
          - text: java
          - button "复制代码" [ref=e806] [cursor=pointer]
          - code [ref=e808]:
            - generic [ref=e809]: "static final int hash(Object key) {"
            - generic [ref=e810]: int h;
            - generic [ref=e811]: // key.hashCode()：返回散列值也就是hashcode
            - generic [ref=e812]: // ^：按位异或
            - generic [ref=e813]: // >>>:无符号右移，忽略符号位，空位都以0补齐
            - generic [ref=e814]: "return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);"
            - generic [ref=e815]: "}"
        - paragraph [ref=e824]:
          - strong [ref=e825]: 使用移位运算符的主要原因
          - text: ：
        - list [ref=e826]:
          - listitem [ref=e827]:
            - strong [ref=e828]: 高效
            - text: ：移位运算符直接对应于处理器的移位指令。现代处理器具有专门的硬件指令来执行这些移位操作，这些指令通常在一个时钟周期内完成。相比之下，乘法和除法等算术运算在硬件层面上需要更多的时钟周期来完成。
          - listitem [ref=e829]:
            - strong [ref=e830]: 节省内存
            - text: ：通过移位操作，可以使用一个整数（如
            - code [ref=e831]: int
            - text: 或
            - code [ref=e832]: long
            - text: ）来存储多个布尔值或标志位，从而节省内存。
        - paragraph [ref=e833]: 移位运算符最常用于快速乘以或除以 2 的幂次方。除此之外，它还在以下方面发挥着重要作用：
        - list [ref=e834]:
          - listitem [ref=e835]:
            - strong [ref=e836]: 位字段管理
            - text: ：例如存储和操作多个布尔值。
          - listitem [ref=e837]:
            - strong [ref=e838]: 哈希算法和加密解密
            - text: ：通过移位和与、或等操作来混淆数据。
          - listitem [ref=e839]:
            - strong [ref=e840]: 数据压缩
            - text: ：例如霍夫曼编码通过移位运算符可以快速处理和操作二进制数据，以生成紧凑的压缩格式。
          - listitem [ref=e841]:
            - strong [ref=e842]: 数据校验
            - text: ：例如 CRC（循环冗余校验）通过移位和多项式除法生成和校验数据完整性。
          - listitem [ref=e843]:
            - strong [ref=e844]: 内存对齐
            - text: ：通过移位操作，可以轻松计算和调整数据的对齐地址。
        - paragraph [ref=e845]: 掌握最基本的移位运算符知识还是很有必要的，这不光可以帮助我们在代码中使用，还可以帮助我们理解源码中涉及到移位运算符的代码。
        - paragraph [ref=e846]: Java 中有三种移位运算符：
        - list [ref=e847]:
          - listitem [ref=e848]:
            - code [ref=e849]: <<
            - text: :左移运算符，向左移若干位，高位丢弃，低位补零。
            - code [ref=e850]: x << n
            - text: ",相当于 x 乘以 2 的 n 次方(不溢出的情况下)。"
          - listitem [ref=e851]:
            - code [ref=e852]: ">>"
            - text: :带符号右移，向右移若干位，高位补符号位，低位丢弃。正数高位补 0,负数高位补 1。
            - code [ref=e853]: x >> n
            - text: ",相当于 x 除以 2 的 n 次方。"
          - listitem [ref=e854]:
            - code [ref=e855]: ">>>"
            - text: :无符号右移，忽略符号位，空位都以 0 补齐。
        - paragraph [ref=e856]: 虽然移位运算本质上可以分为左移和右移，但在实际应用中，右移操作需要考虑符号位的处理方式。
        - paragraph [ref=e857]:
          - text: 由于
          - code [ref=e858]: double
          - text: ，
          - code [ref=e859]: float
          - text: 在二进制中的表现比较特殊，因此不能来进行移位操作。
        - paragraph [ref=e860]:
          - text: 移位操作符实际上支持的类型只有
          - code [ref=e861]: int
          - text: 和
          - code [ref=e862]: long
          - text: ，编译器在对
          - code [ref=e863]: short
          - text: 、
          - code [ref=e864]: byte
          - text: 、
          - code [ref=e865]: char
          - text: 类型进行移位前，都会将其转换为
          - code [ref=e866]: int
          - text: 类型再操作。
        - paragraph [ref=e867]:
          - strong [ref=e868]: 如果移位的位数超过数值所占有的位数会怎样？
        - paragraph [ref=e869]: 当 int 类型左移/右移位数大于等于 32 位操作时，会先求余（%）后再进行左移/右移操作。也就是说左移/右移 32 位相当于不进行移位操作（32%32=0），左移/右移 42 位相当于左移/右移 10 位（42%32=10）。当 long 类型进行左移/右移操作时，由于 long 对应的二进制是 64 位，因此求余操作的基数也变成了 64。
        - paragraph [ref=e870]:
          - text: 也就是说：
          - code [ref=e871]: x<<42
          - text: 等同于
          - code [ref=e872]: x<<10
          - text: ，
          - code [ref=e873]: x>>42
          - text: 等同于
          - code [ref=e874]: x>>10
          - text: ，
          - code [ref=e875]: x >>>42
          - text: 等同于
          - code [ref=e876]: x >>> 10
          - text: 。
        - paragraph [ref=e877]:
          - strong [ref=e878]: 左移运算符代码示例
          - text: ：
        - generic [ref=e879]:
          - text: java
          - button "复制代码" [ref=e880] [cursor=pointer]
