        - paragraph [ref=e1554]:
          - strong [ref=e1555]: 1、调用方式
        - paragraph [ref=e1556]:
          - text: 在外部调用静态方法时，可以使用
          - code [ref=e1557]: 类名.方法名
          - text: 的方式，也可以使用
          - code [ref=e1558]: 对象.方法名
          - text: 的方式，而实例方法只有后面这种方式。也就是说，
          - strong [ref=e1559]: 调用静态方法可以无需创建对象
          - text: 。
        - paragraph [ref=e1560]:
          - text: 不过，需要注意的是一般不建议使用
          - code [ref=e1561]: 对象.方法名
          - text: 的方式来调用静态方法。这种方式非常容易造成混淆，静态方法不属于类的某个对象而是属于这个类。
        - paragraph [ref=e1562]:
          - text: 因此，一般建议使用
          - code [ref=e1563]: 类名.方法名
          - text: 的方式来调用静态方法。
