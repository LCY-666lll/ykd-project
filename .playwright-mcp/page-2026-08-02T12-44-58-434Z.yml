            - generic [ref=e3302]: "public static int f(int value) {"
            - generic [ref=e3303]: "try {"
            - generic [ref=e3304]: return value * value;
            - generic [ref=e3305]: "} finally {"
            - generic [ref=e3306]: "if (value == 2) {"
            - generic [ref=e3307]: return 0;
            - generic [ref=e3308]: "}"
