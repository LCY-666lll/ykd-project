          - link "⭐️重载和重写有什么区别？" [ref=e1604] [cursor=pointer]:
            - /url: "#⭐️重载和重写有什么区别"
        - blockquote [ref=e1605]:
          - paragraph [ref=e1606]: 重载就是同样的一个方法能够根据输入数据的不同，做出不同的处理
          - paragraph [ref=e1607]: 重写就是当子类继承自父类的相同方法，输入数据一样，但要做出有别于父类的响应时，你就要覆盖父类方法
        - heading [level=4] [ref=e1608]:
          - link "重载" [ref=e1609] [cursor=pointer]:
            - /url: "#重载"
        - paragraph [ref=e1610]: 发生在同一个类中（或者父类和子类之间），方法名必须相同，参数类型不同、个数不同、顺序不同，方法返回值和访问修饰符可以不同。
        - paragraph [ref=e1611]: 《Java 核心技术》这本书是这样介绍重载的：
        - blockquote [ref=e1612]:
          - paragraph [ref=e1613]:
            - text: 如果多个方法(比如
            - code [ref=e1614]: StringBuilder
            - text: 的构造方法)有相同的名字、不同的参数， 便产生了重载。
          - generic [ref=e1615]:
            - text: java
            - button "复制代码" [ref=e1616] [cursor=pointer]
            - code [ref=e1618]:
              - generic [ref=e1619]: StringBuilder sb = new StringBuilder();
              - generic [ref=e1620]: StringBuilder sb2 = new StringBuilder("HelloWorld");
          - paragraph [ref=e1624]: 编译器必须挑选出具体执行哪个方法，它通过用各个方法给出的参数类型与特定方法调用所使用的值类型进行匹配来挑选出相应的方法。 如果编译器找不到匹配的参数， 就会产生编译时错误， 因为根本不存在匹配， 或者没有一个比其他的更好(这个过程被称为重载解析(overloading resolution))。
          - paragraph [ref=e1625]: Java 允许重载任何方法， 而不只是构造器方法。
        - paragraph [ref=e1626]: 综上：重载就是同一个类中多个同名方法根据不同的传参来执行不同的逻辑处理。
        - heading [level=4] [ref=e1627]:
          - link "重写" [ref=e1628] [cursor=pointer]:
            - /url: "#重写"
        - paragraph [ref=e1629]: 重写发生在运行期，是子类对父类的允许访问的方法的实现过程进行重新编写。
        - list [ref=e1630]:
          - listitem [ref=e1631]: 方法名、参数列表必须相同，子类方法返回值类型应比父类方法返回值类型更小或相等，抛出的异常范围小于等于父类，访问修饰符范围大于等于父类。
          - listitem [ref=e1632]:
            - text: 如果父类方法访问修饰符为
            - code [ref=e1633]: private/final/static
            - text: 则子类就不能重写该方法，但是被
            - code [ref=e1634]: static
            - text: 修饰的方法能够被再次声明。
          - listitem [ref=e1635]: 构造方法无法被重写
        - heading [level=4] [ref=e1636]:
          - link "总结" [ref=e1637] [cursor=pointer]:
            - /url: "#总结"
        - paragraph [ref=e1638]:
          - text: 综上：
          - strong [ref=e1639]: 重写就是子类对父类方法的重新改造，外部样子不能改变，内部逻辑可以改变。
