        - paragraph [ref=e2112]: 关于深拷贝和浅拷贝区别，我这里先给结论：
        - list [ref=e2113]:
          - listitem [ref=e2114]:
            - strong [ref=e2115]: 浅拷贝
            - text: ：浅拷贝会在堆上创建一个新的对象（区别于引用拷贝的一点），不过，如果原对象内部的属性是引用类型的话，浅拷贝会直接复制内部对象的引用地址，也就是说拷贝对象和原对象共用同一个内部对象。
          - listitem [ref=e2116]:
            - strong [ref=e2117]: 深拷贝
            - text: ：深拷贝会完全复制整个对象，包括这个对象所包含的内部对象。
        - paragraph [ref=e2118]: 上面的结论没有完全理解的话也没关系，我们来看一个具体的案例！
