        - paragraph [ref=e3236]: 默认使用 Unchecked Exception，只在必要时才用 Checked Exception。
        - paragraph [ref=e3237]:
          - text: 我们可以把 Unchecked Exception（比如
          - code [ref=e3238]: NullPointerException
          - text: ）看作是代码 Bug。对待 Bug，最好的方式是让它暴露出来然后去修复代码，而不是用
          - code [ref=e3239]: try-catch
          - text: 去掩盖它。
        - paragraph [ref=e3240]: 一般来说，只在一种情况下使用 Checked Exception：当这个异常是业务逻辑的一部分，并且调用方必须处理它时。比如说，一个余额不足异常。这不是 bug，而是一个正常的业务分支，我需要用 Checked Exception 来强制调用者去处理这种情况，比如提示用户去充值。这样就能在保证关键业务逻辑完整性的同时，让代码尽可能保持简洁。
        - heading [level=3] [ref=e3241]:
