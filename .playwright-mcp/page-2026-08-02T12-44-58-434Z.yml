        - paragraph [ref=e1680]:
          - strong [ref=e1681]: 方法的重写要遵循“两同两小一大”
          - text: （以下内容摘录自《疯狂 Java 讲义》，
          - link "issue#892" [ref=e1682] [cursor=pointer]:
