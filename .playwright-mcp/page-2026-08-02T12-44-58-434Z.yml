        - paragraph [ref=e1361]: 浮点数运算精度丢失代码演示：
        - generic [ref=e1362]:
          - text: java
          - button "复制代码" [ref=e1363] [cursor=pointer]
          - code [ref=e1365]:
            - generic [ref=e1366]: float a = 2.0f - 1.9f;
            - generic [ref=e1367]: float b = 1.8f - 1.7f;
            - generic [ref=e1368]: System.out.printf("%.9f",a);// 0.100000024
            - generic [ref=e1369]: System.out.println(b);// 0.099999905
            - generic [ref=e1370]: System.out.println(a == b);// false
        - paragraph [ref=e1377]: 为什么会出现这个问题呢？
        - paragraph [ref=e1378]: 这个和计算机保存浮点数的机制有很大关系。我们知道计算机是二进制的，而且计算机在表示一个数字时，宽度是有限的，无限循环的小数存储在计算机时，只能被截断，所以就会导致小数精度发生损失的情况。这也就是解释了为什么浮点数没有办法用二进制精确表示。
        - paragraph [ref=e1379]: 就比如说十进制下的 0.2 就没办法精确转换成二进制小数：
        - generic [ref=e1380]:
          - text: java
          - button "复制代码" [ref=e1381] [cursor=pointer]
          - code [ref=e1383]:
            - generic [ref=e1384]: // 0.2 转换为二进制数的过程为，不断乘以 2，直到不存在小数为止，
            - generic [ref=e1385]: // 在这个计算过程中，得到的整数部分从上到下排列就是二进制的结果。
            - generic [ref=e1386]: 0.2 * 2 = 0.4 -> 0
