              - text: 来进行捕获
            - text: 不建议通过
            - code [ref=e3192]: catch
            - text: 捕获 。例如 Java 虚拟机运行错误（
            - code [ref=e3193]: Virtual MachineError
            - text: ）、虚拟机内存不够错误(
            - code [ref=e3194]: OutOfMemoryError
            - text: )、类定义错误（
            - code [ref=e3195]: NoClassDefFoundError
            - text: ）等 。这些异常发生时，Java 虚拟机（JVM）一般会选择线程终止。
        - heading [level=3] [ref=e3196]:
          - link "⭐️Checked Exception 和 Unchecked Exception 有什么区别？" [ref=e3197] [cursor=pointer]:
            - /url: "#⭐️checked-exception-和-unchecked-exception-有什么区别"
        - paragraph [ref=e3198]:
          - strong [ref=e3199]: Checked Exception
          - text: 即 受检查异常 ，Java 代码在编译过程中，如果受检查异常没有被
          - code [ref=e3200]: catch
          - text: 或者
