        - paragraph [ref=e2851]:
          - strong [ref=e2852]: 字符串常量池
          - text: 是 JVM 为了提升性能和减少内存消耗针对字符串（String 类）专门开辟的一块区域，主要目的是为了避免字符串的重复创建。
        - generic [ref=e2853]:
          - text: java
          - button "复制代码" [ref=e2854] [cursor=pointer]
          - code [ref=e2856]:
            - generic [ref=e2857]: // 在字符串常量池中创建字符串对象 ”ab“
            - generic [ref=e2858]: // 将字符串对象 ”ab“ 的引用赋值给 aa
            - generic [ref=e2859]: String aa = "ab";
            - generic [ref=e2860]: // 直接返回字符串常量池中字符串对象 ”ab“，赋值给引用 bb
            - generic [ref=e2861]: String bb = "ab";
            - generic [ref=e2862]: System.out.println(aa==bb); // true
        - paragraph [ref=e2870]:
          - text: 更多关于字符串常量池的介绍可以看一下
          - link "Java 内存区域详解" [ref=e2871] [cursor=pointer]:
            - /url: https://javaguide.cn/java/jvm/memory-area.html
          - text: 这篇文章。
        - heading [level=3] [ref=e2872]:
          - link "⭐️String s1 = new String(\"abc\");这句话创建了几个字符串对象？" [ref=e2873] [cursor=pointer]:
            - /url: "#⭐️string-s1-new-string-abc-这句话创建了几个字符串对象"
        - paragraph [ref=e2874]: 先说答案：会创建 1 或 2 个字符串对象。
        - list [ref=e2875]:
          - listitem [ref=e2876]:
            - text: 字符串常量池中不存在 "abc"：会创建 2 个 字符串对象。一个在字符串常量池中，由
            - code [ref=e2877]: ldc
            - text: 指令触发创建。一个在堆中，由
            - code [ref=e2878]: new String()
            - text: 创建，并使用常量池中的 "abc" 进行初始化。
          - listitem [ref=e2879]:
            - text: 字符串常量池中已存在 "abc"：会创建 1 个 字符串对象。该对象在堆中，由
            - code [ref=e2880]: new String()
            - text: 创建，并使用常量池中的 "abc" 进行初始化。
        - paragraph [ref=e2881]: 下面开始详细分析。
        - paragraph [ref=e2882]: 1、如果字符串常量池中不存在字符串对象 “abc”，那么它首先会在字符串常量池中创建字符串对象 "abc"，然后在堆内存中再创建其中一个字符串对象 "abc"。
        - paragraph [ref=e2883]: 示例代码（JDK 1.8）：
        - generic [ref=e2884]:
          - text: java
          - button "复制代码" [ref=e2885] [cursor=pointer]
          - code [ref=e2887]:
            - generic [ref=e2888]: String s1 = new String("abc");
        - paragraph [ref=e2891]: 对应的字节码：
        - generic [ref=e2892]:
          - text: java
          - button "复制代码" [ref=e2893] [cursor=pointer]
          - code [ref=e2895]:
            - generic [ref=e2896]: // 在堆内存中分配一个尚未初始化的 String 对象。
            - generic [ref=e2897]: "// #2 是常量池中的一个符号引用，指向 java/lang/String 类。"
            - generic [ref=e2898]: // 在类加载的解析阶段，这个符号引用会被解析成直接引用，即指向实际的 java/lang/String 类。
            - generic [ref=e2899]: "0 new #2 <java/lang/String>"
            - generic [ref=e2900]: // 复制栈顶的 String 对象引用，为后续的构造函数调用做准备。
            - generic [ref=e2901]: // 此时操作数栈中有两个相同的对象引用：一个用于传递给构造函数，另一个用于保持对新对象的引用，后续将其存储到局部变量表。
            - generic [ref=e2902]: 3 dup
            - generic [ref=e2903]: // JVM 先检查字符串常量池中是否存在 "abc"。
            - generic [ref=e2904]: // 如果常量池中已存在 "abc"，则直接返回该字符串的引用；
            - generic [ref=e2905]: // 如果常量池中不存在 "abc"，则 JVM 会在常量池中创建该字符串字面量并返回它的引用。
            - generic [ref=e2906]: // 这个引用被压入操作数栈，用作构造函数的参数。
            - generic [ref=e2907]: "4 ldc #3 <abc>"
            - generic [ref=e2908]: // 调用构造方法，使用从常量池中加载的 "abc" 初始化堆中的 String 对象
            - generic [ref=e2909]: // 新的 String 对象将包含与常量池中的 "abc" 相同的内容，但它是一个独立的对象，存储于堆中。
            - generic [ref=e2910]: "6 invokespecial #4 <java/lang/String.<init> : (Ljava/lang/String;)V>"
            - generic [ref=e2911]: // 将堆中的 String 对象引用存储到局部变量表
            - generic [ref=e2912]: 9 astore_1
            - generic [ref=e2913]: // 返回，结束方法
            - generic [ref=e2914]: 10 return
        - paragraph [ref=e2935]:
          - code [ref=e2936]: ldc (load constant)
          - text: 指令的确是从常量池中加载各种类型的常量，包括字符串常量、整数常量、浮点数常量，甚至类引用等。对于字符串常量，
          - code [ref=e2937]: ldc
          - text: 指令的行为如下：
        - list [ref=e2938]:
          - listitem [ref=e2939]:
            - strong [ref=e2940]: 从常量池加载字符串
            - text: ：
            - code [ref=e2941]: ldc
            - text: 首先检查字符串常量池中是否已经有内容相同的字符串对象。
          - listitem [ref=e2942]:
            - strong [ref=e2943]: 复用已有字符串对象
            - text: ：如果字符串常量池中已经存在内容相同的字符串对象，
            - code [ref=e2944]: ldc
            - text: 会将该对象的引用加载到操作数栈上。
          - listitem [ref=e2945]:
            - strong [ref=e2946]: 没有则创建新对象并加入常量池
