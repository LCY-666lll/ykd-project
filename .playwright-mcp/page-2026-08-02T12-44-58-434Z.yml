            - text: 来进行捕获。
            - code [ref=e3185]: Exception
            - text: 又可以分为 Checked Exception (受检查异常，必须处理) 和 Unchecked Exception (不受检查异常，可以不处理)。
          - listitem [ref=e3186]:
            - strong [ref=e3187]:
              - code [ref=e3188]: Error
            - text: ：
            - code [ref=e3189]: Error
            - text: 属于程序无法处理的错误 ，
            - generic [ref=e3190]:
              - text: 我们没办法通过
