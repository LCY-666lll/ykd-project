        - list [ref=e3383]:
          - listitem [ref=e3384]: 不要把异常定义为静态变量，因为这样会导致异常栈信息错乱。每次手动抛出异常，我们都需要手动 new 一个异常对象抛出。
          - listitem [ref=e3385]: 抛出的异常信息一定要有意义。
          - listitem [ref=e3386]:
            - text: 建议抛出更加具体的异常，比如字符串转换为数字格式错误的时候应该抛出
            - code [ref=e3387]: NumberFormatException
            - text: 而不是其父类
            - code [ref=e3388]: IllegalArgumentException
            - text: 。
          - listitem [ref=e3389]: 避免重复记录日志：如果在捕获异常的地方已经记录了足够的信息（包括异常类型、错误信息和堆栈跟踪等），那么在业务代码中再次抛出这个异常时，就不应该再次记录相同的错误信息。重复记录日志会使得日志文件膨胀，并且可能会掩盖问题的实际原因，使得问题更难以追踪和解决。
