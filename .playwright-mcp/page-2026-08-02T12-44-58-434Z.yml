        - paragraph [ref=e3081]:
          - strong [ref=e3082]: 对于编译期可以确定值的字符串，也就是常量字符串 ，jvm 会将其存入字符串常量池。并且，字符串常量拼接得到的字符串常量在编译阶段就已经被存放字符串常量池，这个得益于编译器的优化。
        - paragraph [ref=e3083]:
          - text: 在编译过程中，Javac 编译器（下文中统称为编译器）会进行一个叫做
          - strong [ref=e3084]: 常量折叠(Constant Folding)
          - text: 的代码优化。《深入理解 Java 虚拟机》中是也有介绍到：
        - paragraph [ref=e3085]
        - paragraph [ref=e3086]: 常量折叠会把常量表达式的值求出来作为常量嵌在最终生成的代码中，这是 Javac 编译器会对源代码做的极少量优化措施之一(代码优化几乎都在即时编译器中进行)。
        - paragraph [ref=e3087]:
          - text: 对于
          - code [ref=e3088]: String str3 = "str" + "ing";
          - text: 编译器会给你优化成
          - code [ref=e3089]: String str3 = "string";
          - text: 。
        - paragraph [ref=e3090]: 并不是所有的常量都会进行折叠，只有编译器在程序编译期就可以确定值的常量才可以：
