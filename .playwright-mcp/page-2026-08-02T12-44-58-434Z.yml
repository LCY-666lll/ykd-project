        - heading [level=2] [ref=e3562]:
          - link "⭐️反射" [ref=e3563] [cursor=pointer]:
            - /url: "#⭐️反射"
        - paragraph [ref=e3564]:
          - text: 关于反射的详细解读，请看这篇文章
          - link "Java 反射机制详解" [ref=e3565] [cursor=pointer]:
            - /url: https://javaguide.cn/java/basis/reflection.html
          - text: 。
        - heading [level=3] [ref=e3566]:
          - link "什么是反射？" [ref=e3567] [cursor=pointer]:
            - /url: "#什么是反射"
        - paragraph [ref=e3568]:
          - text: 简单来说，Java 反射 (Reflection) 是一种
          - strong [ref=e3569]: 在程序运行时，动态地获取类的信息并操作类或对象（方法、属性）的能力
          - text: 。
        - paragraph [ref=e3570]:
          - text: 通常情况下，我们写的代码在编译时类型就已经确定了，要调用哪个方法、访问哪个字段都是明确的。但反射允许我们在
          - strong [ref=e3571]: 运行时
          - text: 才去探知一个类有哪些方法、哪些属性、它的构造函数是怎样的，甚至可以动态地创建对象、调用方法或修改属性，哪怕这些方法或属性是私有的。
        - paragraph [ref=e3572]:
          - text: 正是这种在运行时“反观自身”并进行操作的能力，使得反射成为许多
          - strong [ref=e3573]: 通用框架和库的基石
          - text: 。它让代码更加灵活，能够处理在编译时未知的类型。
        - heading [level=3] [ref=e3574]:
          - link "反射有什么优缺点？" [ref=e3575] [cursor=pointer]:
            - /url: "#反射有什么优缺点"
        - paragraph [ref=e3576]:
          - strong [ref=e3577]: 优点：
        - list [ref=e3578]:
          - listitem [ref=e3579]:
            - strong [ref=e3580]: 灵活性和动态性
            - text: ：反射允许程序在运行时动态地加载类、创建对象、调用方法和访问字段。这样可以根据实际需求（如配置文件、用户输入、注解等）动态地适应和扩展程序的行为，显著提高了系统的灵活性和适应性。
          - listitem [ref=e3581]:
            - strong [ref=e3582]: 框架开发的基础
            - text: ：许多现代 Java 框架（如 Spring、Hibernate、MyBatis）都大量使用反射来实现依赖注入（DI）、面向切面编程（AOP）、对象关系映射（ORM）、注解处理等核心功能。反射是实现这些“魔法”功能不可或缺的基础工具。
          - listitem [ref=e3583]:
            - strong [ref=e3584]: 解耦合和通用性
            - text: ：通过反射，可以编写更通用、可重用和高度解耦的代码，降低模块之间的依赖。例如，可以通过反射实现通用的对象拷贝、序列化、Bean 工具等。
        - paragraph [ref=e3585]:
          - strong [ref=e3586]: 缺点：
        - list [ref=e3587]:
          - listitem [ref=e3588]:
            - strong [ref=e3589]: 性能开销
            - text: ：反射操作通常比直接代码调用要慢。因为涉及到动态类型解析、方法查找以及 JIT 编译器的优化受限等因素。不过，对于大多数框架场景，这种性能损耗通常是可以接受的，或者框架本身会做一些缓存优化。
          - listitem [ref=e3590]:
            - strong [ref=e3591]: 安全性问题
            - text: ：反射可以绕过 Java 语言的访问控制机制（如访问
            - code [ref=e3592]: private
            - text: 字段和方法），破坏了封装性，可能导致数据泄露或程序被恶意篡改。此外，还可以绕过泛型检查，带来类型安全隐患。
          - listitem [ref=e3593]:
            - strong [ref=e3594]: 代码可读性和维护性
            - text: ：过度使用反射会使代码变得复杂、难以理解和调试。错误通常在运行时才会暴露，不像编译期错误那样容易发现。
        - paragraph [ref=e3595]:
          - text: 相关阅读：
          - 'link "Java Reflection: Why is it so slow?" [ref=e3596] [cursor=pointer]':
            - /url: https://stackoverflow.com/questions/1392351/java-reflection-why-is-it-so-slow
          - text: 。
        - heading [level=3] [ref=e3597]:
          - link "反射的应用场景？" [ref=e3598] [cursor=pointer]:
            - /url: "#反射的应用场景"
        - paragraph [ref=e3599]:
          - text: 我们平时写业务代码可能很少直接跟 Java 的反射（Reflection）打交道。但你可能没意识到，你天天都在享受反射带来的便利！
          - strong [ref=e3600]: 很多流行的框架，比如 Spring/Spring Boot、MyBatis 等，底层都大量运用了反射机制
          - text: ，这才让它们能够那么灵活和强大。
        - paragraph [ref=e3601]: 下面简单列举几个最场景的场景帮助大家理解。
        - paragraph [ref=e3602]:
          - strong [ref=e3603]: 1.依赖注入与控制反转（IoC）
        - paragraph [ref=e3604]:
          - text: 以 Spring/Spring Boot 为代表的 IoC 框架，会在启动时扫描带有特定注解（如
          - code [ref=e3605]: "@Component"
          - text: ","
          - code [ref=e3606]: "@Service"
          - text: ","
          - code [ref=e3607]: "@Repository"
          - text: ","
          - code [ref=e3608]: "@Controller"
          - text: ）的类，利用反射实例化对象（Bean），并通过反射注入依赖（如
          - code [ref=e3609]: "@Autowired"
          - text: 、构造器注入等）。
        - paragraph [ref=e3610]:
          - strong [ref=e3611]: 2.注解处理
        - paragraph [ref=e3612]:
          - text: 注解本身只是个“标记”，得有人去读这个标记才知道要做什么。反射就是那个“读取器”。框架通过反射检查类、方法、字段上有没有特定的注解，然后根据注解信息执行相应的逻辑。比如，看到
          - code [ref=e3613]: "@Value"
          - text: ，就用反射读取注解内容，去配置文件找对应的值，再用反射把值设置给字段。
        - paragraph [ref=e3614]:
          - strong [ref=e3615]: 3.动态代理与 AOP
        - paragraph [ref=e3616]:
          - text: 想在调用某个方法前后自动加点料（比如打日志、开事务、做权限检查）？AOP（面向切面编程）就是干这个的，而动态代理是实现 AOP 的常用手段。JDK 自带的动态代理（Proxy 和 InvocationHandler）就离不开反射。代理对象在内部调用真实对象的方法时，就是通过反射的
          - code [ref=e3617]: Method.invoke
          - text: 来完成的。
        - generic [ref=e3618]:
          - text: java
          - button "复制代码" [ref=e3619] [cursor=pointer]
          - code [ref=e3621]:
            - generic [ref=e3622]: "public class DebugInvocationHandler implements InvocationHandler {"
            - generic [ref=e3623]: private final Object target; // 真实对象
            - generic [ref=e3624]: "public DebugInvocationHandler(Object target) { this.target = target; }"
            - generic [ref=e3625]: "// proxy: 代理对象, method: 被调用的方法, args: 方法参数"
            - generic [ref=e3626]: "public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {"
            - generic [ref=e3627]: System.out.println("切面逻辑：调用方法 " + method.getName() + " 之前");
            - generic [ref=e3628]: // 通过反射调用真实对象的同名方法
            - generic [ref=e3629]: Object result = method.invoke(target, args);
            - generic [ref=e3630]: System.out.println("切面逻辑：调用方法 " + method.getName() + " 之后");
            - generic [ref=e3631]: return result;
            - generic [ref=e3632]: "}"
            - generic [ref=e3633]: "}"
        - paragraph [ref=e3649]:
          - strong [ref=e3650]: 4.对象关系映射（ORM）
        - paragraph [ref=e3651]: 像 MyBatis、Hibernate 这种框架，能帮你把数据库查出来的一行行数据，自动变成一个个 Java 对象。它是怎么知道数据库字段对应哪个 Java 属性的？还是靠反射。它通过反射获取 Java 类的属性列表，然后把查询结果按名字或配置对应起来，再用反射调用 setter 或直接修改字段值。反过来，保存对象到数据库时，也是用反射读取属性值来拼 SQL。
        - heading [level=2] [ref=e3652]:
          - link "代理" [ref=e3653] [cursor=pointer]:
            - /url: "#代理"
        - paragraph [ref=e3654]:
          - text: 关于 Java 代理的详细介绍，可以看看笔者写的
          - link "Java 代理模式详解" [ref=e3655] [cursor=pointer]:
            - /url: https://javaguide.cn/java/basis/proxy.html
          - text: 这篇文章。
        - heading [level=3] [ref=e3656]:
          - link "如何实现动态代理？" [ref=e3657] [cursor=pointer]:
            - /url: "#如何实现动态代理"
        - paragraph [ref=e3658]:
          - text: 动态代理是一种非常强大的设计模式，它允许我们在
          - strong [ref=e3659]: 不修改源代码
          - text: 的情况下，对一个类或对象的方法进行
          - strong [ref=e3660]: 功能增强（Enhancement）
          - text: 。
        - paragraph [ref=e3661]:
          - text: 在 Java 中，实现动态代理最主流的方式有两种：
          - strong [ref=e3662]: JDK 动态代理
          - text: 和
          - strong [ref=e3663]: CGLIB 动态代理
          - text: 。
        - paragraph [ref=e3664]:
          - strong [ref=e3665]: 第一种：JDK 动态代理
        - paragraph [ref=e3666]:
          - text: Java 官方提供的，其核心要求是目标类必须实现一个或多个接口。JDK 动态代理在运行时，会利用
          - code [ref=e3667]: Proxy.newProxyInstance()
          - text: 方法，动态地创建一个实现了这些接口的代理类的实例。这个代理类在内存中生成，你看不到它的
          - code [ref=e3668]: .java
          - text: 或
          - code [ref=e3669]: .class
          - text: 文件。
        - paragraph [ref=e3670]:
          - text: 当你调用代理对象的任何一个方法时，这个调用都会被转发到我们提供的一个
          - code [ref=e3671]: InvocationHandler
          - text: 接口的
          - code [ref=e3672]: invoke
          - text: 方法中。在
          - code [ref=e3673]: invoke
          - text: 方法里，我们就可以在调用原始方法（目标方法）之前或之后，加入我们自己的增强逻辑。
        - paragraph [ref=e3674]:
          - strong [ref=e3675]: 第二种：CGLIB 动态代理
        - paragraph [ref=e3676]:
          - text: CGLIB 是一个第三方的代码生成库。它的原理与 JDK 完全不同，它不要求被代理的类实现接口。它在运行时，动态生成目标类的子类作为代理类（通过 ASM 字节码操作技术）。然后，它会重写父类（也就是被代理类）中所有非
          - code [ref=e3677]: final
          - text: 、
          - code [ref=e3678]: private
          - text: 和
          - code [ref=e3679]: static
          - text: 的方法。
        - paragraph [ref=e3680]:
          - text: 当你调用代理对象的任何一个方法时，这个调用会被 CGLIB 的
          - code [ref=e3681]: MethodInterceptor
          - text: 接口的
          - code [ref=e3682]: intercept
          - text: 方法拦截。和
          - code [ref=e3683]: InvocationHandler
          - text: 的
          - code [ref=e3684]: invoke
          - text: 方法一样，我们可以在
          - code [ref=e3685]: intercept
          - text: 方法里，在调用原始的父类方法之前或之后，加入我们的增强逻辑。
        - heading [level=3] [ref=e3686]:
          - link "静态代理和动态代理有什么区别？" [ref=e3687] [cursor=pointer]:
            - /url: "#静态代理和动态代理有什么区别"
        - paragraph [ref=e3688]:
          - text: 静态代理和动态代理的核心差异在于
          - strong [ref=e3689]: 代理关系的确定时机、实现灵活性及维护成本
          - text: 。
        - table [ref=e3690]:
          - rowgroup [ref=e3691]:
            - row [ref=e3692]:
              - columnheader "对比维度" [ref=e3693]
              - columnheader "静态代理 (Static Proxy)" [ref=e3694]
              - columnheader "动态代理 (Dynamic Proxy)" [ref=e3695]
          - rowgroup [ref=e3696]:
            - row [ref=e3697]:
              - cell "代理关系确定时机" [ref=e3698]
              - cell [ref=e3699]:
                - text: 编译期（编译后生成固定的
                - code [ref=e3700]: .class
                - text: 字节码文件）
              - cell "运行时（动态生成代理类字节码并加载到 JVM）" [ref=e3701]
            - row [ref=e3702]:
              - cell "实现方式" [ref=e3703]
              - cell "手动编写代理类，需与目标类实现同一接口，一对一绑定" [ref=e3704]
              - cell [ref=e3705]:
                - text: 无需手动编写代理类，通过
                - code [ref=e3706]: Handler
                - text: /
                - code [ref=e3707]: Interceptor
                - text: 封装增强逻辑，一对多复用
            - row [ref=e3708]:
              - cell "接口依赖" [ref=e3709]
              - cell "必须实现接口（代理类与目标类遵循同一接口规范）" [ref=e3710]
              - cell "支持代理接口或直接代理实现类" [ref=e3711]
            - row [ref=e3712]:
              - cell "代码量与维护性" [ref=e3713]
              - cell "代码量大（目标类越多，代理类越多），维护成本高；接口新增方法时，目标类与代理类需同步修改" [ref=e3714]
              - cell "代码量极少（通用增强逻辑可复用），维护性好；与接口解耦，接口变更不影响代理逻辑" [ref=e3715]
            - row [ref=e3716]:
              - cell "核心优势" [ref=e3717]
              - cell "实现简单、逻辑直观，无额外框架依赖" [ref=e3718]
              - cell "灵活性强、复用性高，降低重复编码，适配复杂场景" [ref=e3719]
            - row [ref=e3720]:
              - cell "典型应用场景" [ref=e3721]
              - cell "简单的装饰器模式、少量固定类的增强需求" [ref=e3722]
              - cell "Spring AOP、RPC 框架（如 Dubbo）、ORM 框架" [ref=e3723]
        - heading [level=3] [ref=e3724]:
          - link "⭐️JDK 动态代理和 CGLIB 动态代理有什么区别？" [ref=e3725] [cursor=pointer]:
            - /url: "#⭐️jdk-动态代理和-cglib-动态代理有什么区别"
        - list [ref=e3726]:
          - listitem [ref=e3727]:
            - text: JDK 动态代理是官方的，它要求被代理的类必须实现接口。它的原理是动态生成一个接口的实现类来作为代理。CGLIB 是第三方的，它不需要接口。它的原理是动态生成一个被代理类的子类来作为代理。但也正因为是继承，所以它不能代理
            - code [ref=e3728]: final
            - text: 的类，被代理的方法也不能是
            - code [ref=e3729]: final
            - text: 或
            - code [ref=e3730]: private
            - text: 。
          - listitem [ref=e3731]: 就二者的效率来说，大部分情况都是 JDK 动态代理更优秀，随着 JDK 版本的升级，这个优势更加明显。
        - heading [level=3] [ref=e3732]:
          - link "⭐️介绍一下动态代理在框架中的实际应用场景" [ref=e3733] [cursor=pointer]:
            - /url: "#⭐️介绍一下动态代理在框架中的实际应用场景"
        - paragraph [ref=e3734]:
          - text: 动态代理最典型的应用场景就是
          - strong [ref=e3735]: Spring AOP
          - text: 。
        - paragraph [ref=e3736]: AOP(Aspect-Oriented Programming:面向切面编程)能够将那些与业务无关，却为业务模块所共同调用的逻辑或责任（例如事务处理、日志管理、权限控制等）封装起来，便于减少系统的重复代码，降低模块间的耦合度，并有利于未来的可拓展性和可维护性。
        - paragraph [ref=e3737]:
          - text: Spring AOP 就是基于动态代理的，如果要代理的对象，实现了某个接口，那么 Spring AOP 会使用
          - strong [ref=e3738]: JDK Proxy
          - text: ，去创建代理对象，而对于没有实现接口的对象，就无法使用 JDK Proxy 去进行代理了，这时候 Spring AOP 会使用
          - strong [ref=e3739]: Cglib
          - text: 生成一个被代理对象的子类来作为代理，如下图所示：
        - paragraph [ref=e3740]:
          - img "SpringAOPProcess" [ref=e3741]
        - heading [level=2] [ref=e3742]:
          - link "注解" [ref=e3743] [cursor=pointer]:
            - /url: "#注解"
        - heading [level=3] [ref=e3744]:
          - link "何谓注解？" [ref=e3745] [cursor=pointer]:
            - /url: "#何谓注解"
        - paragraph [ref=e3746]:
          - code [ref=e3747]: Annotation
          - text: （注解） 是 Java5 开始引入的新特性，可以看作是一种特殊的注释，主要用于修饰类、方法或者变量，提供某些信息供程序在编译或者运行时使用。
        - paragraph [ref=e3748]:
          - text: 注解本质是一个继承了
          - code [ref=e3749]: Annotation
          - text: 的特殊接口：
        - generic [ref=e3750]:
          - text: java
          - button "复制代码" [ref=e3751] [cursor=pointer]
          - code [ref=e3753]:
            - generic [ref=e3754]: "@Target(ElementType.METHOD)"
            - generic [ref=e3755]: "@Retention(RetentionPolicy.SOURCE)"
            - generic [ref=e3756]: "public @interface Override {"
            - generic [ref=e3757]: "}"
            - generic [ref=e3758]: "public interface Override extends Annotation{"
            - generic [ref=e3759]: "}"
        - paragraph [ref=e3770]:
          - text: JDK 提供了很多内置的注解（比如
          - code [ref=e3771]: "@Override"
          - text: 、
          - code [ref=e3772]: "@Deprecated"
          - text: ），同时，我们还可以自定义注解。
        - heading [level=3] [ref=e3773]:
          - link "注解的解析方法有哪几种？" [ref=e3774] [cursor=pointer]:
            - /url: "#注解的解析方法有哪几种"
        - paragraph [ref=e3775]: 注解只有被解析之后才会生效，常见的解析方法有两种：
        - list [ref=e3776]:
          - listitem [ref=e3777]:
            - strong [ref=e3778]: 编译期直接扫描
            - text: ：编译器在编译 Java 代码的时候扫描对应的注解并处理，比如某个方法使用
            - code [ref=e3779]: "@Override"
            - text: 注解，编译器在编译的时候就会检测当前的方法是否重写了父类对应的方法。
          - listitem [ref=e3780]:
            - strong [ref=e3781]: 运行期通过反射处理
            - text: ：像框架中自带的注解(比如 Spring 框架的
            - code [ref=e3782]: "@Value"
            - text: 、
            - code [ref=e3783]: "@Component"
            - text: )都是通过反射来进行处理的。
        - heading [level=2] [ref=e3784]:
          - link "⭐️SPI" [ref=e3785] [cursor=pointer]:
            - /url: "#⭐️spi"
        - paragraph [ref=e3786]:
          - text: 关于 SPI 的详细解读，请看这篇文章
          - link "Java SPI 机制详解" [ref=e3787] [cursor=pointer]:
            - /url: https://javaguide.cn/java/basis/spi.html
          - text: 。
        - heading [level=3] [ref=e3788]:
          - link "何谓 SPI?" [ref=e3789] [cursor=pointer]:
            - /url: "#何谓-spi"
        - paragraph [ref=e3790]: SPI 即 Service Provider Interface ，字面意思就是：“服务提供者的接口”，我的理解是：专门提供给服务提供者或者扩展框架功能的开发者去使用的一个接口。
        - paragraph [ref=e3791]: SPI 将服务接口和具体的服务实现分离开来，将服务调用方和服务实现者解耦，能够提升程序的扩展性、可维护性。修改或者替换服务实现并不需要修改调用方。
        - paragraph [ref=e3792]: 很多框架都使用了 Java 的 SPI 机制，比如：Spring 框架、数据库加载驱动、日志接口、以及 Dubbo 的扩展实现等等。
        - heading [level=3] [ref=e3794]:
          - link "SPI 和 API 有什么区别？" [ref=e3795] [cursor=pointer]:
            - /url: "#spi-和-api-有什么区别"
        - paragraph [ref=e3796]:
          - strong [ref=e3797]: 那 SPI 和 API 有啥区别？
        - paragraph [ref=e3798]: 说到 SPI 就不得不说一下 API（Application Programming Interface） 了，从广义上来说它们都属于接口，而且很容易混淆。下面先用一张图说明一下：
        - paragraph [ref=e3799]:
          - img "SPI VS API" [ref=e3800]
        - paragraph [ref=e3801]: 一般模块之间都是通过接口进行通讯，因此我们在服务调用方和服务实现方（也称服务提供者）之间引入一个“接口”。
        - list [ref=e3802]:
          - listitem [ref=e3803]:
            - text: 当实现方提供了接口和实现，我们可以通过调用实现方的接口从而拥有实现方给我们提供的能力，这就是
            - strong [ref=e3804]: API
            - text: 。这种情况下，接口和实现都是放在实现方的包中。调用方通过接口调用实现方的功能，而不需要关心具体的实现细节。
          - listitem [ref=e3805]:
            - text: 当接口存在于调用方这边时，这就是
            - strong [ref=e3806]: SPI
            - text: 。由接口调用方确定接口规则，然后由不同的厂商根据这个规则对这个接口进行实现，从而提供服务。
        - paragraph [ref=e3807]: 举个通俗易懂的例子：公司 H 是一家科技公司，新设计了一款芯片，然后现在需要量产了，而市面上有好几家芯片制造业公司，这个时候，只要 H 公司指定好了这芯片生产的标准（定义好了接口标准），那么这些合作的芯片公司（服务提供者）就按照标准交付自家特色的芯片（提供不同方案的实现，但是给出来的结果是一样的）。
        - heading [level=3] [ref=e3808]:
          - link "SPI 的优缺点？" [ref=e3809] [cursor=pointer]:
            - /url: "#spi-的优缺点"
        - paragraph [ref=e3810]: 通过 SPI 机制能够大大地提高接口设计的灵活性，但是 SPI 机制也存在一些缺点，比如：
        - list [ref=e3811]:
          - listitem [ref=e3812]: 需要遍历加载所有的实现类，不能做到按需加载，这样效率还是相对较低的。
          - listitem [ref=e3813]:
            - text: 当多个
            - code [ref=e3814]: ServiceLoader
            - text: 同时
            - code [ref=e3815]: load
            - text: 时，会有并发问题。
        - heading [level=2] [ref=e3816]:
          - link "⭐️序列化和反序列化" [ref=e3817] [cursor=pointer]:
            - /url: "#⭐️序列化和反序列化"
        - paragraph [ref=e3818]:
          - text: 关于序列化和反序列化的详细解读，请看这篇文章
          - link "Java 序列化详解" [ref=e3819] [cursor=pointer]:
            - /url: https://javaguide.cn/java/basis/serialization.html
          - text: ，里面涉及到的知识点和面试题更全面。
        - heading [level=3] [ref=e3820]:
          - link "什么是序列化?什么是反序列化?" [ref=e3821] [cursor=pointer]:
            - /url: "#什么是序列化-什么是反序列化"
        - paragraph [ref=e3822]: 如果我们需要持久化 Java 对象比如将 Java 对象保存在文件中，或者在网络传输 Java 对象，这些场景都需要用到序列化。
        - paragraph [ref=e3823]: 简单来说：
        - list [ref=e3824]:
          - listitem [ref=e3825]:
            - strong [ref=e3826]: 序列化
            - text: ：将数据结构或对象转换成可以存储或传输的形式，通常是二进制字节流，也可以是 JSON, XML 等文本格式
          - listitem [ref=e3827]:
            - strong [ref=e3828]: 反序列化
            - text: ：将在序列化过程中所生成的数据转换为原始数据结构或者对象的过程
        - paragraph [ref=e3829]: 对于 Java 这种面向对象编程语言来说，我们序列化的都是对象（Object）也就是实例化后的类(Class)，但是在 C++这种半面向对象的语言中，struct(结构体)定义的是数据结构类型，而 class 对应的是对象类型。
        - paragraph [ref=e3830]: 下面是序列化和反序列化常见应用场景：
        - list [ref=e3831]:
          - listitem [ref=e3832]: 对象在进行网络传输（比如远程方法调用 RPC 的时候）之前需要先被序列化，接收到序列化的对象之后需要再进行反序列化；
          - listitem [ref=e3833]: 将对象存储到文件之前需要进行序列化，将对象从文件中读取出来需要进行反序列化；
          - listitem [ref=e3834]: 将对象存储到数据库（如 Redis）之前需要用到序列化，将对象从缓存数据库中读取出来需要反序列化；
          - listitem [ref=e3835]: 将对象存储到内存之前需要进行序列化，从内存中读取出来之后需要进行反序列化。
        - paragraph [ref=e3836]: 维基百科是如是介绍序列化的：
        - blockquote [ref=e3837]:
          - paragraph [ref=e3838]:
            - strong [ref=e3839]: 序列化
            - text: （serialization）在计算机科学的数据处理中，是指将数据结构或对象状态转换成可取用格式（例如存成文件，存于缓冲，或经由网络中发送），以留待后续在相同或另一台计算机环境中，能恢复原先状态的过程。依照序列化格式重新获取字节的结果时，可以利用它来产生与原始对象相同语义的副本。对于许多对象，像是使用大量引用的复杂对象，这种序列化重建的过程并不容易。面向对象中的对象序列化，并不概括之前原始对象所关系的函数。这种过程也称为对象编组（marshalling）。从一系列字节提取数据结构的反向操作，是反序列化（也称为解编组、deserialization、unmarshalling）。
        - paragraph [ref=e3840]:
          - text: 综上：
          - strong [ref=e3841]: 序列化的主要目的是通过网络传输对象或者说是将对象存储到文件系统、数据库、内存中。
        - paragraph [ref=e3842]
        - paragraph [ref=e3843]: https://www.corejavaguru.com/java/serialization/interview-questions-1
        - paragraph [ref=e3844]:
          - strong [ref=e3845]: 序列化协议对应于 TCP/IP 4 层模型的哪一层？
        - paragraph [ref=e3846]: 我们知道网络通信的双方必须要采用和遵守相同的协议。TCP/IP 四层模型是下面这样的，序列化协议属于哪一层呢？
        - list [ref=e3847]:
          - listitem [ref=e3848]: 应用层
          - listitem [ref=e3849]: 传输层
          - listitem [ref=e3850]: 网络层
          - listitem [ref=e3851]: 网络接口层
        - paragraph [ref=e3852]:
          - img "TCP/IP 四层模型" [ref=e3853]
        - paragraph [ref=e3854]: 如上图所示，OSI 七层协议模型中，表示层做的事情主要就是对应用层的用户数据进行处理转换为二进制流。反过来的话，就是将二进制流转换成应用层的用户数据。这不就对应的是序列化和反序列化么？
        - paragraph [ref=e3855]: 因为，OSI 七层协议模型中的应用层、表示层和会话层对应的都是 TCP/IP 四层模型中的应用层，所以序列化协议属于 TCP/IP 协议应用层的一部分。
        - heading [level=3] [ref=e3856]:
          - link "如果有些字段不想进行序列化怎么办？" [ref=e3857] [cursor=pointer]:
            - /url: "#如果有些字段不想进行序列化怎么办"
        - paragraph [ref=e3858]:
          - text: 对于不想进行序列化的变量，使用
          - code [ref=e3859]: transient
          - text: 关键字修饰。
        - paragraph [ref=e3860]:
          - code [ref=e3861]: transient
          - text: 关键字的作用是：阻止实例中那些用此关键字修饰的的变量序列化；当对象被反序列化时，被
          - code [ref=e3862]: transient
          - text: 修饰的变量值不会被持久化和恢复。
        - paragraph [ref=e3863]:
          - text: 关于
          - code [ref=e3864]: transient
          - text: 还有几点注意：
        - list [ref=e3865]:
          - listitem [ref=e3866]:
            - code [ref=e3867]: transient
            - text: 只能修饰变量，不能修饰类和方法。
          - listitem [ref=e3868]:
            - code [ref=e3869]: transient
            - text: 修饰的变量，在反序列化后变量值将会被置成类型的默认值。例如，如果是修饰
            - code [ref=e3870]: int
            - text: 类型，那么反序列后结果就是
            - code [ref=e3871]: "0"
            - text: 。
          - listitem [ref=e3872]:
            - code [ref=e3873]: static
            - text: 变量因为不属于任何对象(Object)，所以无论有没有
            - code [ref=e3874]: transient
            - text: 关键字修饰，均不会被序列化。
        - heading [level=3] [ref=e3875]:
          - link "常见序列化协议有哪些？" [ref=e3876] [cursor=pointer]:
            - /url: "#常见序列化协议有哪些"
        - paragraph [ref=e3877]: JDK 自带的序列化方式一般不会用 ，因为序列化效率低并且存在安全问题。比较常用的序列化协议有 Hessian、Kryo、Protobuf、ProtoStuff，这些都是基于二进制的序列化协议。
        - paragraph [ref=e3878]: 像 JSON 和 XML 这种属于文本类序列化方式。虽然可读性比较好，但是性能较差，一般不会选择。
        - heading [level=3] [ref=e3879]:
          - link "为什么不推荐使用 JDK 自带的序列化？" [ref=e3880] [cursor=pointer]:
            - /url: "#为什么不推荐使用-jdk-自带的序列化"
        - paragraph [ref=e3881]: 我们很少或者说几乎不会直接使用 JDK 自带的序列化方式，主要原因有下面这些原因：
        - list [ref=e3882]:
          - listitem [ref=e3883]:
            - strong [ref=e3884]: 不支持跨语言调用
            - text: ": 如果调用的是其他语言开发的服务的时候就不支持了。"
          - listitem [ref=e3885]:
            - strong [ref=e3886]: 性能差
            - text: ：相比于其他序列化框架性能更低，主要原因是序列化之后的字节数组体积较大，导致传输成本加大。
          - listitem [ref=e3887]:
            - strong [ref=e3888]: 存在安全问题
            - text: ：序列化和反序列化本身并不存在问题。但当输入的反序列化的数据可被用户控制，那么攻击者即可通过构造恶意输入，让反序列化产生非预期的对象，在此过程中执行构造的任意代码。相关阅读：
            - link "应用安全：JAVA 反序列化漏洞之殇" [ref=e3889] [cursor=pointer]:
              - /url: https://cryin.github.io/blog/secure-development-java-deserialization-vulnerability/
            - text: 。
        - heading [level=2] [ref=e3890]:
          - link "I/O" [ref=e3891] [cursor=pointer]:
            - /url: "#i-o"
        - heading [level=3] [ref=e3892]:
          - link "Java IO 流了解吗？" [ref=e3893] [cursor=pointer]:
            - /url: "#java-io-流了解吗"
        - paragraph [ref=e3894]:
          - text: IO 即
          - code [ref=e3895]: Input/Output
          - text: ，输入和输出。数据输入到计算机内存的过程即输入，反之输出到外部存储（比如数据库，文件，远程主机）的过程即输出。数据传输过程类似于水流，因此称为 IO 流。IO 流在 Java 中分为输入流和输出流，而根据数据的处理方式又分为字节流和字符流。
        - paragraph [ref=e3896]: Java IO 流的 40 多个类都是从如下 4 个抽象类基类中派生出来的。
        - list [ref=e3897]:
          - listitem [ref=e3898]:
            - code [ref=e3899]: InputStream
            - text: /
            - code [ref=e3900]: Reader
            - text: ": 所有的输入流的基类，前者是字节输入流，后者是字符输入流。"
          - listitem [ref=e3901]:
            - code [ref=e3902]: OutputStream
            - text: /
            - code [ref=e3903]: Writer
            - text: ": 所有输出流的基类，前者是字节输出流，后者是字符输出流。"
        - heading [level=3] [ref=e3904]:
          - link "I/O 流为什么要分为字节流和字符流呢?" [ref=e3905] [cursor=pointer]:
            - /url: "#i-o-流为什么要分为字节流和字符流呢"
        - paragraph [ref=e3906]:
          - text: 问题本质想问：
          - strong [ref=e3907]: 不管是文件读写还是网络发送接收，信息的最小存储单元都是字节，那为什么 I/O 流操作要分为字节流操作和字符流操作呢？
        - paragraph [ref=e3908]: 个人认为主要有两点原因：
        - list [ref=e3909]:
          - listitem [ref=e3910]: 字符流是由 Java 虚拟机将字节转换得到的，这个过程还算是比较耗时；
          - listitem [ref=e3911]: 如果我们不知道编码类型的话，使用字节流的过程中很容易出现乱码问题。
        - heading [level=3] [ref=e3912]:
          - link "Java IO 中的设计模式有哪些？" [ref=e3913] [cursor=pointer]:
            - /url: "#java-io-中的设计模式有哪些"
        - paragraph [ref=e3914]:
          - text: 参考答案：
          - link "Java IO 设计模式总结" [ref=e3915] [cursor=pointer]:
            - /url: https://javaguide.cn/java/io/io-design-patterns.html
        - heading [level=3] [ref=e3916]:
          - link "⭐️BIO、NIO 和 AIO 的区别？" [ref=e3917] [cursor=pointer]:
            - /url: "#⭐️bio、nio-和-aio-的区别"
        - paragraph [ref=e3918]:
          - text: 参考答案：
          - link "Java IO 模型详解" [ref=e3919] [cursor=pointer]:
            - /url: https://javaguide.cn/java/io/io-model.html
