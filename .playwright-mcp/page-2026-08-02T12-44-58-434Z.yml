            - generic [ref=e2511]: public native int hashCode();
        - paragraph [ref=e2514]:
          - text: 散列表存储的是键值对(key-value)，它的特点是：
          - strong [ref=e2515]: 能根据“键”快速的检索出对应的“值”。这其中就利用到了散列码！（可以快速找到所需要的对象）
        - heading [level=3] [ref=e2516]:
          - link "为什么要有 hashCode？" [ref=e2517] [cursor=pointer]:
            - /url: "#为什么要有-hashcode"
        - paragraph [ref=e2518]:
          - text: 我们以“
          - code [ref=e2519]: HashSet
          - text: 如何检查重复”为例子来说明为什么要有
          - code [ref=e2520]: hashCode
          - text: ？
        - paragraph [ref=e2521]: "下面这段内容摘自我的 Java 启蒙书《Head First Java》:"
        - blockquote [ref=e2522]:
          - paragraph [ref=e2523]:
            - text: 当你把对象加入
            - code [ref=e2524]: HashSet
            - text: 时，
            - code [ref=e2525]: HashSet
            - text: 会先计算对象的
            - code [ref=e2526]: hashCode
            - text: 值来判断对象加入的位置，同时也会与其他已经加入的对象的
            - code [ref=e2527]: hashCode
            - text: 值作比较，如果没有相符的
            - code [ref=e2528]: hashCode
            - text: ，
            - code [ref=e2529]: HashSet
            - text: 会假设对象没有重复出现。但是如果发现有相同
            - code [ref=e2530]: hashCode
            - text: 值的对象，这时会调用
            - code [ref=e2531]: equals()
            - text: 方法来检查
            - code [ref=e2532]: hashCode
            - text: 相等的对象是否真的相同。如果两者相同，
            - code [ref=e2533]: HashSet
            - text: 就不会让其加入操作成功。如果不同的话，就会重新散列到其他位置。这样我们就大大减少了
            - code [ref=e2534]: equals
            - text: 的次数，相应就大大提高了执行速度。
        - paragraph [ref=e2535]:
          - text: 其实，
          - code [ref=e2536]: hashCode()
          - text: 和
          - code [ref=e2537]: equals()
          - text: 都是用于比较两个对象是否相等。
        - paragraph [ref=e2538]:
          - strong [ref=e2539]: 那为什么 JDK 还要同时提供这两个方法呢？
        - paragraph [ref=e2540]:
          - text: 这是因为在一些容器（比如
          - code [ref=e2541]: HashMap
          - text: 、
          - code [ref=e2542]: HashSet
          - text: ）中，有了
          - code [ref=e2543]: hashCode()
          - text: 之后，判断元素是否在对应容器中的效率会更高（参考添加元素进
          - code [ref=e2544]: HashSet
          - text: 的过程）！
        - paragraph [ref=e2545]:
          - text: 我们在前面也提到了添加元素进
          - code [ref=e2546]: HashSet
          - text: 的过程，如果
          - code [ref=e2547]: HashSet
          - text: 在对比的时候，同样的
          - code [ref=e2548]: hashCode
          - text: 有多个对象，它会继续使用
          - code [ref=e2549]: equals()
          - text: 来判断是否真的相同。也就是说
          - code [ref=e2550]: hashCode
          - text: 帮助我们大大缩小了查找成本。
        - paragraph [ref=e2551]:
          - strong [ref=e2552]:
            - text: 那为什么不只提供
            - code [ref=e2553]: hashCode()
            - text: 方法呢？
        - paragraph [ref=e2554]:
          - text: 这是因为两个对象的
          - code [ref=e2555]: hashCode
          - text: 值相等并不代表两个对象就相等。
        - paragraph [ref=e2556]:
          - strong [ref=e2557]:
            - text: 那为什么两个对象有相同的
            - code [ref=e2558]: hashCode
            - text: 值，它们也不一定是相等的？
        - paragraph [ref=e2559]:
          - text: 因为
          - code [ref=e2560]: hashCode()
          - text: 所使用的哈希算法也许刚好会让多个对象传回相同的哈希值。越糟糕的哈希算法越容易碰撞，但这也与数据值域分布的特性有关（所谓哈希碰撞也就是指的是不同的对象得到相同的
          - code [ref=e2561]: hashCode
          - text: )。
        - paragraph [ref=e2562]: 总结下来就是：
        - list [ref=e2563]:
          - listitem [ref=e2564]:
            - text: 如果两个对象的
            - code [ref=e2565]: hashCode
            - text: 值相等，那这两个对象不一定相等（哈希碰撞）。
          - listitem [ref=e2566]:
            - text: 如果两个对象的
            - code [ref=e2567]: hashCode
            - text: 值相等并且
            - code [ref=e2568]: equals()
            - text: 方法也返回
            - code [ref=e2569]: "true"
            - text: ，我们才认为这两个对象相等。
          - listitem [ref=e2570]:
            - text: 如果两个对象的
            - code [ref=e2571]: hashCode
            - text: 值不相等，我们就可以直接认为这两个对象不相等。
        - paragraph [ref=e2572]:
          - text: 相信大家看了我前面对
          - code [ref=e2573]: hashCode()
          - text: 和
          - code [ref=e2574]: equals()
          - text: 的介绍之后，下面这个问题已经难不倒你们了。
        - heading [level=3] [ref=e2575]:
          - link "为什么重写 equals() 时必须重写 hashCode() 方法？" [ref=e2576] [cursor=pointer]:
            - /url: "#为什么重写-equals-时必须重写-hashcode-方法"
        - paragraph [ref=e2577]:
          - text: 因为两个相等的对象的
          - code [ref=e2578]: hashCode
          - text: 值必须是相等。也就是说如果
          - code [ref=e2579]: equals
          - text: 方法判断两个对象是相等的，那这两个对象的
          - code [ref=e2580]: hashCode
          - text: 值也要相等。
        - paragraph [ref=e2581]:
          - text: 如果重写
          - code [ref=e2582]: equals()
          - text: 时没有重写
          - code [ref=e2583]: hashCode()
          - text: 方法的话就可能会导致
          - code [ref=e2584]: equals
          - text: 方法判断是相等的两个对象，
          - code [ref=e2585]: hashCode
          - text: 值却不相等。
        - paragraph [ref=e2586]:
          - strong [ref=e2587]: 思考
          - text: ：重写
          - code [ref=e2588]: equals()
          - text: 时没有重写
          - code [ref=e2589]: hashCode()
          - text: 方法的话，使用
          - code [ref=e2590]: HashMap
          - text: 可能会出现什么问题。
        - paragraph [ref=e2591]:
          - strong [ref=e2592]: 总结
          - text: ：
        - list [ref=e2593]:
          - listitem [ref=e2594]:
            - code [ref=e2595]: equals
            - text: 方法判断两个对象是相等的，那这两个对象的
            - code [ref=e2596]: hashCode
            - text: 值也要相等。
          - listitem [ref=e2597]:
            - text: 两个对象有相同的
            - code [ref=e2598]: hashCode
            - text: 值，他们也不一定是相等的（哈希碰撞）。
        - paragraph [ref=e2599]:
