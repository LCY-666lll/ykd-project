        - heading [level=2] [ref=e929]:
          - link "⭐️基本数据类型" [ref=e930] [cursor=pointer]:
            - /url: "#⭐️基本数据类型"
        - heading [level=3] [ref=e931]:
          - link "Java 中的几种基本数据类型了解么？" [ref=e932] [cursor=pointer]:
            - /url: "#java-中的几种基本数据类型了解么"
        - paragraph [ref=e933]: Java 中有 8 种基本数据类型，分别为：
        - list [ref=e934]:
          - listitem [ref=e935]:
            - text: 6 种数字类型：
            - list [ref=e936]:
              - listitem [ref=e937]:
                - text: 4 种整数型：
                - code [ref=e938]: byte
                - text: 、
                - code [ref=e939]: short
                - text: 、
                - code [ref=e940]: int
                - text: 、
                - code [ref=e941]: long
              - listitem [ref=e942]:
                - text: 2 种浮点型：
                - code [ref=e943]: float
                - text: 、
