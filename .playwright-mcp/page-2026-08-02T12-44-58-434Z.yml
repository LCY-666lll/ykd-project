            - /url: "#基本类型和包装类型的区别"
        - list [ref=e1046]:
          - listitem [ref=e1047]:
            - strong [ref=e1048]: 用途
            - text: ：除了定义一些常量和局部变量之外，我们在其他地方比如方法参数、对象属性中很少会使用基本类型来定义变量。并且，包装类型可用于泛型，而基本类型不可以。
          - listitem [ref=e1049]:
            - strong [ref=e1050]: 存储方式
            - text: ：基本数据类型的局部变量存放在 Java 虚拟机栈中的局部变量表中，基本数据类型的成员变量（未被
            - code [ref=e1051]: static
            - text: 修饰 ）存放在 Java 虚拟机的堆中。包装类型属于对象类型，我们知道几乎所有对象实例都存在于堆中。
          - listitem [ref=e1052]:
            - strong [ref=e1053]: 占用空间
            - text: ：相比于包装类型（对象类型）， 基本数据类型占用的空间往往非常小。
          - listitem [ref=e1054]:
            - strong [ref=e1055]: 默认值
            - text: ：成员变量包装类型不赋值就是
            - code [ref=e1056]: "null"
            - text: ，而基本类型有默认值且不是
            - code [ref=e1057]: "null"
            - text: 。
          - listitem [ref=e1058]:
            - strong [ref=e1059]: 比较方式
            - text: ：对于基本数据类型来说，
            - code [ref=e1060]: ==
            - text: 比较的是值。对于包装数据类型来说，
            - code [ref=e1061]: ==
            - text: 比较的是对象的内存地址。所有整型包装类对象之间值的比较，全部使用
            - code [ref=e1062]: equals()
            - text: 方法。
        - paragraph [ref=e1063]:
          - strong [ref=e1064]: 为什么说是几乎所有对象实例都存在于堆中呢？
          - text: 这是因为 HotSpot 虚拟机引入了 JIT 优化之后，会对对象进行逃逸分析，如果发现某一个对象并没有逃逸到方法外部，那么就可能通过标量替换来实现栈上分配，而避免堆上分配内存
        - paragraph [ref=e1065]:
          - text: ⚠️ 注意：
          - strong [ref=e1066]: 基本数据类型存放在栈中是一个常见的误区！
          - text: 基本数据类型的存储位置取决于它们的作用域和声明方式。如果它们是局部变量，那么它们会存放在栈中；如果它们是成员变量，那么它们会存放在堆/方法区/元空间中。
