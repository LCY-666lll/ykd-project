            - /url: "#继承"
        - paragraph [ref=e1974]: 不同类型的对象，相互之间经常有一定数量的共同点。例如，小明同学、小红同学、小李同学，都共享学生的特性（班级、学号等）。同时，每一个对象还定义了额外的特性使得他们与众不同。例如小明的数学比较好，小红的性格惹人喜爱；小李的力气比较大。继承是使用已存在的类的定义作为基础建立新类的技术，新类的定义可以增加新的数据或新的功能，也可以用父类的功能，但不能选择性地继承父类。通过使用继承，可以快速地创建新的类，可以提高代码的重用，程序的可维护性，节省大量创建新类的时间 ，提高我们的开发效率。
        - paragraph [ref=e1975]:
          - strong [ref=e1976]: 关于继承如下 3 点请记住：
        - list [ref=e1977]:
          - listitem [ref=e1978]:
            - text: 子类拥有父类对象所有的属性和方法（包括私有属性和私有方法），但是父类中的私有属性和方法子类是无法访问，
            - strong [ref=e1979]: 只是拥有
            - text: 。
          - listitem [ref=e1980]: 子类可以拥有自己属性和方法，即子类可以对父类进行扩展。
          - listitem [ref=e1981]: 子类可以用自己的方式实现父类的方法。（以后介绍）。
        - heading [level=4] [ref=e1982]:
          - link "多态" [ref=e1983] [cursor=pointer]:
            - /url: "#多态"
        - paragraph [ref=e1984]: 多态，顾名思义，表示一个对象具有多种的状态，具体表现为父类的引用指向子类的实例。
        - paragraph [ref=e1985]:
          - strong [ref=e1986]: "多态的特点:"
        - list [ref=e1987]:
          - listitem [ref=e1988]: 对象类型和引用类型之间具有继承（类）/实现（接口）的关系；
          - listitem [ref=e1989]: 引用类型变量发出的方法调用的到底是哪个类中的方法，必须在程序运行期间才能确定；
          - listitem [ref=e1990]: 多态不能调用“只在子类存在但在父类不存在”的方法；
          - listitem [ref=e1991]: 如果子类重写了父类的方法，真正执行的是子类重写的方法，如果子类没有重写父类的方法，执行的是父类的方法。
        - heading [level=3] [ref=e1992]:
          - link "⭐️接口和抽象类有什么共同点和区别？" [ref=e1993] [cursor=pointer]:
