        - list [ref=e1464]:
          - listitem [ref=e1465]:
            - strong [ref=e1466]: 语法形式
            - text: ：从语法形式上看，成员变量是属于类的，而局部变量是在代码块或方法中定义的变量或是方法的参数；成员变量可以被
            - code [ref=e1467]: public
            - text: ","
            - code [ref=e1468]: private
            - text: ","
            - code [ref=e1469]: static
            - text: 等修饰符所修饰，而局部变量不能被访问控制修饰符及
            - code [ref=e1470]: static
            - text: 所修饰；但是，成员变量和局部变量都能被
            - code [ref=e1471]: final
            - text: 所修饰。
          - listitem [ref=e1472]:
            - strong [ref=e1473]: 存储方式
            - text: ：从变量在内存中的存储方式来看，如果成员变量是使用
            - code [ref=e1474]: static
            - text: 修饰的，那么这个成员变量是属于类的，如果没有使用
            - code [ref=e1475]: static
            - text: 修饰，这个成员变量是属于实例的。而对象存在于堆内存，局部变量则存在于栈内存。
          - listitem [ref=e1476]:
            - strong [ref=e1477]: 生存时间
            - text: ：从变量在内存中的生存时间上看，成员变量是对象的一部分，它随着对象的创建而存在，而局部变量随着方法的调用而自动生成，随着方法的调用结束而消亡。
          - listitem [ref=e1478]:
            - strong [ref=e1479]: 默认值
            - text: ：从变量是否有默认值来看，成员变量如果没有被赋初始值，则会自动以类型的默认值而赋值（一种情况例外:被
            - code [ref=e1480]: final
            - text: 修饰的成员变量也必须显式地赋值），而局部变量则不会自动赋值。
        - paragraph [ref=e1481]:
          - strong [ref=e1482]: 为什么成员变量有默认值？
        - list [ref=e1483]:
          - listitem [ref=e1484]:
            - paragraph [ref=e1485]: 先不考虑变量类型，如果没有默认值会怎样？变量存储的是内存地址对应的任意随机值，程序读取该值运行会出现意外。
          - listitem [ref=e1486]:
            - paragraph [ref=e1487]: 默认值有两种设置方式：手动和自动，根据第一点，没有手动赋值一定要自动赋值。成员变量在运行时可借助反射等方法手动赋值，而局部变量不行。
          - listitem [ref=e1488]:
            - paragraph [ref=e1489]: 对于编译器（javac）来说，局部变量没赋值很好判断，可以直接报错。而成员变量可能是运行时赋值，无法判断，误报“没默认值”又会影响用户体验，所以采用自动赋默认值。
