            - strong [ref=e1998]: 实例化
            - text: ：接口和抽象类都不能直接实例化，只能被实现（接口）或继承（抽象类）后才能创建具体的对象。
          - listitem [ref=e1999]:
            - strong [ref=e2000]: 抽象方法
            - text: ：接口和抽象类都可以包含抽象方法。抽象方法没有方法体，必须在子类或实现类中实现。
        - heading [level=4] [ref=e2001]:
