        - heading [level=3] [ref=e1744]:
          - link "⭐️面向对象和面向过程的区别" [ref=e1745] [cursor=pointer]:
            - /url: "#⭐️面向对象和面向过程的区别"
        - paragraph [ref=e1746]: 面向过程编程（Procedural-Oriented Programming，POP）和面向对象编程（Object-Oriented Programming，OOP）是两种常见的编程范式，两者的主要区别在于解决问题的方式不同：
        - list [ref=e1747]:
          - listitem [ref=e1748]:
            - strong [ref=e1749]: 面向过程编程（POP）
            - text: ：面向过程把解决问题的过程拆成一个个方法，通过一个个方法的执行解决问题。
          - listitem [ref=e1750]:
            - strong [ref=e1751]: 面向对象编程（OOP）
            - text: ：面向对象会先抽象出对象，然后用对象执行方法的方式解决问题。
        - paragraph [ref=e1752]: 相比较于 POP，OOP 开发的程序一般具有下面这些优点：
        - list [ref=e1753]:
          - listitem [ref=e1754]:
            - strong [ref=e1755]: 易维护
            - text: ：由于良好的结构和封装性，OOP 程序通常更容易维护。
          - listitem [ref=e1756]:
            - strong [ref=e1757]: 易复用
            - text: ：通过继承和多态，OOP 设计使得代码更具复用性，方便扩展功能。
          - listitem [ref=e1758]:
            - strong [ref=e1759]: 易扩展
            - text: ：模块化设计使得系统扩展变得更加容易和灵活。
        - paragraph [ref=e1760]: POP 的编程方式通常更为简单和直接，适合处理一些较简单的任务。
        - paragraph [ref=e1761]:
          - text: "POP 和 OOP 的性能差异主要取决于它们的运行机制，而不仅仅是编程范式本身。因此，简单地比较两者的性能是一个常见的误区（相关 issue :"
