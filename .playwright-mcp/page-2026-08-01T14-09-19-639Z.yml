                - paragraph [ref=f6e1043]:
                  - text: Dify is an open-source LLM app development platform. Its intuitive interface combines AI workflow, RAG pipeline, agent capabilities, model management, observability features (including
                  - link "Opik" [ref=f6e1044] [cursor=pointer]:
                    - /url: https://www.comet.com/docs/opik/integrations/dify
                  - text: ","
                  - link "Langfuse" [ref=f6e1045] [cursor=pointer]:
                    - /url: https://docs.langfuse.com
                  - text: ", and"
                  - link "Arize Phoenix" [ref=f6e1046] [cursor=pointer]:
                    - /url: https://docs.arize.com/phoenix
                  - text: ") and more, letting you quickly go from prototype to production. Here's a list of the core features:"
                - generic [ref=f6e1047]:
                  - heading "Quick start" [level=2] [ref=f6e1048]
                  - 'link "Permalink: Quick start" [ref=f6e1049] [cursor=pointer]':
                    - /url: "#quick-start"
                - blockquote [ref=f6e1052]:
                  - paragraph [ref=f6e1053]: "Before installing Dify, make sure your machine meets the following minimum system requirements:"
                  - list [ref=f6e1054]:
                    - listitem [ref=f6e1055]: CPU >= 2 Core
                    - listitem [ref=f6e1056]: RAM >= 4 GiB
                - paragraph [ref=f6e1057]:
                  - text: The easiest way to start the Dify server is through
                  - link "Docker Compose" [ref=f6e1058] [cursor=pointer]:
                    - /url: /langgenius/dify/blob/main/docker/docker-compose.yaml
                  - text: . Before running Dify with the following commands, make sure that
                  - link "Docker" [ref=f6e1059] [cursor=pointer]:
                    - /url: https://docs.docker.com/get-docker/
                  - text: "and Docker Compose v2.24.0 or later are installed on your machine:"
                - generic [ref=f6e1060]:
                  - generic [ref=f6e1061]: cd dify cd docker cp .env.example .env docker compose up -d
                  - button "Copy code to clipboard" [ref=f6e1063] [cursor=pointer]
                - paragraph [ref=f6e1067]:
                  - text: After running, you can access the Dify dashboard in your browser at
                  - link "http://localhost/install" [ref=f6e1068] [cursor=pointer]:
                    - /url: http://localhost/install
                  - text: and start the initialization process.
                - generic [ref=f6e1069]:
                  - heading "Seeking help" [level=4] [ref=f6e1070]
                  - 'link "Permalink: Seeking help" [ref=f6e1071] [cursor=pointer]':
                    - /url: "#seeking-help"
                - paragraph [ref=f6e1074]:
                  - text: Please refer to our
                  - link "FAQ" [ref=f6e1075] [cursor=pointer]:
                    - /url: https://docs.dify.ai/getting-started/install-self-hosted/faqs
                  - text: if you encounter problems setting up Dify. Reach out to
                  - link "the community and us" [ref=f6e1076] [cursor=pointer]:
                    - /url: "#community--contact"
                  - text: if you are still having issues.
                - blockquote [ref=f6e1077]:
                  - paragraph [ref=f6e1078]:
                    - text: If you'd like to contribute to Dify or do additional development, refer to our
                    - link "guide to deploying from source code" [ref=f6e1079] [cursor=pointer]:
                      - /url: https://docs.dify.ai/getting-started/install-self-hosted/local-source-code
                - generic [ref=f6e1080]:
                  - heading "Key features" [level=2] [ref=f6e1081]
                  - 'link "Permalink: Key features" [ref=f6e1082] [cursor=pointer]':
                    - /url: "#key-features"
                - paragraph [ref=f6e1085]:
                  - strong [ref=f6e1086]: 1. Workflow
                  - text: ": Build and test powerful AI workflows on a visual canvas, leveraging all the following features and beyond."
                - paragraph [ref=f6e1087]:
                  - strong [ref=f6e1088]: 2. Comprehensive model support
                  - text: ": Seamless integration with hundreds of proprietary / open-source LLMs from dozens of inference providers and self-hosted solutions, covering GPT, Mistral, Llama3, and any OpenAI API-compatible models. A full list of supported model providers can be found"
                  - link "here" [ref=f6e1089] [cursor=pointer]:
                    - /url: https://docs.dify.ai/getting-started/readme/model-providers
                  - text: .
                - paragraph [ref=f6e1090]:
                  - link [ref=f6e1091] [cursor=pointer]:
                    - /url: https://private-user-images.githubusercontent.com/13230914/321881730-5a17bdbe-097a-4100-8363-40255b70f6e3.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..L3IEG3wiaWxc3zapZLKAgOmMPzoj1ohcdikSYXTZuQ8
                    - img "providers-v5" [ref=f6e1092]
                - paragraph [ref=f6e1093]:
                  - strong [ref=f6e1094]: 3. Prompt IDE
                  - text: ": Intuitive interface for crafting prompts, comparing model performance, and adding additional features such as text-to-speech to a chat-based app."
                - paragraph [ref=f6e1095]:
                  - strong [ref=f6e1096]: 4. RAG Pipeline
                  - text: ": Extensive RAG capabilities that cover everything from document ingestion to retrieval, with out-of-box support for text extraction from PDFs, PPTs, and other common document formats."
                - paragraph [ref=f6e1097]:
                  - strong [ref=f6e1098]: 5. Agent capabilities
                  - text: ": You can define agents based on LLM Function Calling or ReAct, and add pre-built or custom tools for the agent. Dify provides 50+ built-in tools for AI agents, such as Google Search, DALL·E, Stable Diffusion and WolframAlpha."
                - paragraph [ref=f6e1099]:
                  - strong [ref=f6e1100]: 6. LLMOps
                  - text: ": Monitor and analyze application logs and performance over time. You could continuously improve prompts, datasets, and models based on production data and annotations."
                - paragraph [ref=f6e1101]:
                  - strong [ref=f6e1102]: 7. Backend-as-a-Service
                  - text: ": All of Dify's offerings come with corresponding APIs, so you could effortlessly integrate Dify into your own business logic."
